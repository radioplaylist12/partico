<!DOCTYPE html>
<html lang="pt-br">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: linear-gradient(135deg, #0a0a1a, #1a1a2e); overflow: hidden; height: 100vh; }
        
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff2d7f;
            --neon-purple: #8E2DE2;
            --forro-color: #ff6b35;
            --sertanejo-color: #8B4513;
            --mpb-color: #2ecc71;
            --pop-color: #e74c3c;
            --samba-color: #f1c40f;
            --brega-color: #ff69b4;
            --global-color: #1abc9c;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(circle at 20% 50%, rgba(0,243,255,0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255,45,127,0.1) 0%, transparent 50%);
        }
        
        .app { position: relative; z-index: 10; width: 100%; height: 100vh; display: flex; flex-direction: column; justify-content: space-between; background: transparent; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,243,255,0.3); }
        .genre-badge { background: rgba(0,243,255,0.15); padding: 6px 16px; border-radius: 30px; font-size: 0.75rem; font-weight: bold; color: var(--neon-cyan); border-left: 3px solid var(--neon-cyan); display: flex; align-items: center; gap: 8px; }
        .top-buttons { display: flex; gap: 12px; align-items: center; }
        .icon-btn { background: rgba(0,0,0,0.6); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; font-size: 1rem; border: 1px solid rgba(0,243,255,0.3); transition: transform 0.2s, background 0.2s; }
        .icon-btn:active { transform: scale(0.92); background: var(--neon-cyan); color: #000; }
        
        .now-playing {
            text-align: center;
            padding: 20px;
            margin-top: 80px;
        }
        .album-art {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, var(--forro-color), var(--neon-purple));
            border-radius: 30px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(255,107,53,0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(255,107,53,0.3); }
            50% { transform: scale(1.02); box-shadow: 0 0 60px rgba(255,107,53,0.5); }
        }
        .album-art i { font-size: 5rem; color: white; text-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .song-title { font-size: 1.4rem; font-weight: bold; color: white; margin-bottom: 5px; }
        .song-artist { font-size: 1rem; color: var(--forro-color); margin-bottom: 15px; }
        
        .info-scroll {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            z-index: 30;
            border-bottom: 1px solid rgba(0,243,255,0.3);
            overflow: hidden;
            white-space: nowrap;
        }
        .info-scroll p {
            color: white;
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 1px;
            animation: scrollText 20s linear infinite;
            display: inline-block;
            padding-right: 50px;
            text-shadow: 0 0 8px rgba(0,243,255,0.8);
        }
        @keyframes scrollText { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .genre-fab { position: fixed; bottom: 140px; right: 20px; z-index: 40; }
        .genre-fab-btn { 
            background: linear-gradient(135deg, var(--forro-color), var(--neon-purple), var(--neon-pink)); 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            color: white; 
            font-size: 1.6rem; 
            box-shadow: 0 0 20px rgba(255,107,53,0.5), 0 4px 15px rgba(0,0,0,0.3); 
            animation: float 3s ease-in-out infinite; 
            transition: all 0.3s ease;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .genre-fab-btn:active { transform: scale(0.95); }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        
        .genres-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 30px 30px 0 0;
            padding: 25px 20px 30px;
            z-index: 2000;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-height: 85vh;
            overflow-y: auto;
        }
        .genres-modal.open { transform: translateY(0); }
        .genres-modal h3 { text-align: center; margin-bottom: 20px; font-size: 1.4rem; background: linear-gradient(135deg, var(--forro-color), var(--neon-pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .genres-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .genre-card {
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255,255,255,0.2);
            aspect-ratio: 5 / 3;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 5px black;
            position: relative;
            flex-direction: column;
            gap: 8px;
        }
        .genre-card i { font-size: 2rem; }
        .genre-card .count { font-size: 0.7rem; opacity: 0.8; }
        .genre-card:hover { transform: scale(1.02); border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,243,255,0.3); }
        .genre-card:active { transform: scale(0.96); }
        .close-genres { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--forro-color), var(--neon-pink)); border: none; border-radius: 30px; color: #000; font-size: 1rem; cursor: pointer; font-weight: bold; }
        
        .bottom-controls {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0,243,255,0.3);
            padding: 12px 20px 25px;
            z-index: 20;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .bottom-controls.visible { transform: translateY(0); }
        
        .progress-time { display: flex; justify-content: space-between; font-size: 0.7rem; color: #aaa; margin-bottom: 4px; }
        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--forro-color), var(--neon-pink));
            width: 0%;
            border-radius: 4px;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px var(--forro-color);
            opacity: 0.8;
        }
        
        .buttons-row { display: flex; align-items: center; justify-content: center; gap: 25px; margin-top: 12px; }
        .ctrl-btn { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 1.2rem; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; transition: transform 0.1s, background 0.2s; }
        .ctrl-btn:active { transform: scale(0.92); background: var(--forro-color); color: #000; }
        .play-big { background: linear-gradient(135deg, var(--forro-color), var(--neon-pink)); width: 58px; height: 58px; font-size: 1.6rem; color: #000; border: none; }
        .shuffle-btn { background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 1rem; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; transition: all 0.2s; }
        .shuffle-btn.active { background: var(--forro-color); color: #000; border-color: var(--forro-color); }
        
        .menu-button { position: absolute; top: 12px; right: 12px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); color: white; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; z-index: 31; border: 1px solid rgba(0,243,255,0.3); transition: background 0.2s; }
        .menu-button:active { background: var(--forro-color); color: #000; }
        .menu-popup { position: absolute; top: 65px; right: 12px; background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); border-radius: 16px; padding: 10px; z-index: 32; display: none; flex-direction: column; gap: 8px; border: 1px solid var(--forro-color); min-width: 180px; }
        .menu-popup.open { display: flex; }
        .menu-popup button { background: rgba(255,255,255,0.08); border: none; color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.8rem; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; transition: background 0.2s; }
        .menu-popup button:active { background: var(--forro-color); color: #000; }
        
        .audio-indicator { position: absolute; top: 12px; right: 70px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 4px 10px; border-radius: 20px; font-size: 0.6rem; color: #ffaa00; z-index: 31; display: flex; align-items: center; gap: 5px; }
        
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a1a, #1a1a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }
        #splash.hidden { opacity: 0; pointer-events: none; }
        .splash-content { text-align: center; color: white; }
        .splash-loading { margin-top: 20px; background: rgba(0,0,0,0.7); padding: 8px 16px; border-radius: 30px; font-size: 0.8rem; }
        .splash-stats { margin-top: 15px; font-size: 0.7rem; color: #ff6b35; }
        
        #tap-to-start { position: fixed; bottom: 25%; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, var(--forro-color), var(--neon-pink)); color: #000; padding: 14px 32px; border-radius: 50px; font-weight: bold; font-size: 1rem; z-index: 10000; cursor: pointer; display: none; animation: btnPulse 1.5s infinite; white-space: nowrap; border: none; }
        @keyframes btnPulse { 0% { transform: translateX(-50%) scale(1); opacity: 0.9; } 50% { transform: translateX(-50%) scale(1.03); opacity: 1; } 100% { transform: translateX(-50%) scale(1); opacity: 0.9; } }
        
        .notification { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); color: var(--forro-color); padding: 8px 20px; border-radius: 30px; font-size: 0.75rem; z-index: 10001; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; border-left: 3px solid var(--forro-color); }
        .notification.show { opacity: 1; }
        
        .loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); padding: 12px 24px; border-radius: 50px; color: white; display: none; gap: 10px; z-index: 10002; font-size: 0.8rem; border: 1px solid var(--forro-color); }
        .loading.show { display: flex; }
        
        .tap-hint { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 6px 16px; border-radius: 30px; font-size: 0.6rem; color: #aaa; z-index: 25; pointer-events: none; white-space: nowrap; }
    </style>
</head>

        // ==================== FUNÇÕES ====================
        function showNotification(msg, duration = 2000) {
            notification.textContent = msg;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), duration);
        }

        function showLoading(show) { 
            if (show) loading.classList.add('show'); 
            else loading.classList.remove('show'); 
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function showControls() {
            bottomControls.classList.add('visible');
            if (hideControlsTimeout) clearTimeout(hideControlsTimeout);
            hideControlsTimeout = setTimeout(() => bottomControls.classList.remove('visible'), 5000);
        }

                songTitle.textContent = track.title;
                songArtist.textContent = track.artist;
                scrollText.innerHTML = `🎵 ${track.title} - ${track.artist} [${track.genero}] 🎵`;
                
                // Mudar cor do álbum baseado no gênero
                const albumArt = document.querySelector('.album-art');
                if (track.genero === "FORRÓ") {
                    albumArt.style.background = "linear-gradient(135deg, #ff6b35, #8E2DE2)";
                } else if (track.genero === "SERTANEJO") {
                    albumArt.style.background = "linear-gradient(135deg, #8B4513, #e74c3c)";
                } else if (track.genero === "MPB") {
                    albumArt.style.background = "linear-gradient(135deg, #2ecc71, #1abc9c)";
                } else {
                    albumArt.style.background = "linear-gradient(135deg, #00f3ff, #ff2d7f)";
                }
            }
        }

        function updateGenreBadge() {
            if (currentGenre === "TODOS") {
                genreBadge.innerHTML = '<i class="fas fa-list-ul"></i> TODOS OS GÊNEROS';
            } else {
                genreBadge.innerHTML = `<i class="fas fa-music"></i> ${currentGenre}`;
            }
        }

        function getMusicaAleatoria(evitarId = null) {
            if (currentPlaylist.length === 0) return null;
            let disponiveis = [...currentPlaylist];
            if (evitarId && disponiveis.length > 1) {
                disponiveis = disponiveis.filter(m => m.id !== evitarId);
            }
            if (disponiveis.length === 0) disponiveis = [...currentPlaylist];
            const randomIndex = Math.floor(Math.random() * disponiveis.length);
            return disponiveis[randomIndex];
        }

        function filterByGenre(genero) {
            currentGenre = genero;
            
            if (genero === "TODOS") {
                currentPlaylist = [...musicas];
            } else {
                // Garantir que está pegando o gênero correto (FORRÓ com acento)
                currentPlaylist = musicasPorGenero[genero] ? [...musicasPorGenero[genero]] : [];
            }
            
            if (currentPlaylist.length === 0) {
                showNotification(`⚠️ Nenhuma música encontrada no gênero ${genero}!`, 2000);
                currentPlaylist = [...musicas];
                currentGenre = "TODOS";
            }
            
            updateGenreBadge();
            
            // Embaralhar se necessário
            if (shuffleMode) {
                for (let i = currentPlaylist.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [currentPlaylist[i], currentPlaylist[j]] = [currentPlaylist[j], currentPlaylist[i]];
                }
            }
            
            currentIndex = 0;
            const novaMusica = currentPlaylist[currentIndex];
            if (novaMusica) {
                updateDisplay(novaMusica);
                if (isPlaying && isBackgroundActive) {
                    playMusic();
                }
            }
            
            document.getElementById('genresModal').classList.remove('open');
            
            // Mensagem especial para FORRÓ
            if (genero === "FORRÓ") {
                showNotification(`🎵 FORRÓ ATIVADO! ${currentPlaylist.length} músicas no estilo! 🎵`, 2500);
            } else {
                showNotification(`🎵 ${genero} ativado! ${currentPlaylist.length} músicas`, 2000);
            }
        }

        async function playMusic() {
            if (!isBackgroundActive) { 
                showNotification("⚠️ Clique em 'ATIVAR RÁDIO' primeiro!"); 
                return; 
            }
            
            if (currentPlaylist.length === 0) {
                showNotification("⚠️ Nenhuma música na playlist!", 2000);
                return;
            }
            
            const track = currentPlaylist[currentIndex];
            if (!track || !track.src) {
                nextTrack();
                return;
            }
            
            showLoading(true);
            audio.src = track.src;
            audio.load();
            
            return new Promise((resolve) => {
                const timeout = setTimeout(() => { 
                    showLoading(false); 
                    showNotification(`Timeout: ${track.title}`, 2000);
                    nextTrack(); 
                    resolve(false); 
                }, 10000);
                
                audio.oncanplaythrough = async () => {
                    clearTimeout(timeout);
                    try {
                        await audio.play();
                        isPlaying = true;
                        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        startTimer();
                        updateDisplay(track);
                        
                        // Estatísticas
                        stats.totalPlayed++;
                        stats.genreCount[track.genero] = (stats.genreCount[track.genero] || 0) + 1;
                        localStorage.setItem('radio_stats', JSON.stringify(stats));
                        
                        showLoading(false);
                        resolve(true);
                    } catch(e) { 
                        clearTimeout(timeout); 
                        showLoading(false); 
                        showNotification(`Erro ao tocar: ${track.title}`, 2000);
                        resolve(false); 
                    }
                };
                
                audio.onerror = () => { 
                    clearTimeout(timeout); 
                    showLoading(false); 
                    nextTrack(); 
                    resolve(false); 
                };
                
                audio.onended = () => { nextTrack(); };
            });
        }

        function pauseMusic() { 
            audio.pause(); 
            isPlaying = false; 
            playBtn.innerHTML = '<i class="fas fa-play"></i>'; 
            stopTimer(); 
        }
        
        function togglePlay() { 
            if (!isBackgroundActive) { 
                showNotification("Ative o áudio primeiro!"); 
                return; 
            } 
            isPlaying ? pauseMusic() : playMusic(); 
            showControls(); 
        }

        function nextTrack() {
            if (currentPlaylist.length === 0) return;
            
            if (shuffleMode) {
                const newIndex = Math.floor(Math.random() * currentPlaylist.length);
                currentIndex = newIndex;
            } else {
                currentIndex = (currentIndex + 1) % currentPlaylist.length;
            }
            
            const track = currentPlaylist[currentIndex];
            if (track) {
                updateDisplay(track);
                if (isPlaying) {
                    playMusic();
                }
            }
            showControls();
        }

        function prevTrack() {
            if (currentPlaylist.length === 0) return;
            
            if (shuffleMode) {
                const newIndex = Math.floor(Math.random() * currentPlaylist.length);
                currentIndex = newIndex;
            } else {
                currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            }
            
            const track = currentPlaylist[currentIndex];
            if (track) {
                updateDisplay(track);
                if (isPlaying) {
                    playMusic();
                }
            }
            showControls();
        }

        function toggleShuffle() { 
            shuffleMode = !shuffleMode; 
            shuffleBtn.classList.toggle('active', shuffleMode); 
            showNotification(shuffleMode ? '🔀 Embaralhado ON' : '➡️ Sequencial', 1000);
            
            if (shuffleMode && currentPlaylist.length > 0) {
                for (let i = currentPlaylist.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [currentPlaylist[i], currentPlaylist[j]] = [currentPlaylist[j], currentPlaylist[i]];
                }
                currentIndex = 0;
                updateDisplay(currentPlaylist[0]);
            }
            showControls(); 
        }

        function startTimer() {
            stopTimer();
            timerInterval = setInterval(() => {
                if (isPlaying && audio.duration && !audio.paused) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = percent + '%';
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                    totalTimeEl.textContent = formatTime(audio.duration);
                }
            }, 200);
        }
        
        function stopTimer() { 
            if (timerInterval) clearInterval(timerInterval); 
            timerInterval = null; 
        }

        function buildGenresGrid() {
            const grid = document.getElementById('genresGrid');
            grid.innerHTML = '';
            
            // Lista de gêneros - SOMENTE UM FORRÓ (COM ACENTO)
            const generos = [
                { nome: "TODOS", icono: "fa-list", cor: "#ffffff", count: musicas.length },
                { nome: "FORRÓ", icono: "fa-drum", cor: "#ff6b35", count: musicasPorGenero["FORRÓ"]?.length || 0 },
                { nome: "SERTANEJO", icono: "fa-hat-cowboy", cor: "#8B4513", count: musicasPorGenero["SERTANEJO"]?.length || 0 },
                { nome: "MPB", icono: "fa-guitar", cor: "#2ecc71", count: musicasPorGenero["MPB"]?.length || 0 },
                { nome: "POP", icono: "fa-microphone", cor: "#e74c3c", count: musicasPorGenero["POP"]?.length || 0 },
                { nome: "SAMBA", icono: "fa-drumstick-bite", cor: "#f1c40f", count: musicasPorGenero["SAMBA"]?.length || 0 },
                { nome: "BREGA", icono: "fa-heart", cor: "#ff69b4", count: musicasPorGenero["BREGA"]?.length || 0 },
                { nome: "GLOBAL HITS", icono: "fa-globe", cor: "#1abc9c", count: musicasPorGenero["GLOBAL HITS"]?.length || 0 }
            ];
            
            generos.forEach(g => {
                const card = document.createElement('div');
                card.className = 'genre-card';
                card.style.border = `2px solid ${g.cor}`;
                card.innerHTML = `<i class="fas ${g.icono}" style="color: ${g.cor}"></i><span>${g.nome}</span><span class="count">${g.count} músicas</span>`;
                card.onclick = () => { filterByGenre(g.nome); };
                grid.appendChild(card);
            });
        }

        function openFeedback() {
            const track = currentPlaylist[currentIndex];
            if (!track) return;
            const msg = `🎵 *RÁDIO PLAY 12 - FEEDBACK* 🎵%0A%0A🎤 Música: ${track.title}%0A👤 Artista: ${track.artist}%0A🎸 Gênero: ${track.genero}%0A⭐ Avaliação: ☆☆☆☆☆%0A💬 Comentário: `;
            window.open(`https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
            showNotification("📱 Feedback via WhatsApp!", 1500);
        }

        function showStats() {
            let topGenre = "Nenhum", max = 0;
            for (const [genre, count] of Object.entries(stats.genreCount)) {
                if (count > max) { max = count; topGenre = genre; }
            }
            showNotification(`📊 ${stats.totalPlayed} músicas ouvidas | Favorito: ${topGenre}`, 3000);
        }

        async function ativarAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.0001;
                gainNode.connect(audioCtx.destination);
                const oscillator = audioCtx.createOscillator();
                oscillator.connect(gainNode);
                oscillator.start();
                oscillator.stop(0.1);
                await audioCtx.resume();
                
                isBackgroundActive = true;
                audioIndicator.innerHTML = '<i class="fas fa-music"></i> Ativo';
                audioIndicator.style.color = '#4ade80';
                
                await playMusic();
                return true;
            } catch (error) { 
                console.log("Erro áudio:", error);
                isBackgroundActive = true;
                await playMusic();
                return true;
            }
        }

        // ==================== CARREGAR PLAYLIST ====================
        function carregarPlaylist() {
            musicas = PLAYLIST;
            
            // Organizar por gênero - APENAS UM FORRÓ (COM ACENTO)
            musicasPorGenero = {};
            musicas.forEach(m => {
                // Garantir que o gênero está normalizado
                const generoNormalizado = m.genero === "FORRÓ" ? "FORRÓ" : m.genero;
                if (!musicasPorGenero[generoNormalizado]) {
                    musicasPorGenero[generoNormalizado] = [];
                }
                musicasPorGenero[generoNormalizado].push({...m, genero: generoNormalizado});
            });
            
            // Mostrar varredura no console
            console.log("🔍 VARREDURA DA PLAYLIST:");
            console.log(`Total: ${musicas.length} músicas`);
            Object.keys(musicasPorGenero).forEach(g => {
                console.log(`  ${g}: ${musicasPorGenero[g].length} músicas`);
            });
            
            // Verificar FORRÓ especificamente
            if (musicasPorGenero["FORRÓ"]) {
                console.log(`✅ FORRÓ encontrado com ${musicasPorGenero["FORRÓ"].length} músicas!`);
                console.log("Músicas de FORRÓ:");
                musicasPorGenero["FORRÓ"].forEach(m => {
                    console.log(`   - ${m.title} (${m.artist})`);
                });
            } else {
                console.log("❌ ERRO: Nenhuma música de FORRÓ encontrada!");
            }
            
            const splashStats = document.getElementById('splashStats');
            const forroCount = musicasPorGenero["FORRÓ"]?.length || 0;
            splashStats.innerHTML = `📊 ${musicas.length} músicas<br>🎸 FORRÓ: ${forroCount} | SERTANEJO: ${musicasPorGenero["SERTANEJO"]?.length || 0} | MPB: ${musicasPorGenero["MPB"]?.length || 0}`;
            
            document.getElementById('splashStatus').innerHTML = `<i class="fas fa-check-circle"></i> ${musicas.length} músicas carregadas!`;
            
            // Playlist inicial - TODOS
            currentPlaylist = [...musicas];
            currentGenre = "TODOS";
            updateGenreBadge();
            
            if (currentPlaylist.length > 0) {
                currentIndex = 0;
                updateDisplay(currentPlaylist[0]);
            }
            
            buildGenresGrid();
            
            // Carregar estatísticas salvas
            const savedStats = localStorage.getItem('radio_stats');
            if (savedStats) {
                try { stats = JSON.parse(savedStats); } catch(e) {}
            }
            
            setTimeout(() => {
                splash.classList.add('hidden');
                setTimeout(() => {
                    splash.style.display = 'none';
                    appContainer.style.display = 'block';
                    menuButton.style.display = 'flex';
                    tapToStart.style.display = 'block';
                }, 500);
            }, 1500);
        }

        // ==================== EVENTOS ====================
        document.getElementById('progressBar').addEventListener('click', (e) => {
            if (audio.duration) {
                const rect = e.currentTarget.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audio.currentTime = percent * audio.duration;
                showControls();
            }
        });
        
        playBtn.addEventListener('click', togglePlay);
        document.getElementById('nextBtn').addEventListener('click', nextTrack);
        document.getElementById('prevBtn').addEventListener('click', prevTrack);
        shuffleBtn.addEventListener('click', toggleShuffle);
        document.getElementById('genreFab').addEventListener('click', () => { 
            document.getElementById('genresModal').classList.add('open'); 
            showControls(); 
        });
        document.getElementById('closeGenresBtn').addEventListener('click', () => { 
            document.getElementById('genresModal').classList.remove('open'); 
        });
        
        document.getElementById('shareBtn').addEventListener('click', () => {
            if (navigator.share) navigator.share({ title: 'Rádio Play 12', text: '🎵 Rádio com IA', url: location.href });
            else { navigator.clipboard.writeText(location.href); showNotification('🔗 Link copiado!'); }
            showControls();
        });
        
        document.getElementById('shareMenuBtn').addEventListener('click', () => {
            if (navigator.share) navigator.share({ title: 'Rádio Play 12', text: '🎵 Rádio com IA', url: location.href });
            else { navigator.clipboard.writeText(location.href); showNotification('🔗 Link copiado!'); }
            document.getElementById('menuPopup').classList.remove('open');
        });
        
        document.getElementById('fullscreenMenuBtn').addEventListener('click', () => { 
            document.documentElement.requestFullscreen(); 
            document.getElementById('menuPopup').classList.remove('open'); 
        });
        
        document.getElementById('feedbackMenuBtn').addEventListener('click', () => { 
            openFeedback(); 
            document.getElementById('menuPopup').classList.remove('open'); 
        });
        
        document.getElementById('statsMenuBtn').addEventListener('click', () => { 
            showStats(); 
            document.getElementById('menuPopup').classList.remove('open'); 
        });
        
        document.getElementById('tap-to-start').addEventListener('click', async () => {
            showNotification('🔊 Ativando áudio...', 1500);
            await ativarAudio();
            tapToStart.style.display = 'none';
            try { document.documentElement.requestFullscreen(); } catch(e) {}
        });
        
        document.getElementById('menuButton').addEventListener('click', (e) => { 
            e.stopPropagation(); 
            document.getElementById('menuPopup').classList.toggle('open'); 
            showControls(); 
        });
        
        document.addEventListener('click', (e) => { 
            if (!document.getElementById('menuButton').contains(e.target)) 
                document.getElementById('menuPopup').classList.remove('open'); 
        });
        
        document.addEventListener('click', () => showControls());
        document.addEventListener('touchstart', () => showControls());
        
        // INICIAR
        carregarPlaylist();
    </script>
</body>
</html>
