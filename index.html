                  <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rádio Pático • Toca com tela bloqueada</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0b1120 0%, #19233c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .radio-card {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 30px 24px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .logo {
            width: 100px;
            height: 100px;
            background: #ff5500;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            box-shadow: 0 0 0 4px rgba(255,85,0,0.3);
        }
        h1 {
            color: white;
            font-size: 2rem;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .status {
            color: #ccc;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .play-btn {
            background: #ff5500;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 2.5rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 20px rgba(255,85,0,0.4);
            margin-bottom: 20px;
        }
        .play-btn:active {
            transform: scale(0.92);
        }
        .info {
            background: rgba(255,255,255,0.1);
            border-radius: 60px;
            padding: 12px 20px;
            color: white;
            font-weight: bold;
        }
        .small-note {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 20px;
        }
        #activateBtn {
            background: #25D366;
            color: black;
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: bold;
            margin-top: 16px;
            cursor: pointer;
            width: 100%;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
<div class="radio-card">
    <div class="logo">📻</div>
    <h1>Rádio Pático</h1>
    <div class="status" id="statusText">🔇 Clique em "ATIVAR ÁUDIO"</div>
    <button class="play-btn" id="playPauseBtn" disabled>▶️</button>
    <div class="info" id="nowPlaying">🎙️ Ao vivo 24h</div>
    <button id="activateBtn">🔊 ATIVAR ÁUDIO (toca com tela bloqueada)</button>
    <div class="small-note">✔️ Funciona com tela bloqueada | Stream contínuo</div>
</div>

<!-- Elementos de áudio -->
<audio id="radioStream" preload="none" crossorigin="anonymous"></audio>
<audio id="silentAudio" loop style="display: none;"></audio>

<script>
    // ========= CONFIGURAÇÃO =========
    // ⚠️ SUBSTITUIR PELA URL REAL DO RÁDIO PÁTICO (ex: .mp3, .m3u8, .aac)
    const STREAM_URL = "https://exemplo.com/radio-patico-stream.mp3";  // <-- TROQUE AQUI!
    
    // ========= ELEMENTOS =========
    const radioPlayer = document.getElementById('radioStream');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const statusDiv = document.getElementById('statusText');
    const activateBtn = document.getElementById('activateBtn');
    
    let audioCtx = null;
    let silentSource = null;
    let streamSource = null;
    let gainNode = null;
    let isAudioActive = false;
    let isPlaying = false;
    let keepAliveInterval = null;
    
    // ========= 1. INICIALIZAÇÃO DO AUDIO CONTEXT (Web Audio) =========
    async function initAudioContext() {
        if (isAudioActive && audioCtx && audioCtx.state === 'running') return true;
        
        try {
            // Criar ou retomar contexto
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
            
            // Criar buffer de silêncio (4 segundos)
            const sampleRate = audioCtx.sampleRate;
            const bufferLength = sampleRate * 4;
            const silentBuffer = audioCtx.createBuffer(1, bufferLength, sampleRate);
            const channelData = silentBuffer.getChannelData(0);
            for (let i = 0; i < bufferLength; i++) channelData[i] = 0;  // silêncio total
            
            // Criar fonte de silêncio e tocar em loop
            if (silentSource) {
                try { silentSource.stop(); silentSource.disconnect(); } catch(e) {}
            }
            silentSource = audioCtx.createBufferSource();
            silentSource.buffer = silentBuffer;
            silentSource.loop = true;
            silentSource.connect(audioCtx.destination);
            silentSource.start();
            
            // Conectar o elemento <audio> do stream ao AudioContext
            if (streamSource) {
                try { streamSource.disconnect(); } catch(e) {}
            }
            streamSource = audioCtx.createMediaElementSource(radioPlayer);
            gainNode = audioCtx.createGain();
            gainNode.gain.value = 1;
            streamSource.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            isAudioActive = true;
            console.log('✅ AudioContext ativo - reprodução em segundo plano OK');
            return true;
        } catch (err) {
            console.error('Erro ao ativar AudioContext:', err);
            statusDiv.innerText = '❌ Erro ao ativar áudio. Tente novamente.';
            return false;
        }
    }
    
    // ========= 2. KEEP-ALIVE (evita suspensão) =========
    function startKeepAlive() {
        if (keepAliveInterval) clearInterval(keepAliveInterval);
        keepAliveInterval = setInterval(async () => {
            // Se o contexto foi suspenso, resumir
            if (audioCtx && audioCtx.state === 'suspended') {
                await audioCtx.resume();
                console.log('🔄 KeepAlive: AudioContext resumido');
            }
            // Se o silentSource parou por algum motivo, reiniciar
            if (silentSource && silentSource.buffer && silentSource.playbackState === 'finished') {
                try { silentSource.start(); } catch(e) {}
            }
            // Se deveria estar tocando mas o áudio está pausado, retomar
            if (isPlaying && radioPlayer.paused && isAudioActive) {
                console.log('🔄 KeepAlive: retomando stream');
                await radioPlayer.play().catch(e => console.warn);
            }
        }, 4000);
    }
    
    // ========= 3. WORKAROUND para iOS/macOS (áudio silencioso adicional) =========
    function setupSilentAudioWorkaround() {
        const silent = document.getElementById('silentAudio');
        if (!silent) return;
        // Criar um pequeno WAV silencioso em memória
        const createSilentWAV = () => {
            const sampleRate = 44100;
            const duration = 2;
            const numSamples = sampleRate * duration;
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);
            function writeString(view, offset, str) {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            }
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, numSamples * 2, true);
            let offset = 44;
            for (let i = 0; i < numSamples; i++) {
                view.setInt16(offset, 0, true);
                offset += 2;
            }
            return new Blob([buffer], { type: 'audio/wav' });
        };
        try {
            const blob = createSilentWAV();
            const url = URL.createObjectURL(blob);
            silent.src = url;
            silent.loop = true;
            silent.volume = 0.001;
            silent.play().catch(e => console.log('silent workaround:', e));
        } catch(e) {}
    }
    
    // ========= 4. FUNÇÕES DE PLAY/PAUSE DO RÁDIO =========
    async function startRadio() {
        if (!isAudioActive) {
            statusDiv.innerText = '⚠️ Ative o áudio primeiro!';
            return false;
        }
        if (!STREAM_URL || STREAM_URL === "https://exemplo.com/radio-patico-stream.mp3") {
            statusDiv.innerText = '⚠️ Configure a URL do stream no código!';
            return false;
        }
        try {
            // Só carrega se o src for diferente
            if (radioPlayer.src !== STREAM_URL) {
                radioPlayer.src = STREAM_URL;
                radioPlayer.load();
            }
            await radioPlayer.play();
            isPlaying = true;
            playPauseBtn.innerHTML = '⏸️';
            statusDiv.innerText = '📻 AO VIVO | Tela bloqueada ativa';
            return true;
        } catch (err) {
            console.error('Erro ao iniciar stream:', err);
            statusDiv.innerText = '❌ Erro no stream. Verifique a URL.';
            return false;
        }
    }
    
    function stopRadio() {
        radioPlayer.pause();
        isPlaying = false;
        playPauseBtn.innerHTML = '▶️';
        statusDiv.innerText = '⏸️ Pausado (clique em play)';
    }
    
    async function togglePlay() {
        if (!isAudioActive) {
            statusDiv.innerText = '🔇 Clique em "ATIVAR ÁUDIO" primeiro';
            return;
        }
        if (isPlaying) {
            stopRadio();
        } else {
            await startRadio();
        }
    }
    
    // ========= 5. VISIBILITY HANDLER (retoma ao voltar) =========
    function setupVisibilityHandler() {
        document.addEventListener('visibilitychange', async () => {
            if (!document.hidden && isPlaying && radioPlayer.paused) {
                console.log('👁️ Aba visível, retomando stream');
                await startRadio().catch(e => console.log);
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }
        });
    }
    
    // ========= 6. BOTÃO DE ATIVAÇÃO PRINCIPAL =========
    activateBtn.addEventListener('click', async () => {
        activateBtn.disabled = true;
        activateBtn.innerText = '🔄 Ativando...';
        const ok = await initAudioContext();
        if (ok) {
            startKeepAlive();
            setupVisibilityHandler();
            setupSilentAudioWorkaround();
            // Após ativar, já começa a tocar
            const started = await startRadio();
            if (started) {
                playPauseBtn.disabled = false;
                activateBtn.style.display = 'none';  // some depois de ativo
                statusDiv.innerText = '📻 Tocando com tela bloqueada ✅';
            } else {
                activateBtn.disabled = false;
                activateBtn.innerText = '🔊 ATIVAR ÁUDIO (tenta novamente)';
            }
        } else {
            activateBtn.disabled = false;
            activateBtn.innerText = '⚠️ Falhou, tente novamente';
        }
    });
    
    // Play/Pause (só fica habilitado após ativação)
    playPauseBtn.addEventListener('click', togglePlay);
    
    // Pré-carregar UI
    window.addEventListener('load', () => {
        playPauseBtn.disabled = true;
        statusDiv.innerText = '🔇 Pressione "ATIVAR ÁUDIO"';
        // se a URL não foi substituída, avisar
        if (STREAM_URL === "https://exemplo.com/radio-patico-stream.mp3") {
            statusDiv.innerText = '⚠️ EDITE A URL DO STREAM NO CÓDIGO';
        }
    });
</script>
</body>
</html>
