<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rádio Patico IA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Disco de Vinil Flutuante */
        .floating-vinyl {
            position: fixed;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #444, #0a0a0a);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.4s ease, left 2s ease, top 2s ease, background 0.3s ease;
            pointer-events: none;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            will-change: left, top;
        }
        .floating-vinyl.visible { opacity: 0.75; }
        .floating-vinyl.playing { animation: spinVinyl 2s linear infinite; }
        @keyframes spinVinyl { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .floating-vinyl::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #ff3366, #8b1a3a);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .floating-vinyl::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        /* Container do Player */
        .player-container {
            width: 100%;
            max-width: 400px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
            position: relative;
        }

        /* Capa do Álbum */
        .cover-art {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 20px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .cover-art i { font-size: 5rem; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }

        /* Informações da Música */
        .track-info { text-align: center; margin-bottom: 25px; }
        .track-title { color: white; font-size: 1.3rem; font-weight: 600; margin-bottom: 5px; }
        .track-artist { color: rgba(255,255,255,0.8); font-size: 0.9rem; }

        /* Barra de Progresso */
        .progress-area { margin-bottom: 25px; }
        .progress-time { display: flex; justify-content: space-between; color: rgba(255,255,255,0.7); font-size: 0.75rem; margin-bottom: 8px; }
        .progress-bar { height: 5px; background: rgba(255,255,255,0.2); border-radius: 5px; cursor: pointer; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #f093fb, #f5576c); width: 0%; border-radius: 5px; transition: width 0.1s linear; }

        /* Botões de Controle */
        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 25px; }
        .control-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .control-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.3); }
        .play-btn { width: 65px; height: 65px; background: white; color: #f5576c; font-size: 1.5rem; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        /* Botões de Ação */
        .action-buttons { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
        .action-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            padding: 8px 20px;
            border-radius: 25px;
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .action-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.25); }
        .like-btn { color: #4ade80; }
        .dislike-btn { color: #ef4444; }

        /* Genre Badge */
        .genre-badge {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 6px 15px;
            border-radius: 20px;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            z-index: 20;
            border-left: 3px solid #ff3366;
        }

        /* Overlay de Arte do Gênero */
        .genre-art-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .genre-art-overlay.show { opacity: 1; animation: artFadeInOut 3.5s ease forwards; }
        @keyframes artFadeInOut {
            0% { opacity: 0; transform: scale(0.95); }
            15% { opacity: 1; transform: scale(1); }
            85% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.05); }
        }
        .genre-art-content {
            text-align: center;
            padding: 20px 30px;
            border-radius: 30px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255,255,255,0.2);
            max-width: 85%;
        }
        .genre-art-content i { font-size: 3.5rem; display: block; margin-bottom: 12px; color: #fff; }
        .genre-art-content .genre-phrase { font-size: 1rem; font-weight: bold; color: #ffffff; letter-spacing: 0.5px; }
        .genre-art-content .genre-name { font-size: 0.7rem; color: rgba(255,255,255,0.7); margin-top: 8px; }

        /* Menu 3 Pontinhos - SEM SOMBRA */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 20;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.2s ease;
        }
        .menu-btn:active { transform: scale(0.92); background: #ff3366; }
        .menu-popup {
            position: fixed;
            top: 70px;
            right: 20px;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 10px;
            z-index: 21;
            display: none;
            flex-direction: column;
            gap: 5px;
            min-width: 160px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .menu-popup.open { display: flex; }
        .menu-popup button {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 10px;
            border-radius: 10px;
            color: white;
            text-align: left;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .menu-popup button:active { background: #ff3366; transform: scale(0.98); }

        /* Modal de Gêneros */
        .genres-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            z-index: 30;
            transform: translateY(100%);
            transition: transform 0.3s;
        }
        .genres-modal.open { transform: translateY(0); }
        .genres-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .genre-option {
            background: linear-gradient(135deg, #ff3366, #8b1a3a);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: bold;
            transition: all 0.15s ease;
        }
        .genre-option:active { transform: scale(0.95); }

        /* Modal Estatísticas */
        .stats-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 25px;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            width: 280px;
            text-align: center;
            border: 1px solid #ff3366;
        }
        .stats-modal.open { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
        .stats-modal h3 { color: #ff3366; margin-bottom: 15px; }
        .stats-modal p { color: white; margin: 10px 0; font-size: 0.9rem; }
        .stats-modal button { background: #ff3366; border: none; padding: 10px 20px; border-radius: 25px; color: white; margin-top: 15px; cursor: pointer; }

        /* Loading e Toast */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 15px 25px;
            border-radius: 50px;
            color: white;
            z-index: 200;
            display: none;
            border: 1px solid #ff3366;
        }
        #tap-to-start {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff3366, #ff6b9d);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            z-index: 50;
            border: none;
            white-space: nowrap;
            box-shadow: 0 5px 20px rgba(255,51,102,0.4);
            animation: btnPulse 1.5s infinite;
        }
        @keyframes btnPulse { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } 100% { transform: translateX(-50%) scale(1); } }
        .toast {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            z-index: 150;
            font-size: 0.8rem;
            border-left: 3px solid #ff3366;
            animation: fadeOut 2s forwards;
        }
        @keyframes fadeOut { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; visibility: hidden; } }
    </style>

let currentGenre = "SERTANEJO";
let filteredPlaylist = [...PLAYLIST];
let userLikes = JSON.parse(localStorage.getItem('radioLikes') || '[]');
let totalPlayed = parseInt(localStorage.getItem('totalPlayed') || '0');
let genreCount = JSON.parse(localStorage.getItem('genreCount') || '{}');

// Elementos DOM
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const likeBtn = document.getElementById('likeBtn');
const dislikeBtn = document.getElementById('dislikeBtn');
const trackTitle = document.getElementById('trackTitle');
const trackArtist = document.getElementById('trackArtist');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');
const genreBadge = document.getElementById('genreBadge');
const tapToStart = document.getElementById('tap-to-start');
const loading = document.getElementById('loading');
const menuBtn = document.getElementById('menuBtn');
const menuPopup = document.getElementById('menuPopup');
const genresModal = document.getElementById('genresModal');
const genresGrid = document.getElementById('genresGrid');
const openGenresBtn = document.getElementById('openGenresBtn');
const closeGenresBtn = document.getElementById('closeGenresBtn');
const statsModal = document.getElementById('statsModal');
const statPlayed = document.getElementById('statPlayed');
const statLiked = document.getElementById('statLiked');
const favGenre = document.getElementById('favGenre');
const closeStatsBtn = document.getElementById('closeStatsBtn');
const floatingVinyl = document.getElementById('floatingVinyl');
const genreArtOverlay = document.getElementById('genreArtOverlay');
const genreArtIcon = document.getElementById('genreArtIcon');
const genreArtPhrase = document.getElementById('genreArtPhrase');
const genreArtName = document.getElementById('genreArtName');

// Gêneros disponíveis
const genres = ["SERTANEJO", "FORRÓ", "FORRÓ ANTIGO", "SAMBA", "POP", "BREGA", "MPB", "VARIADAS", "MODA TOP", "TODOS"];

// Função para mostrar arte do gênero (frases claras)
function showGenreArt(genero) {
    const artConfig = {
        'SERTANEJO': { icon: 'fa-guitar', phrase: '🎸 Rádio Patico - Modão de Viola! O melhor do sertanejo!', name: '🇧🇷 SERTANEJO' },
        'FORRÓ': { icon: 'fa-drum', phrase: '🥁 Rádio Patico - Pega pra Capar! Arrasta a sandália!', name: '🔥 FORRÓ' },
        'FORRÓ ANTIGO': { icon: 'fa-accordion', phrase: '🪗 Rádio Patico - Forró Raiz! Sanfoneiro toca mais!', name: '📀 FORRÓ ANTIGO' },
        'SAMBA': { icon: 'fa-music', phrase: '🎵 Rádio Patico - Pagode na Veia! Samba que emociona!', name: '🎭 SAMBA' },
        'POP': { icon: 'fa-microphone-alt', phrase: '🌍 Rádio Patico - Pop Internacional! Hits que você ama!', name: '🌟 POP' },
        'BREGA': { icon: 'fa-heart', phrase: '💔 Rádio Patico - O Rei do Brega! Para sofrer com estilo!', name: '🎤 BREGA' },
        'MPB': { icon: 'fa-guitar', phrase: '🎶 Rádio Patico - Alma Brasileira! MPB de verdade!', name: '🎸 MPB' },
        'VARIADAS': { icon: 'fa-random', phrase: '🎲 Rádio Patico - Variedades! Um pouco de tudo!', name: '🌈 VARIADAS' },
        'MODA TOP': { icon: 'fa-star', phrase: '⭐ Rádio Patico - Moda Top! O que há de melhor!', name: '✨ MODA TOP' },
        'TODOS': { icon: 'fa-brain', phrase: '🤖 Rádio Patico IA - Aprendendo seu gosto! Recomendações inteligentes!', name: '🧠 IA ATIVA' }
    };
    const config = artConfig[genero] || artConfig['SERTANEJO'];
    genreArtIcon.className = `fas ${config.icon}`;
    genreArtPhrase.textContent = config.phrase;
    genreArtName.textContent = config.name;
    genreArtOverlay.classList.remove('show');
    void genreArtOverlay.offsetWidth;
    genreArtOverlay.classList.add('show');
    setTimeout(() => genreArtOverlay.classList.remove('show'), 3500);
}

// Função para atualizar a cor do disco de vinil
function updateVinylColor(genero) {
    const colors = {
        'SERTANEJO': 'radial-gradient(circle at 35% 35%, #D4A017, #8B6914)',
        'FORRÓ': 'radial-gradient(circle at 35% 35%, #E85D04, #DC2F02)',
        'FORRÓ ANTIGO': 'radial-gradient(circle at 35% 35%, #F4A261, #E76F51)',
        'SAMBA': 'radial-gradient(circle at 35% 35%, #2A9D8F, #1B4332)',
        'POP': 'radial-gradient(circle at 35% 35%, #0077B6, #00B4D8)',
        'BREGA': 'radial-gradient(circle at 35% 35%, #E76F51, #D62828)',
        'MPB': 'radial-gradient(circle at 35% 35%, #6A4E9B, #9B6DB5)',
        'VARIADAS': 'radial-gradient(circle at 35% 35%, #00B4D8, #0077B6)',
        'MODA TOP': 'radial-gradient(circle at 35% 35%, #FF006E, #3A86FF)'
    };
    floatingVinyl.style.background = colors[genero] || 'radial-gradient(circle at 35% 35%, #ff3366, #7a1f3a)';
}

// Movimento do disco pela tela
let vinylInterval = null;
function startVinylMovement() {
    if (vinylInterval) clearInterval(vinylInterval);
    vinylInterval = setInterval(() => {
        if (!floatingVinyl.classList.contains('visible')) return;
        const maxX = window.innerWidth - 100;
        const maxY = window.innerHeight - 150;
        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;
        floatingVinyl.style.transition = 'left 2s ease, top 2s ease';
        floatingVinyl.style.left = randomX + 'px';
        floatingVinyl.style.top = randomY + 'px';
    }, 5000);
}

// Funções do Player
function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function filterByGenre(genre) {
    if (genre === "TODOS") {
        filteredPlaylist = shuffleArray([...PLAYLIST]);
        currentGenre = "TODOS";
        genreBadge.innerHTML = `🎵 TODOS OS ESTILOS`;
    } else {
        filteredPlaylist = PLAYLIST.filter(m => m.genero === genre);
        if (filteredPlaylist.length === 0) filteredPlaylist = shuffleArray([...PLAYLIST]);
        filteredPlaylist = shuffleArray(filteredPlaylist);
        currentGenre = genre;
        genreBadge.innerHTML = `🎵 ${genre}`;
    }
    currentIndex = 0;
    updateTrackInfo();
    updateVinylColor(genre);
    showGenreArt(genre);
    if (isPlaying) playMusic();
}

function updateTrackInfo() {
    const track = filteredPlaylist[currentIndex];
    trackTitle.textContent = track.title;
    trackArtist.textContent = track.artist;
    durationEl.textContent = "0:00";
    currentTimeEl.textContent = "0:00";
    progressFill.style.width = "0%";
}

function playMusic() {
    const track = filteredPlaylist[currentIndex];
    audio.src = track.src;
    audio.load();
    loading.style.display = 'flex';
    
    audio.play().then(() => {
        isPlaying = true;
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        loading.style.display = 'none';
        floatingVinyl.classList.add('playing');
        
        totalPlayed++;
        localStorage.setItem('totalPlayed', totalPlayed);
        genreCount[track.genero] = (genreCount[track.genero] || 0) + 1;
        localStorage.setItem('genreCount', JSON.stringify(genreCount));
        updateStatsDisplay();
    }).catch(err => {
        console.log("Erro:", err);
        loading.style.display = 'none';
        showToast('⚠️ Clique em ATIVAR RÁDIO primeiro!', 2000);
    });
}

function pauseMusic() {
    audio.pause();
    isPlaying = false;
    playBtn.innerHTML = '<i class="fas fa-play"></i>';
    floatingVinyl.classList.remove('playing');
}

function nextMusic() {
    currentIndex = (currentIndex + 1) % filteredPlaylist.length;
    updateTrackInfo();
    if (isPlaying) playMusic();
}

function prevMusic() {
    currentIndex = (currentIndex - 1 + filteredPlaylist.length) % filteredPlaylist.length;
    updateTrackInfo();
    if (isPlaying) playMusic();
}

function formatTime(sec) {
    if (isNaN(sec)) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function showToast(msg, duration = 2000) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerHTML = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), duration);
}

function likeCurrent() {
    const track = filteredPlaylist[currentIndex];
    if (!userLikes.includes(track.id)) {
        userLikes.push(track.id);
        localStorage.setItem('radioLikes', JSON.stringify(userLikes));
        showToast(`👍 Curtiu "${track.title}"! IA aprendeu!`, 2000);
        updateStatsDisplay();
    } else {
        showToast(`❤️ Você já curtiu esta música`, 1500);
    }
}

function dislikeCurrent() {
    const track = filteredPlaylist[currentIndex];
    showToast(`👎 Não curtiu "${track.title}"`, 2000);
    nextMusic();
}

function updateStatsDisplay() {
    statPlayed.textContent = totalPlayed;
    statLiked.textContent = userLikes.length;
    let fav = "Nenhum", max = 0;
    for (const [g, c] of Object.entries(genreCount)) {
        if (c > max) { max = c; fav = g; }
    }
    favGenre.textContent = fav;
}

function buildGenresGrid() {
    genresGrid.innerHTML = '';
    genres.forEach(genre => {
        const btn = document.createElement('div');
        btn.className = 'genre-option';
        btn.textContent = genre === "TODOS" ? "🎲 TODOS" : genre;
        btn.onclick = () => {
            filterByGenre(genre);
            genresModal.classList.remove('open');
        };
        genresGrid.appendChild(btn);
    });
}

// Eventos
playBtn.onclick = () => {
    if (isPlaying) pauseMusic();
    else playMusic();
};
nextBtn.onclick = nextMusic;
prevBtn.onclick = prevMusic;
likeBtn.onclick = likeCurrent;
dislikeBtn.onclick = dislikeCurrent;

audio.ontimeupdate = () => {
    if (audio.duration) {
        const percent = (audio.currentTime / audio.duration) * 100;
        progressFill.style.width = percent + '%';
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
    }
};

audio.onended = nextMusic;

progressBar.onclick = (e) => {
    const rect = progressBar.getBoundingClientRect();
    const percent = (e.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = percent * audio.duration;
};

tapToStart.onclick = async () => {
    showToast('🔊 Ativando áudio...', 1000);
    try {
        await audio.play();
        isPlaying = true;
        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
        tapToStart.style.display = 'none';
        floatingVinyl.classList.add('visible');
        floatingVinyl.classList.add('playing');
        startVinylMovement();
        playMusic();
        showToast('✅ Rádio ativada! 🎧', 2000);
    } catch(err) {
        showToast('❌ Clique no botão e autorize o áudio!', 3000);
    }
};

// Menu
menuBtn.onclick = (e) => {
    e.stopPropagation();
    menuPopup.classList.toggle('open');
};
document.addEventListener('click', () => {
    menuPopup.classList.remove('open');
});
openGenresBtn.onclick = () => {
    genresModal.classList.add('open');
    menuPopup.classList.remove('open');
};
closeGenresBtn.onclick = () => {
    genresModal.classList.remove('open');
};
statsBtn.onclick = () => {
    updateStatsDisplay();
    statsModal.classList.add('open');
    menuPopup.classList.remove('open');
};
closeStatsBtn.onclick = () => {
    statsModal.classList.remove('open');
};

// Controle de volume na lateral
let volumeTouchStart = 0;
document.addEventListener('touchstart', (e) => {
    if (e.touches[0].clientX > window.innerWidth - 40) {
        volumeTouchStart = e.touches[0].clientY;
    }
});
document.addEventListener('touchmove', (e) => {
    if (e.touches[0].clientX > window.innerWidth - 40 && volumeTouchStart) {
        const delta = (volumeTouchStart - e.touches[0].clientY) / window.innerHeight;
        let newVol = Math.min(1, Math.max(0, audio.volume + delta));
        audio.volume = newVol;
        showToast(`🔊 Volume: ${Math.round(newVol * 100)}%`, 800);
        volumeTouchStart = e.touches[0].clientY;
    }
});

// Swipe para próxima/anterior
let touchStartX = 0;
document.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
});
document.addEventListener('touchend', (e) => {
    const diff = e.changedTouches[0].screenX - touchStartX;
    if (Math.abs(diff) > 50) {
        if (diff > 0) {
            prevMusic();
            showToast('⏮️ Música anterior', 800);
        } else {
            nextMusic();
            showToast('⏭️ Próxima música', 800);
        }
    }
});

// Inicialização
buildGenresGrid();
filterByGenre("SERTANEJO");
updateStatsDisplay();

// Posicionar disco inicial
floatingVinyl.style.position = 'fixed';
floatingVinyl.style.left = '20px';
floatingVinyl.style.bottom = '100px';

console.log("🎵 Rádio Patico IA - Pronta para tocar!");
</script>
</body>
