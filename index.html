<html lang="pt-br">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>

        body { background: #000; overflow: hidden; height: 100vh; width: 100%; position: fixed; }
        
        /* Vídeo de fundo */
        .bg-video { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; }
        
        /* Controles inferiores */
        .controls {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            padding: 12px 20px; z-index: 20;
            transition: transform 0.3s ease;
        }
        .controls.hide { transform: translateY(100%); }
        .track-info { text-align: center; color: white; font-size: 0.85rem; margin-bottom: 6px; letter-spacing: 0.5px; }
        .progress-area { cursor: pointer; margin-bottom: 6px; }
        .progress-bar { height: 4px; background: rgba(255,255,255,0.3); border-radius: 4px; }
        .progress-fill { width: 0%; height: 100%; background: #e63946; border-radius: 4px; transition: width 0.1s linear; }
        .progress-time { display: flex; justify-content: space-between; color: #ccc; font-size: 0.7rem; margin-bottom: 4px; }
        .control-buttons { display: flex; justify-content: center; gap: 20px; }
        .control-btn {
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2);
            width: 48px; height: 48px; border-radius: 50%; color: white;
            font-size: 1.2rem; cursor: pointer; transition: 0.1s;
        }
        .control-btn:active { transform: scale(0.95); background: #e63946; color: #000; }
        .play-btn { background: #e63946; width: 58px; height: 58px; font-size: 1.6rem; border: none; }
        
        /* Botão de gêneros (GEN) */
        .genre-button {
            position: fixed; bottom: 80px; right: 20px; width: 70px; height: 70px;
            background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; z-index: 26; border: 1px solid rgba(255,255,255,0.15);
            animation: float 3s infinite;
        }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .genre-button i { font-size: 1.5rem; color: #e63946; }
        .genre-button span { font-size: 0.7rem; color: #ff8c00; margin-top: 4px; }
        
        /* Badge de gênero / live */
        .genre-badge {
            position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,0.7);
            padding: 4px 12px; border-radius: 20px; color: white; font-size: 0.7rem;
            z-index: 31; border-left: 3px solid #e63946; font-weight: bold;
        }
        .genre-badge.live { border-left-color: #ff0000; background: rgba(255,0,0,0.7); animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 0%,100% { opacity: 0.9; } 50% { opacity: 1; } }
        
        .audio-indicator {
            position: fixed; top: 12px; right: 70px; background: rgba(0,0,0,0.6);
            padding: 4px 10px; border-radius: 20px; color: #4ade80; font-size: 0.6rem; z-index: 31;
        }
        .menu-button {
            position: fixed; top: 12px; right: 12px; width: 44px; height: 44px;
            background: rgba(0,0,0,0.6); border-radius: 50%; display: flex;
            align-items: center; justify-content: center; color: white; cursor: pointer; z-index: 31;
        }
        .menu-popup {
            position: fixed; top: 65px; right: 12px; background: rgba(0,0,0,0.9);
            border-radius: 16px; padding: 10px; display: none; flex-direction: column;
            gap: 8px; z-index: 32;
        }
        .menu-popup.open { display: flex; }
        .menu-popup button {
            background: rgba(255,255,255,0.1); border: none; color: white;
            padding: 8px 16px; border-radius: 30px; cursor: pointer; text-align: left;
            font-size: 0.9rem;
        }
        .tv-pix {
            position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.85);
            border-radius: 24px; padding: 15px; display: none; color: white;
            text-align: center; z-index: 1000; border-left: 5px solid #00d4ff;
        }
        .tv-pix.show { display: block; }
        .pix-key { background: #222; padding: 8px; border-radius: 12px; cursor: pointer; font-weight: bold; margin: 8px 0; }
        .exit-tv {
            position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.85);
            border: 2px solid #00d4ff; padding: 8px 16px; border-radius: 50px;
            display: none; cursor: pointer; color: white; z-index: 102;
        }
        .tv-mode-active .controls, .tv-mode-active .feedback-buttons, .tv-mode-active .genre-button { transform: scale(1.2); transform-origin: bottom right; }
        
        .feedback-buttons {
            position: fixed; bottom: 140px; left: 20px; display: flex; gap: 12px; z-index: 27;
        }
        .feedback-btn {
            width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center;
            justify-content: center; font-size: 1.2rem; cursor: pointer;
        }
        .like { color: #4ade80; }
        .dislike { color: #ef4444; }
        
        #tap-to-start {
            position: fixed; bottom: 20%; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #ff8c00, #ff6600); color: white;
            padding: 14px 28px; border-radius: 60px; font-weight: bold; cursor: pointer;
            z-index: 10000; border: none; animation: btnPulse 1.5s infinite;
            white-space: nowrap; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        @keyframes btnPulse { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.03); } }
        
        .live-balloon {
            position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            border-radius: 80px; padding: 8px 20px; color: white;
            z-index: 1000; display: none; white-space: nowrap; cursor: pointer;
            border-left: 3px solid #ff0000;
        }
        .visualizer {
            position: fixed; top: 70px; right: 20px; display: flex; gap: 4px;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
            padding: 8px 12px; border-radius: 30px; z-index: 31;
        }
        .visualizer-bar { width: 4px; height: 20px; background: #e63946; border-radius: 2px; transition: height 0.05s; }
        .loading-spinner {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9); padding: 15px 25px; border-radius: 50px;
            display: none; gap: 12px; color: white; z-index: 10001;
        }
        .loading-spinner.show { display: flex; align-items: center; }
        .video-ad {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 300px; max-width: 85vw; border-radius: 16px; overflow: hidden;

        .video-ad video { width: 100%; display: block; }
        .audio-ad {
            position: fixed; bottom: 30%; left: 50%; transform: translateX(-50%);
            background: #e63946; color: white; padding: 12px 24px; border-radius: 50px;
            display: none; gap: 12px; z-index: 1002; white-space: nowrap;
        }
        .swipe-indicator {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);

            border-radius: 30px; opacity: 0; transition: 0.2s; pointer-events: none; z-index: 10002;
        }
        .genres-modal {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 30px 30px 0 0;

        .genres-grid {

        .genre-card {
            background: linear-gradient(135deg, #ff0844, #ffb199); padding: 12px;

        .stats-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);

            border: 2px solid #e63946;
        }
        .stats-modal button { background: #e63946; border: none; padding: 8px 16px; border-radius: 20px; color: white; margin-top: 15px; cursor: pointer; }
    </style>
</head>

            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
        function showNotification(msg, duration = 3000) {
            const div = document.createElement('div');
            div.textContent = msg;
            div.style.position = 'fixed';
            div.style.bottom = '20%';
            div.style.left = '50%';
            div.style.transform = 'translateX(-50%)';
            div.style.background = 'rgba(0,0,0,0.85)';
            div.style.color = 'white';
            div.style.padding = '8px 20px';
            div.style.borderRadius = '30px';
            div.style.zIndex = '10001';
            div.style.borderLeft = '3px solid #e63946';
            document.body.appendChild(div);
            setTimeout(() => div.remove(), duration);
        }
        function showSwipe(text) {
            swipeIndicator.textContent = text;
            swipeIndicator.style.opacity = '1';
            setTimeout(() => swipeIndicator.style.opacity = '0', 1000);
        }
        function showLoading() { loadingSpinner.classList.add('show'); }
        function hideLoading() { loadingSpinner.classList.remove('show'); }
        function stopTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = null; }
        function startTimer() {
            stopTimer();
            timerInterval = setInterval(() => {
                if (isPlaying && musicPlayer.duration && !musicPlayer.paused) {
                    let percent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
                    progressFill.style.width = percent + '%';
                    currentTimeSpan.textContent = formatTime(musicPlayer.currentTime);
                }
            }, 200);
        }
        function startVisualizer() {
            if (visInterval) clearInterval(visInterval);
            visInterval = setInterval(() => {
                let bars = document.querySelectorAll('.visualizer-bar');
                if (isPlaying && musicPlayer.duration && !musicPlayer.paused) {
                    bars.forEach(bar => bar.style.height = (8 + Math.random() * 32) + 'px');
                } else {
                    bars.forEach(bar => bar.style.height = '4px');
                }
            }, 100);
        }
        function stopVisualizer() { if (visInterval) clearInterval(visInterval); visInterval = null; }

        // ==================== VÍDEO DINÂMICO ====================
        function trocarVideo(src) {
            if (!src || isTvMode) return;
            if (bgVideo.src !== src) {
                bgVideo.pause();
                bgVideo.src = src;
                bgVideo.load();
                bgVideo.play().catch(e => console.log("Erro vídeo:", e));
            }
        }

        function iniciarRotacaoVideos() {
            if (rotacaoInterval) clearInterval(rotacaoInterval);
            rotacaoInterval = setInterval(() => {
                if (!isTvMode && !isAoVivo && !isManualGenre && programaAtual === null) {
                    rotacaoIndex = (rotacaoIndex + 1) % VIDEOS_ROTACAO.length;
                    trocarVideo(VIDEOS_ROTACAO[rotacaoIndex]);
                }
            }, 20000);
        }

        // ==================== PROGRAMAS ====================
        function getProgramaAtivo() {
            const agora = new Date();
            const dia = agora.getDay();
            const hora = agora.getHours();
            for (let p of programas) {
                if (p.dias.includes(dia) && hora >= p.inicio && hora < p.fim) return p;
            }
            return null;
        }

        function gerarPlaylistPorPercentuais(percentuais) {
            let lista = [];
            for (let [gen, perc] of Object.entries(percentuais)) {
                let songs = musicas.filter(m => m.genero === gen && m.tipo !== "ao vivo");
                if (songs.length === 0) continue;
                let qtd = Math.max(3, Math.floor((perc / 100) * 20));
                let selecionadas = shuffleArray([...songs]).slice(0, qtd);
                lista.push(...selecionadas);
            }
            return shuffleArray(lista);
        }

        function aplicarProgramacao() {
            if (isAoVivo) return;
            if (isManualGenre) return;
            const prog = getProgramaAtivo();
            if (prog) {
                if (programaAtual !== prog.nome) {
                    programaAtual = prog.nome;
                    trocarVideo(prog.video);
                    filteredPlaylist = gerarPlaylistPorPercentuais(prog.percentuais);
                    if (filteredPlaylist.length === 0) filteredPlaylist = shuffleArray(musicas.filter(m => m.tipo !== "ao vivo"));
                    currentIndex = 0;
                    loadTrackUI(currentIndex);
                    if (isPlaying) playMusic();
                    showNotification(`📻 ${prog.nomeExibicao} ativado! (${prog.percentuais})`);
                }
            } else {
                if (programaAtual !== null) {
                    programaAtual = null;
                    ativarModoAoVivo();
                }
            }
        }

        // ==================== MODO AO VIVO ====================
        function ativarModoAoVivo() {
            isAoVivo = true;
            isManualGenre = false;
            programaAtual = null;
            genreBadgeSpan.innerHTML = '🔴 LIVE';
            genreBadgeSpan.classList.add('live');
            let aoVivoMusicas = musicas.filter(m => m.tipo === "ao vivo");
            if (aoVivoMusicas.length === 0) aoVivoMusicas = musicas;
            filteredPlaylist = shuffleArray(aoVivoMusicas);
            currentIndex = 0;
            loadTrackUI(currentIndex);
            if (isPlaying) playMusic();
            showNotification('🔴 MODO AO VIVO ativado!');
            if (videoAdInterval) clearInterval(videoAdInterval);
            videoAdInterval = setInterval(() => iniciarVideoAd(), 30000);
            const balloon = document.getElementById('liveBalloon');
            balloon.style.display = 'block';
            setTimeout(() => balloon.style.display = 'none', 4000);
        }

        function desativarModoAoVivo() {
            isAoVivo = false;
            if (videoAdInterval) clearInterval(videoAdInterval);
            document.getElementById('videoAd').style.display = 'none';
            genreBadgeSpan.classList.remove('live');
            aplicarProgramacao(); // tenta programação
            if (!programaAtual && !isManualGenre) {
                // fallback: gênero padrão (SERTANEJO)
                let def = musicas.filter(m => m.genero === "SERTANEJO" && m.tipo !== "ao vivo");
                if (def.length === 0) def = musicas;
                filteredPlaylist = shuffleArray(def);
                currentIndex = 0;
                loadTrackUI(currentIndex);
                if (isPlaying) playMusic();
            }
        }

        // ==================== PLAYER ====================
        function loadTrackUI(index) {
            if (!filteredPlaylist.length) return;
            if (index >= filteredPlaylist.length) index = 0;
            if (index < 0) index = filteredPlaylist.length - 1;
            currentIndex = index;
            let track = filteredPlaylist[currentIndex];
            trackNameSpan.textContent = `${track.title} - ${track.artist} [${track.genero}]`;
            currentTimeSpan.textContent = '0:00';
            totalTimeSpan.textContent = '0:00';
            progressFill.style.width = '0%';
            if (!isAoVivo) genreBadgeSpan.innerHTML = track.genero;
        }

        async function playMusic() {
            if (!backgroundActive) { showNotification('⚠️ Clique em "ATIVAR RÁDIO" primeiro!'); return false; }
            if (filteredPlaylist.length === 0) return false;
            let track = filteredPlaylist[currentIndex];
            if (!track || !track.src) return false;
            showLoading();
            musicPlayer.pause();
            musicPlayer.src = track.src;
            musicPlayer.load();
            try {
                await musicPlayer.play();
                isPlaying = true;
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                startTimer();
                startVisualizer();
                hideLoading();
                trackStartTime = Date.now();
                totalMusicasOuvidas++;
                document.getElementById('statTotalPlayed').innerText = `${totalMusicasOuvidas} músicas ouvidas`;
                musicPlayer.onended = () => {
                    if ((Date.now() - trackStartTime) / 1000 > musicPlayer.duration * 0.7) {
                        // completou a música – pode incrementar estatísticas
                    }
                    nextTrack();
                };
                if (musicPlayer.duration) totalTimeSpan.textContent = formatTime(musicPlayer.duration);
                else musicPlayer.addEventListener('loadedmetadata', () => totalTimeSpan.textContent = formatTime(musicPlayer.duration), { once: true });
                return true;
            } catch(e) {
                hideLoading();
                isPlaying = false;
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                console.log("Erro play:", e);
                return false;
            }
        }
        function pauseMusic() {
            musicPlayer.pause();
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopTimer();
            stopVisualizer();
        }
        function togglePlayPause() {
            if (!backgroundActive) showNotification('Ative a rádio primeiro!');
            else isPlaying ? pauseMusic() : playMusic();
        }
        async function nextTrack() {
            if (!filteredPlaylist.length) return;
            let next = (currentIndex + 1) % filteredPlaylist.length;
            currentIndex = next;
            loadTrackUI(currentIndex);
            if (isPlaying) await playMusic();
        }
        async function prevTrack() {
            if (!filteredPlaylist.length) return;
            let prev = currentIndex - 1;
            if (prev < 0) prev = filteredPlaylist.length - 1;
            currentIndex = prev;
            loadTrackUI(currentIndex);
            if (isPlaying) await playMusic();
        }

        // ==================== GÊNERO MANUAL ====================
        function filterByGenre(genero) {
            if (isAoVivo) desativarModoAoVivo();
            isManualGenre = true;
            programaAtual = null;
            let novaPlaylist = musicas.filter(m => m.genero === genero && m.tipo !== "ao vivo");
            if (novaPlaylist.length === 0) novaPlaylist = musicas;
            filteredPlaylist = shuffleArray(novaPlaylist);
            currentIndex = 0;
            loadTrackUI(currentIndex);
            if (isPlaying) playMusic();
            if (VIDEO_POR_GENERO[genero]) trocarVideo(VIDEO_POR_GENERO[genero]);
            showNotification(`🎵 Gênero ${genero} selecionado manualmente!`);
        }

        // ==================== IA (curtir / não curtir) ====================
        let userPref = { liked: [], disliked: [] };
        function likeSong() {
            let track = filteredPlaylist[currentIndex];
            if (!track) return;
            if (!userPref.liked.includes(track.id)) {
                userPref.liked.push(track.id);
                userPref.disliked = userPref.disliked.filter(id => id !== track.id);
                showNotification(`👍 Você curtiu "${track.title}"! A IA vai tocar mais músicas assim.`);
            } else showNotification(`❤️ Você já curtiu "${track.title}" antes.`);
        }
        function dislikeSong() {
            let track = filteredPlaylist[currentIndex];
            if (!track) return;
            if (!userPref.disliked.includes(track.id)) {
                userPref.disliked.push(track.id);
                userPref.liked = userPref.liked.filter(id => id !== track.id);
                showNotification(`👎 Você não curtiu "${track.title}". Pulando para a próxima...`);
                setTimeout(() => nextTrack(), 500);
            } else showNotification(`👎 Você já marcou "${track.title}" como não curtida.`);
        }

        // ==================== ANÚNCIOS ====================
        function iniciarVideoAd() {
            if (!isAoVivo || isTvMode || adVideoPlaying) return;
            adVideoPlaying = true;
            let ad = document.getElementById('adVideo');
            let ov = document.getElementById('videoAd');
            ad.currentTime = 0;
            ov.style.display = 'block';
            ad.play().catch(e => { ov.style.display = 'none'; adVideoPlaying = false; });
            setTimeout(() => {
                if (adVideoPlaying) { ov.style.display = 'none'; ad.pause(); adVideoPlaying = false; }
            }, 8000);
        }

        // ==================== MODO TV ====================
        function toggleTvMode() {
            const tvDiv = document.getElementById('tvPix');
            const exitBtn = document.getElementById('exitTvBtn');
            if (!isTvMode) {
                isTvMode = true;
                document.body.classList.add('tv-mode-active');
                tvDiv.classList.add('show');
                exitBtn.style.display = 'block';
                showNotification('📺 MODO TV ATIVADO! Apoie com PIX.');
                bgVideo.src = "modop.mp4";
                bgVideo.load();
                bgVideo.play();
            } else {
                isTvMode = false;
                document.body.classList.remove('tv-mode-active');
                tvDiv.classList.remove('show');
                exitBtn.style.display = 'none';
                showNotification('Modo TV desativado.');
                // restaura vídeo anterior
                if (programaAtual) {
                    let prog = programas.find(p => p.nome === programaAtual);
                    if (prog) trocarVideo(prog.video);
                } else if (isManualGenre && filteredPlaylist[0] && VIDEO_POR_GENERO[filteredPlaylist[0].genero]) {
                    trocarVideo(VIDEO_POR_GENERO[filteredPlaylist[0].genero]);
                } else if (!isAoVivo && !programaAtual) {
                    trocarVideo(VIDEOS_ROTACAO[rotacaoIndex]);
                } else {
                    trocarVideo("pai.mp4");
                }
            }
        }

        // ==================== ATIVAÇÃO DE ÁUDIO (BOTÃO LARANJA) ====================
        async function ativarAudioBackground() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                await ctx.resume();
                backgroundActive = true;
                audioIndicatorSpan.innerHTML = '<i class="fas fa-check-circle"></i> Áudio OK';
                audioIndicatorSpan.style.color = '#4ade80';
                return true;
            } catch(e) {
                audioIndicatorSpan.innerHTML = '<i class="fas fa-times"></i> Erro';
                console.log("Erro ativar áudio:", e);
                return false;
            }
        }

        // ==================== MODAL DE GÊNEROS ====================
        const generosLista = ["SERTANEJO", "FORRÓ", "SAMBA", "POP", "BREGA", "MPB", "VARIADAS", "TODOS", "LIVE"];
        function buildModal() {
            modal.innerHTML = `
                <h3 style="color:#e63946;"><i class="fas fa-music"></i> ESCOLHA SEU ESTILO</h3>
                <div class="genres-grid" id="genresGrid"></div>
                <button class="close-modal" id="closeModal"><i class="fas fa-times"></i> FECHAR</button>
            `;
            const grid = modal.querySelector('#genresGrid');
            generosLista.forEach(g => {
                const card = document.createElement('div');
                card.className = 'genre-card';
                let icon = "fa-music";
                if (g === "SERTANEJO") icon = "fa-guitar";
                if (g === "FORRÓ") icon = "fa-drum";
                if (g === "SAMBA") icon = "fa-drumstick-bite";
                if (g === "POP") icon = "fa-microphone-alt";
                if (g === "BREGA") icon = "fa-heart";
                if (g === "MPB") icon = "fa-guitar";
                if (g === "LIVE") icon = "fa-broadcast-tower";
                card.innerHTML = `<i class="fas ${icon}"></i><br>${g}`;
                card.setAttribute('data-gen', g);
                card.onclick = () => {
                    if (g === 'LIVE') ativarModoAoVivo();
                    else if (g === 'VARIADAS' || g === 'TODOS') {
                        if (isAoVivo) desativarModoAoVivo();
                        isManualGenre = false;
                        programaAtual = null;
                        filteredPlaylist = shuffleArray(musicas.filter(m => m.tipo !== "ao vivo"));
                        currentIndex = 0;
                        loadTrackUI(currentIndex);
                        if (isPlaying) playMusic();
                        showNotification(`🎵 ${g} ativado! IA escolhendo as melhores.`);
                        trocarVideo(VIDEOS_ROTACAO[0]); // vídeo padrão da rotação
                    } else {
                        filterByGenre(g);
                    }
                    modal.classList.remove('open');
                };
                grid.appendChild(card);
            });
            document.getElementById('closeModal').onclick = () => modal.classList.remove('open');
        }

        // ==================== INICIALIZAÇÃO DOS EVENTOS ====================
        document.getElementById('tap-to-start').onclick = async () => {
            const ok = await ativarAudioBackground();
            if (ok) {
                document.getElementById('tap-to-start').style.display = 'none';
                ativarModoAoVivo();
                await playMusic();
                setInterval(() => aplicarProgramacao(), 60000);
                aplicarProgramacao(); // primeira verificação
                iniciarRotacaoVideos();
            } else {
                showNotification('❌ Falha ao ativar áudio. Toque novamente.');
            }
        };

        playPauseBtn.onclick = togglePlayPause;
        prevBtn.onclick = prevTrack;
        nextBtn.onclick = nextTrack;
        shuffleBtn.onclick = () => { shuffleMode = !shuffleMode; showNotification(shuffleMode ? '🔀 Aleatório inteligente ON' : '➡️ Sequencial'); };
        likeBtn.onclick = likeSong;
        dislikeBtn.onclick = dislikeSong;
        document.getElementById('progressArea').onclick = (e) => {
            const rect = e.currentTarget.querySelector('.progress-bar').getBoundingClientRect();
            let percent = (e.clientX - rect.left) / rect.width;
            if (musicPlayer.duration) musicPlayer.currentTime = percent * musicPlayer.duration;
        };
        document.getElementById('pixKey').onclick = () => { navigator.clipboard.writeText("12988461978"); showNotification('✅ Chave PIX copiada: 12988461978'); };
        document.getElementById('exitTvBtn').onclick = () => { if (isTvMode) toggleTvMode(); };
        document.getElementById('menuBtn').onclick = (e) => { e.stopPropagation(); document.getElementById('menuPopup').classList.toggle('open'); };
        document.onclick = () => document.getElementById('menuPopup').classList.remove('open');
        document.getElementById('tvModeBtn').onclick = () => { toggleTvMode(); document.getElementById('menuPopup').classList.remove('open'); };
        document.getElementById('fullscreenBtn').onclick = () => { document.documentElement.requestFullscreen(); };
        document.getElementById('shareBtn').onclick = () => {
            if (navigator.share) navigator.share({ title: 'Rádio Patico IA', text: '🎵 A rádio que aprende seu gosto!', url: window.location.href });
            else showNotification('🔗 Copie o link da página para compartilhar.');
        };
        document.getElementById('statsBtn').onclick = () => {
            document.getElementById('statsModal').style.display = 'block';
            document.getElementById('statTotalPlayed').innerText = `${totalMusicasOuvidas} músicas ouvidas`;
            document.getElementById('menuPopup').classList.remove('open');
        };
        document.getElementById('closeStatsBtn').onclick = () => document.getElementById('statsModal').style.display = 'none';
        document.getElementById('manualBtn').onclick = () => {
            showNotification('📘 MANUAL: Toque duplo = Play/Pausa | Deslize para trocar música | Botão GEN = gêneros | Modo TV = PIX');
            document.getElementById('menuPopup').classList.remove('open');
        };
        document.getElementById('feedbackBtn').onclick = () => {
            window.open(`https://wa.me/5512988461978?text=Olá%2C%20tenho%20um%20feedback%20sobre%20a%20Rádio%20Patico%20IA!`, '_blank');
        };
        document.getElementById('genreBtn').onclick = () => modal.classList.add('open');
        buildModal();

        // ==================== GESTOS TOUCH ====================
        let touchStartX = 0, lastTap = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            let now = Date.now();
            if (now - lastTap < 300) { e.preventDefault(); togglePlayPause(); showSwipe('⏯️ ' + (isPlaying ? 'Pausado' : 'Play')); }
            lastTap = now;
            if (isTvMode) return;
        });
        document.addEventListener('touchend', (e) => {
            let diff = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) { prevTrack(); showSwipe('⏮️ Música anterior'); }
                else { nextTrack(); showSwipe('⏭️ Próxima música'); }
            }
        });

        // ==================== ESCONDER CONTROLES INFERIORES ====================
        let hideTimer;
        function showControlsBar() { controlsDiv.classList.remove('hide'); clearTimeout(hideTimer); hideTimer = setTimeout(() => controlsDiv.classList.add('hide'), 3000); }
        document.addEventListener('touchstart', showControlsBar);
        document.addEventListener('click', showControlsBar);
        showControlsBar();

        // Inicializa visualizador e carrega uma playlist temporária (só para não ficar vazio)
        startVisualizer();
        filteredPlaylist = musicas.filter(m => m.tipo === "ao vivo");
        if (filteredPlaylist.length === 0) filteredPlaylist = musicas;
        loadTrackUI(0);

        console.log("✅ Rádio Patico IA iniciada. Programação automática ativa.");
    </script>
</body>
</html>
