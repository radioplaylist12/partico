
        <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rádio Pático • Múltiplos Gêneros</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        :root {
            --primary: #e63946;
            --primary-dark: #b71c1c;
        }

        .app {
            width: 100%;
            height: 100vh;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        /* Gêneros no topo (rolável) */
        .genre-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 60px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 6px 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            z-index: 30;
            pointer-events: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }

        .genre-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .genre-btn.active {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 8px var(--primary);
        }

        /* Menu flutuante */
        .menu-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
            z-index: 31;
            pointer-events: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .menu-popup {
            position: absolute;
            top: 65px;
            right: 12px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 32;
            pointer-events: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .menu-popup.open {
            display: flex;
        }

        .menu-popup button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* Botão CTA (WhatsApp, etc.) */
        .cta-btn {
            position: absolute;
            bottom: 25%;
            right: 15px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 8px 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: auto;
            animation: pulse 1.5s infinite;
            font-size: 0.8rem;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* Player inferior */
        .player-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 16px;
            z-index: 20;
            pointer-events: auto;
            transition: transform 0.3s ease;
        }

        .player-bar.hide {
            transform: translateY(100%);
            pointer-events: none;
        }

        .track-info {
            text-align: center;
            margin-bottom: 8px;
            color: white;
            font-size: 0.85rem;
            font-weight: 500;
            text-shadow: 1px 1px 2px black;
        }

        .progress-area {
            margin-bottom: 8px;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            color: #ccc;
            font-size: 0.7rem;
            margin-bottom: 4px;
        }

        .progress-bar {
            height: 3px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            border-radius: 3px;
            box-shadow: 0 0 4px var(--primary);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 8px;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .ctrl-btn:active {
            transform: scale(0.9);
        }

        .play-btn {
            background: var(--primary);
            color: #000;
            width: 54px;
            height: 54px;
            font-size: 1.6rem;
            border: none;
        }

        /* Notificação/toast */
        .toast {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            padding: 6px 20px;
            border-radius: 40px;
            color: white;
            font-size: 0.8rem;
            z-index: 40;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
        }

        /* Botão ativar áudio */
        #tap-to-start {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff6600, #ff3300);
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: bold;
            z-index: 10000;
            cursor: pointer;
            display: none;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border: none;
            pointer-events: auto;
            animation: btnPulse 1.5s infinite;
        }

        @keyframes btnPulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* Splash inicial */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
            color: white;
            text-align: center;
        }

        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="splash">
        <div>
            <i class="fas fa-headphones" style="font-size: 3rem; color: #e63946;"></i>
            <h1>Rádio Pático</h1>
            <p>Clique no botão para ativar o áudio</p>
        </div>
    </div>
    <div id="tap-to-start">
        <i class="fas fa-play-circle"></i> 🎵 ATIVAR ÁUDIO (toca com tela bloqueada)
    </div>

    <div class="app">
        <!-- Vídeo de fundo (você pode substituir os arquivos) -->
        <video id="bgVideo" class="video-bg" autoplay loop muted playsinline>
            <source src="video_fundo.mp4" type="video/mp4">
        </video>

        <!-- Botão CTA (WhatsApp, link, etc.) -->
        <button class="cta-btn" id="ctaBtn">
            <i class="fab fa-whatsapp"></i> FALE CONOSCO
        </button>

        <!-- Barra de gêneros -->
        <div class="genre-bar" id="genreBar"></div>

        <!-- Menu flutuante -->
        <div class="menu-btn" id="menuBtn">
            <i class="fas fa-ellipsis-v"></i>
        </div>
        <div class="menu-popup" id="menuPopup">
            <button id="fullscreenBtn"><i class="fas fa-expand"></i> Tela cheia</button>
            <button id="shareBtn"><i class="fas fa-share-alt"></i> Compartilhar</button>
        </div>

        <!-- Player inferior -->
        <div class="overlay">
            <div class="player-bar" id="playerBar">
                <div class="track-info">
                    <span id="trackName">🎵 Selecione um gênero</span>
                </div>
                <div class="progress-area">
                    <div class="progress-time">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                <div class="controls">
                    <button class="ctrl-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                    <button class="ctrl-btn play-btn" id="playBtn"><i class="fas fa-play"></i></button>
                    <button class="ctrl-btn" id="shuffleBtn"><i class="fas fa-random"></i></button>
                    <button class="ctrl-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <audio id="musicPlayer" preload="auto" crossorigin="anonymous"></audio>

    <script>
        // ==================== PLAYLISTS POR GÊNERO ====================
        // Substitua os caminhos (src) pelos seus próprios arquivos .mp3 ou .m4a
        const playlists = {
            mpb: {
                nome: "MPB",
                musicas: [
                    { title: "Trem Azul", artist: "Lô Borges", src: "mpb1.mp3" },
                    { title: "Oceano", artist: "Djavan", src: "mpb2.mp3" },
                    { title: "Construção", artist: "Chico Buarque", src: "mpb3.mp3" }
                ]
            },
            samba: {
                nome: "Samba",
                musicas: [
                    { title: "Mas Que Nada", artist: "Jorge Ben Jor", src: "samba1.mp3" },
                    { title: "Canta Canta Minha Gente", artist: "Martinho da Vila", src: "samba2.mp3" },
                    { title: "Aquarela Brasileira", artist: "Silas de Oliveira", src: "samba3.mp3" }
                ]
            },
            modatop: {
                nome: "Moda Top",
                musicas: [
                    { title: "Moda Top 1", artist: "Artista A", src: "modatop1.mp3" },
                    { title: "Moda Top 2", artist: "Artista B", src: "modatop2.mp3" }
                ]
            },
            forroantigo: {
                nome: "Forró Antigo",
                musicas: [
                    { title: "Asa Branca", artist: "Luiz Gonzaga", src: "forroantigo1.mp3" },
                    { title: "Xote das Meninas", artist: "Luiz Gonzaga", src: "forroantigo2.mp3" }
                ]
            },
            brega: {
                nome: "Brega",
                musicas: [
                    { title: "Brega 1", artist: "Reginaldo Rossi", src: "brega1.mp3" },
                    { title: "Brega 2", artist: "Waldick Soriano", src: "brega2.mp3" }
                ]
            },
            sertanejo: {
                nome: "Sertanejo",
                musicas: [
                    { title: "Evidências", artist: "Chitãozinho & Xororó", src: "sertanejo1.mp3" },
                    { title: "Fio de Cabelo", artist: "Chrystian & Ralf", src: "sertanejo2.mp3" }
                ]
            },
            forro: {
                nome: "Forró",
                musicas: [
                    { title: "Forró 1", artist: "Falamansa", src: "forro1.mp3" },
                    { title: "Forró 2", artist: "Mastruz com Leite", src: "forro2.mp3" }
                ]
            },
            pop: {
                nome: "Pop",
                musicas: [
                    { title: "Blinding Lights", artist: "The Weeknd", src: "pop1.mp3" },
                    { title: "Shape of You", artist: "Ed Sheeran", src: "pop2.mp3" }
                ]
            }
        };

        // Lista de vídeos de fundo (sem conflito com ótica) - você pode alterar
        const bgVideos = [
            "video1.mp4",
            "video2.mp4",
            "video3.mp4"
        ];

        // ==================== ELEMENTOS DOM ====================
        const audio = document.getElementById('musicPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeSpan = document.getElementById('currentTime');
        const totalTimeSpan = document.getElementById('totalTime');
        const trackNameSpan = document.getElementById('trackName');
        const toast = document.getElementById('toast');
        const splash = document.getElementById('splash');
        const tapToStart = document.getElementById('tap-to-start');
        const playerBar = document.getElementById('playerBar');
        const bgVideo = document.getElementById('bgVideo');
        const ctaBtn = document.getElementById('ctaBtn');
        const menuBtn = document.getElementById('menuBtn');
        const menuPopup = document.getElementById('menuPopup');

        // ==================== VARIÁVEIS ====================
        let currentGenre = "mpb";          // gênero atual
        let currentMusicIndex = 0;          // índice dentro da playlist do gênero
        let isPlaying = false;
        let shuffleMode = false;
        let currentPlaylist = [];            // lista de músicas do gênero atual
        let audioCtx = null;
        let silentSource = null;
        let mediaSource = null;
        let gainNode = null;
        let audioActive = false;
        let keepAliveInterval = null;
        let hideTimeout = null;

        // ==================== FUNÇÕES AUXILIARES ====================
        function showToast(msg, duration = 2000) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // ==================== LÓGICA DE ÁUDIO EM SEGUNDO PLANO (ANDROID) ====================
        async function initAudioContext() {
            if (audioActive && audioCtx && audioCtx.state === 'running') return true;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') await audioCtx.resume();

                // Cria buffer silencioso para manter o contexto ativo
                const sampleRate = audioCtx.sampleRate;
                const bufferLen = sampleRate * 2; // 2 segundos
                const silentBuffer = audioCtx.createBuffer(1, bufferLen, sampleRate);
                const data = silentBuffer.getChannelData(0);
                for (let i = 0; i < bufferLen; i++) data[i] = 0;

                if (silentSource) {
                    try { silentSource.stop(); silentSource.disconnect(); } catch(e) {}
                }
                silentSource = audioCtx.createBufferSource();
                silentSource.buffer = silentBuffer;
                silentSource.loop = true;
                silentSource.connect(audioCtx.destination);
                silentSource.start();

                // Conecta o elemento de áudio ao AudioContext
                if (mediaSource) {
                    try { mediaSource.disconnect(); } catch(e) {}
                }
                mediaSource = audioCtx.createMediaElementSource(audio);
                gainNode = audioCtx.createGain();
                gainNode.gain.value = 1;
                mediaSource.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                audioActive = true;
                console.log('✅ AudioContext ativo - background playback OK');
                return true;
            } catch (err) {
                console.error('Erro ao ativar AudioContext:', err);
                return false;
            }
        }

        function startKeepAlive() {
            if (keepAliveInterval) clearInterval(keepAliveInterval);
            keepAliveInterval = setInterval(async () => {
                if (audioCtx && audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }
                if (isPlaying && audio.paused && audioActive) {
                    console.log('KeepAlive: retomando música');
                    audio.play().catch(e => console.log);
                }
            }, 4000);
        }

        // ==================== CONTROLE DE PLAYER ====================
        function updateTrackInfo() {
            if (currentPlaylist.length === 0) return;
            const m = currentPlaylist[currentMusicIndex];
            if (m) {
                trackNameSpan.textContent = `${m.title} - ${m.artist}`;
            }
        }

        async function playMusic() {
            if (!audioActive) {
                showToast('⚠️ Clique em "ATIVAR ÁUDIO" primeiro!', 3000);
                return false;
            }
            if (currentPlaylist.length === 0) {
                showToast('Nenhuma música neste gênero', 2000);
                return false;
            }
            const track = currentPlaylist[currentMusicIndex];
            if (!track || !track.src) return false;

            audio.pause();
            audio.src = track.src;
            audio.load();

            return new Promise((resolve) => {
                audio.oncanplaythrough = async () => {
                    try {
                        if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();
                        await audio.play();
                        isPlaying = true;
                        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        updateTrackInfo();
                        if (audio.duration) totalTimeSpan.textContent = formatTime(audio.duration);
                        else audio.addEventListener('loadedmetadata', () => {
                            totalTimeSpan.textContent = formatTime(audio.duration);
                        }, { once: true });
                        resolve(true);
                    } catch(e) {
                        console.error(e);
                        isPlaying = false;
                        playBtn.innerHTML = '<i class="fas fa-play"></i>';
                        resolve(false);
                    }
                };
                audio.onended = () => {
                    nextTrack();
                };
                audio.onerror = () => {
                    showToast(`Erro ao tocar: ${track.title}`, 2000);
                    nextTrack();
                };
                audio.ontimeupdate = () => {
                    if (audio.duration) {
                        const percent = (audio.currentTime / audio.duration) * 100;
                        progressFill.style.width = percent + '%';
                        currentTimeSpan.textContent = formatTime(audio.currentTime);
                        totalTimeSpan.textContent = formatTime(audio.duration);
                    }
                };
            });
        }

        function pauseMusic() {
            audio.pause();
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
        }

        function togglePlayPause() {
            if (isPlaying) pauseMusic();
            else playMusic();
        }

        function nextTrack() {
            if (currentPlaylist.length === 0) return;
            if (shuffleMode) {
                let newIndex;
                do { newIndex = Math.floor(Math.random() * currentPlaylist.length); }
                while (newIndex === currentMusicIndex && currentPlaylist.length > 1);
                currentMusicIndex = newIndex;
            } else {
                currentMusicIndex = (currentMusicIndex + 1) % currentPlaylist.length;
            }
            updateTrackInfo();
            if (isPlaying) playMusic();
        }

        function prevTrack() {
            if (currentPlaylist.length === 0) return;
            if (shuffleMode) {
                let newIndex;
                do { newIndex = Math.floor(Math.random() * currentPlaylist.length); }
                while (newIndex === currentMusicIndex && currentPlaylist.length > 1);
                currentMusicIndex = newIndex;
            } else {
                currentMusicIndex = (currentMusicIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            }
            updateTrackInfo();
            if (isPlaying) playMusic();
        }

        function toggleShuffle() {
            shuffleMode = !shuffleMode;
            showToast(shuffleMode ? '🔀 Aleatório ativado' : '➡️ Sequencial');
        }

        // ==================== MUDANÇA DE GÊNERO ====================
        function changeGenre(genreId) {
            if (!playlists[genreId]) return;
            currentGenre = genreId;
            currentPlaylist = playlists[genreId].musicas;
            currentMusicIndex = 0;
            updateTrackInfo();
            if (isPlaying) {
                playMusic();
            } else {
                // Atualiza info mesmo sem tocar
                if (currentPlaylist[0]) {
                    trackNameSpan.textContent = `${currentPlaylist[0].title} - ${currentPlaylist[0].artist}`;
                }
            }
            // Atualiza botões ativos
            document.querySelectorAll('.genre-btn').forEach(btn => {
                if (btn.dataset.genre === genreId) btn.classList.add('active');
                else btn.classList.remove('active');
            });
            showToast(`🎵 Gênero: ${playlists[genreId].nome}`, 1500);
        }

        // ==================== CONSTRUIR BOTÕES DE GÊNERO ====================
        function buildGenreButtons() {
            const bar = document.getElementById('genreBar');
            bar.innerHTML = '';
            for (const [id, data] of Object.entries(playlists)) {
                const btn = document.createElement('button');
                btn.className = 'genre-btn';
                if (id === currentGenre) btn.classList.add('active');
                btn.textContent = data.nome;
                btn.dataset.genre = id;
                btn.addEventListener('click', () => changeGenre(id));
                bar.appendChild(btn);
            }
        }

        // ==================== CONTROLE DE INTERFACE (auto-hide) ====================
        function showControls() {
            playerBar.classList.remove('hide');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                playerBar.classList.add('hide');
            }, 3000);
        }

        function resetHideTimer() {
            if (playerBar.classList.contains('hide')) showControls();
            else {
                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => playerBar.classList.add('hide'), 3000);
            }
        }

        // ==================== VÍDEO DE FUNDO (ROTAÇÃO) ====================
        let videoIndex = 0;
        function rotateVideo() {
            if (bgVideos.length === 0) return;
            videoIndex = (videoIndex + 1) % bgVideos.length;
            const nextSrc = bgVideos[videoIndex];
            if (bgVideo) {
                bgVideo.pause();
                bgVideo.src = nextSrc;
                bgVideo.load();
                bgVideo.play().catch(e => console.log('Erro ao trocar vídeo:', e));
            }
        }
        setInterval(rotateVideo, 20000); // troca a cada 20s

        // ==================== EVENTOS ====================
        playBtn.addEventListener('click', () => {
            if (!audioActive) showToast('⚠️ Ative o áudio primeiro!', 2000);
            else togglePlayPause();
            resetHideTimer();
        });
        nextBtn.addEventListener('click', () => { nextTrack(); resetHideTimer(); });
        prevBtn.addEventListener('click', () => { prevTrack(); resetHideTimer(); });
        shuffleBtn.addEventListener('click', () => { toggleShuffle(); resetHideTimer(); });
        document.getElementById('progressBar').addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
            resetHideTimer();
        });
        document.addEventListener('touchstart', resetHideTimer);
        document.addEventListener('click', resetHideTimer);
        showControls();

        // Menu flutuante
        menuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuPopup.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (!menuBtn.contains(e.target) && !menuPopup.contains(e.target)) {
                menuPopup.classList.remove('open');
            }
        });
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
            menuPopup.classList.remove('open');
        });
        document.getElementById('shareBtn').addEventListener('click', () => {
            if (navigator.share) navigator.share({ title: 'Rádio Pático', url: location.href });
            else { navigator.clipboard.writeText(location.href); showToast('Link copiado!', 1500); }
            menuPopup.classList.remove('open');
        });

        // Botão CTA (WhatsApp)
        ctaBtn.addEventListener('click', () => {
            window.open('https://wa.me/5512988461978?text=Olá! Estou ouvindo a Rádio Pático', '_blank');
        });

        // ==================== INICIALIZAÇÃO (ATIVAÇÃO POR TOQUE) ====================
        tapToStart.addEventListener('click', async (e) => {
            e.stopPropagation();
            const ok = await initAudioContext();
            if (ok) {
                startKeepAlive();
                audioActive = true;
                // Carrega a playlist do gênero atual
                currentPlaylist = playlists[currentGenre].musicas;
                currentMusicIndex = 0;
                updateTrackInfo();
                await playMusic();
                splash.classList.add('hidden');
                tapToStart.style.display = 'none';
                // Tenta tela cheia automaticamente
                try { await document.documentElement.requestFullscreen(); } catch(e) {}
            } else {
                showToast('❌ Erro ao ativar áudio. Toque novamente.', 3000);
            }
        });

        window.addEventListener('load', () => {
            buildGenreButtons();
            currentPlaylist = playlists[currentGenre].musicas;
            if (currentPlaylist[0]) {
                trackNameSpan.textContent = `${currentPlaylist[0].title} - ${currentPlaylist[0].artist}`;
            }
            tapToStart.style.display = 'block';
            // Pré-carrega o primeiro vídeo
            if (bgVideos.length) bgVideo.src = bgVideos[0];
        });
    </script>
</body>
</html>
