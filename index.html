        
    <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rádio Patico - MPB • POP • AO VIVO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg-primary: #0a0a0f; --accent: #00f3ff; --secondary: #ff2d7f; }
        body { min-height: 100vh; background: var(--bg-primary); overflow: hidden; position: fixed; width: 100%; height: 100%; font-family: 'Rajdhani', sans-serif; }
        
        /* SPLASH SCREEN */
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; transition: opacity 0.8s; overflow: hidden; }
        #splash-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .splash-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .splash-content { text-align: center; z-index: 3; animation: fadeInUp 1s ease-out; margin-bottom: 40px; }
        .splash-content h1 { font-family: 'Orbitron', monospace; font-size: 2.5rem; letter-spacing: 4px; background: linear-gradient(135deg, #fff, #00f3ff, #ff2d7f); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 15px; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        #splashStartBtn { position: absolute; bottom: 25%; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #00f3ff, #ff2d7f); color: #000; padding: 12px 28px; border-radius: 50px; font-weight: bold; font-family: 'Orbitron', monospace; border: none; cursor: pointer; z-index: 100; box-shadow: 0 0 20px rgba(0,243,255,0.8); }
        #skipAdBtn { position: absolute; bottom: 15%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); color: #00f3ff; border: 1px solid #00f3ff; padding: 8px 20px; border-radius: 40px; font-size: 0.8rem; cursor: pointer; z-index: 100; }
        #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        /* APP */
        .app { width: 100%; height: 100vh; background: #000; position: relative; overflow: hidden; display: none; }
        .fullscreen-video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1; }
        .fullscreen-video-container video { width: 100%; height: 100%; object-fit: cover; }
        
        /* INFO E CONTROLES */
        .info-area { position: fixed; bottom: 100px; left: 0; right: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); padding: 12px 20px; z-index: 25; text-align: center; border-top: 1px solid rgba(0,243,255,0.3); border-bottom: 1px solid rgba(0,243,255,0.3); }
        .marquee-wrap { width: 100%; overflow: hidden; white-space: nowrap; }
        .marquee-text { display: inline-block; animation: marquee 40s linear infinite; color: #00f3ff; font-weight: 700; font-size: 1rem; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .bottom-controls { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); border-top: 1px solid rgba(0,243,255,0.3); padding: 10px 20px 20px; z-index: 20; transition: transform 0.3s; border-radius: 24px 24px 0 0; }
        .bottom-controls.hide-controls { transform: translateY(100%); }
        .progress-area { margin-bottom: 10px; }
        .progress-time { display: flex; justify-content: space-between; font-size: 0.65rem; color: #aaa; }
        .progress-bar { height: 3px; background: rgba(255,255,255,0.2); border-radius: 3px; cursor: pointer; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00f3ff, #ff2d7f); width: 0%; }
        .control-buttons { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .control-btn { background: rgba(0,0,0,0.6); border: 1px solid rgba(0,243,255,0.5); color: #00f3ff; width: 52px; height: 52px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .play-btn { width: 62px; height: 62px; background: linear-gradient(135deg, #00f3ff, #ff2d7f); color: #000; border: none; box-shadow: 0 0 15px rgba(0,243,255,0.6); }
        
        .genre-badge { position: absolute; top: 16px; left: 16px; background: rgba(0,0,0,0.7); backdrop-filter: blur(12px); padding: 5px 12px; border-radius: 40px; font-size: 0.7rem; color: #00f3ff; z-index: 31; border-left: 3px solid #00f3ff; font-family: 'Orbitron', monospace; }
        .menu-button { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); color: #00f3ff; border: 1px solid #00f3ff; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 31; }
        .menu-popup { position: absolute; top: 70px; right: 16px; background: rgba(0,0,0,0.95); backdrop-filter: blur(16px); border-radius: 20px; padding: 10px; z-index: 32; display: none; flex-direction: column; gap: 8px; border: 1px solid #00f3ff; }
        .menu-popup.open { display: flex; }
        .menu-popup button { background: rgba(255,255,255,0.05); border: none; color: white; padding: 8px 12px; border-radius: 40px; font-size: 0.75rem; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .genre-button { position: fixed; bottom: 160px; right: 16px; width: 48px; height: 48px; background: linear-gradient(135deg, #00f3ff, #ff2d7f); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 27; border: none; box-shadow: 0 0 12px rgba(0,243,255,0.7); }
        .volume-control { position: fixed; bottom: 160px; right: 80px; display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 30px; z-index: 27; }
        .volume-control input { width: 70px; height: 3px; }
        .loading-spinner { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.9); padding: 10px 20px; border-radius: 50px; z-index: 10001; display: none; gap: 10px; color: #00f3ff; }
        .loading-spinner.show { display: flex; }
        .notification-top { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); padding: 6px 16px; border-radius: 40px; color: #00f3ff; font-size: 0.7rem; z-index: 30; opacity: 0; transition: 0.2s; white-space: nowrap; }
        .notification-top.show { opacity: 1; }
        
        .genres-modal { position: fixed; bottom: 0; left: 0; right: 0; transform: translateY(100%); transition: transform 0.3s; background: linear-gradient(135deg, #0a0a0f, #001a2a); border-radius: 30px 30px 0 0; padding: 15px; z-index: 5000; border-top: 2px solid #00f3ff; }
        .genres-modal.open { transform: translateY(0); }
        .genres-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; }
        .genre-card { background: rgba(0,243,255,0.15); border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; border: 1px solid rgba(0,243,255,0.4); }
        .genre-card i { font-size: 1.5rem; color: #00f3ff; display: block; margin-bottom: 5px; }
        .close-genres { background: #00f3ff; border: none; padding: 8px; border-radius: 40px; width: 100%; color: #000; font-weight: bold; cursor: pointer; }
        
        .tv-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: none; justify-content: center; align-items: center; }
        .tv-overlay.active { display: flex; }
        .tv-video { width: 100%; height: 100%; object-fit: contain; }
        .tv-close { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); color: #00f3ff; border: 1px solid #00f3ff; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1001; }
    </style>
</head>
<body>

<div id="splash">
    <video id="splash-video" autoplay loop muted playsinline>
        <source src="abertura.mp4" type="video/mp4">
    </video>
    <div class="splash-overlay">
        <div class="splash-content"><h1>RÁDIO PATICO</h1></div>
        <button id="splashStartBtn">▶ ATIVAR</button>
        <button id="skipAdBtn">⏩ PULAR</button>
    </div>
</div>

<div id="tvOverlay" class="tv-overlay">
    <button class="tv-close" id="tvCloseBtn"><i class="fas fa-times"></i></button>
    <video id="tvVideo" class="tv-video" autoplay loop muted playsinline>
        <source src="tv.mp4" type="video/mp4">
    </video>
    <div style="position: absolute; bottom: 50px; color: white; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px;">📺 MODO TV - Clique no X para sair</div>
</div>

<div class="app" id="appRoot">
    <div class="fullscreen-video-container" id="videoContainer">
        <video id="mainVideo" autoplay loop muted playsinline>
            <source src="pak.mp4" type="video/mp4">
        </video>
    </div>
    
    <div class="info-area">
        <div class="marquee-wrap">
            <span class="marquee-text" id="trackMarquee">🎵 RÁDIO PATICO - MPB • POP • AO VIVO | LUIS GOMES RN</span>
        </div>
    </div>
    
    <div class="bottom-controls" id="bottomControls">
        <div class="progress-area">
            <div class="progress-time"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
            <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="control-buttons">
            <button class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
            <button class="control-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
            <button class="control-btn" id="shuffleBtn"><i class="fas fa-random"></i></button>
            <button class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
        </div>
    </div>
    
    <button class="genre-button" id="genreButton"><i class="fas fa-music"></i></button>
    <div class="genre-badge" id="genreBadge"><i class="fas fa-music"></i> MPB</div>
    <div class="menu-button" id="menuButton"><i class="fas fa-bolt"></i></div>
    <div class="menu-popup" id="menuPopup">
        <button id="tvMenuBtn"><i class="fas fa-tv"></i> Modo TV</button>
        <button id="fullscreenMenuBtn"><i class="fas fa-expand"></i> Tela cheia</button>
        <button id="shareMenuBtn"><i class="fas fa-share-alt"></i> Compartilhar</button>
        <button id="bluetoothMenuBtn"><i class="fab fa-bluetooth-b"></i> Bluetooth</button>
    </div>
    <div class="volume-control" id="volumeControl">
        <i class="fas fa-volume-up"></i>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.9">
    </div>
</div>

<div id="notificationTop" class="notification-top"></div>
<div class="loading-spinner" id="loadingSpinner"><i class="fas fa-circle-notch fa-spin"></i> Carregando...</div>

<div class="genres-modal" id="genresModal">
    <h3 style="color:#00f3ff; text-align:center;">🎧 SELECIONE O GÊNERO</h3>
    <div class="genres-grid">
        <div class="genre-card" data-genero="MPB"><i class="fas fa-guitar"></i><span>MPB</span></div>
        <div class="genre-card" data-genero="POP"><i class="fas fa-microphone-alt"></i><span>POP</span></div>
        <div class="genre-card" data-genero="AO VIVO"><i class="fas fa-broadcast-tower"></i><span>AO VIVO</span></div>
        <div class="genre-card" data-genero="TODOS"><i class="fas fa-random"></i><span>TODOS</span></div>
    </div>
    <button class="close-genres" id="closeGenresBtn">FECHAR</button>
</div>

<audio id="musicPlayer" preload="auto" crossorigin></audio>

<script>
    // ==================== CONFIG ====================
    const PLAYLIST_URL = 'https://raw.githubusercontent.com/radioplaylist12/partico/main/playlist.json';
    let PLAYLIST = [];
    
    // Estado
    const state = {
        isPlaying: false,
        generoAtual: 'MPB',
        currentIndex: 0,
        filteredPlaylist: [],
        isLoadingTrack: false,
        audioContext: null,
        progressInterval: null,
        controlsTimer: null,
        isTvMode: false,
        lastClickTime: 0
    };
    
    // DOM
    const dom = {
        musicPlayer: document.getElementById('musicPlayer'),
        playBtn: document.getElementById('playPauseBtn'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        shuffleBtn: document.getElementById('shuffleBtn'),
        progressFill: document.getElementById('progressFill'),
        currentTimeEl: document.getElementById('currentTime'),
        totalTimeEl: document.getElementById('totalTime'),
        trackMarquee: document.getElementById('trackMarquee'),
        splash: document.getElementById('splash'),
        appRoot: document.getElementById('appRoot'),
        loadingSpinner: document.getElementById('loadingSpinner'),
        genreBadge: document.getElementById('genreBadge'),
        bottomControls: document.getElementById('bottomControls'),
        genreButton: document.getElementById('genreButton'),
        menuButton: document.getElementById('menuButton'),
        menuPopup: document.getElementById('menuPopup'),
        mainVideo: document.getElementById('mainVideo'),
        volumeSlider: document.getElementById('volumeSlider'),
        tvOverlay: document.getElementById('tvOverlay'),
        tvVideo: document.getElementById('tvVideo'),
        tvCloseBtn: document.getElementById('tvCloseBtn')
    };
    
    // Notificações
    function mostrarNotificacao(msg, dur=1500) {
        const n = document.getElementById('notificationTop');
        if (n) { n.textContent = msg; n.classList.add('show'); setTimeout(() => n.classList.remove('show'), dur); }
    }
    
    // Embaralhar array
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    
    // Carregar playlist do GitHub
    async function carregarPlaylist() {
        try {
            const resp = await fetch(PLAYLIST_URL);
            if (!resp.ok) throw new Error();
            PLAYLIST = await resp.json();
            PLAYLIST = PLAYLIST.map((m, idx) => { m.id = idx; return m; });
            console.log(`Playlist carregada: ${PLAYLIST.length} músicas`);
        } catch(e) {
            console.error("Erro ao carregar playlist, usando fallback", e);
            PLAYLIST = [
                { id:0, title:"Trem Bala", artist:"Ana Vilela", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", genero:"MPB" },
                { id:1, title:"Garota de Ipanema", artist:"Tom Jobim", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", genero:"MPB" },
                { id:2, title:"Blinding Lights", artist:"The Weeknd", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", genero:"POP" },
                { id:3, title:"Shape of You", artist:"Ed Sheeran", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", genero:"POP" },
                { id:4, title:"Ao Vivo - Acústico", artist:"Banda XYZ", src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", genero:"AO VIVO" }
            ];
            mostrarNotificacao("⚠️ Fallback local", 2000);
        }
    }
    
    // Filtrar por gênero
    function filtrarPorGenero(genero) {
        if (genero === 'TODOS') return shuffleArray([...PLAYLIST]);
        const filtrada = PLAYLIST.filter(m => m.genero === genero);
        if (filtrada.length === 0) return shuffleArray([...PLAYLIST]);
        return shuffleArray(filtrada);
    }
    
    // ========== VERIFICADOR DE TRAVAMENTO ==========
    let ultimoTempo = 0;
    let contadorTravado = 0;
    
    function iniciarMonitorTravamento() {
        setInterval(() => {
            if (!state.isPlaying || state.isLoadingTrack || dom.musicPlayer.paused) return;
            const atual = dom.musicPlayer.currentTime;
            if (atual === ultimoTempo && atual > 0) {
                contadorTravado++;
                if (contadorTravado >= 3) { // ~6 segundos travado
                    console.log("⚠️ Música travada! Pulando...");
                    PlayerEngine.next();
                    contadorTravado = 0;
                }
            } else {
                contadorTravado = 0;
            }
            ultimoTempo = atual;
        }, 2000);
    }
    
    // ========== PLAYER ENGINE ==========
    const PlayerEngine = {
        formatTime(sec) {
            if (isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        },
        
        async play() {
            if (state.isLoadingTrack || state.isTvMode) return;
            if (!state.filteredPlaylist.length) {
                state.filteredPlaylist = filtrarPorGenero(state.generoAtual);
                if (!state.filteredPlaylist.length) return;
            }
            const track = state.filteredPlaylist[state.currentIndex];
            if (!track || !track.src) { this.next(); return; }
            
            state.isLoadingTrack = true;
            dom.loadingSpinner.classList.add('show');
            dom.musicPlayer.pause();
            dom.musicPlayer.src = track.src;
            dom.musicPlayer.load();
            
            dom.trackMarquee.innerHTML = `<span class="marquee-text">🎵 ${track.title} - ${track.artist} [${track.genero}] | RÁDIO PATICO</span>`;
            dom.currentTimeEl.textContent = '0:00';
            dom.totalTimeEl.textContent = '0:00';
            dom.progressFill.style.width = '0%';
            
            return new Promise((resolve) => {
                let timeout = setTimeout(() => {
                    dom.loadingSpinner.classList.remove('show');
                    state.isLoadingTrack = false;
                    this.next();
                    resolve(false);
                }, 8000);
                
                dom.musicPlayer.oncanplaythrough = async () => {
                    clearTimeout(timeout);
                    dom.loadingSpinner.classList.remove('show');
                    state.isLoadingTrack = false;
                    try {
                        await dom.musicPlayer.play();
                        state.isPlaying = true;
                        dom.playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        this.startProgressTimer();
                        dom.musicPlayer.onended = () => this.next();
                        resolve(true);
                    } catch(e) {
                        this.next();
                        resolve(false);
                    }
                };
                dom.musicPlayer.onerror = () => {
                    clearTimeout(timeout);
                    dom.loadingSpinner.classList.remove('show');
                    state.isLoadingTrack = false;
                    this.next();
                    resolve(false);
                };
            });
        },
        
        next() {
            if (Date.now() - state.lastClickTime < 500) return;
            state.lastClickTime = Date.now();
            if (state.isLoadingTrack) return;
            let nextIndex = (state.currentIndex + 1) % state.filteredPlaylist.length;
            state.currentIndex = nextIndex;
            this.play();
        },
        
        prev() {
            if (Date.now() - state.lastClickTime < 500) return;
            state.lastClickTime = Date.now();
            if (state.isLoadingTrack) return;
            let prevIndex = (state.currentIndex - 1 + state.filteredPlaylist.length) % state.filteredPlaylist.length;
            state.currentIndex = prevIndex;
            this.play();
        },
        
        pause() {
            dom.musicPlayer.pause();
            state.isPlaying = false;
            dom.playBtn.innerHTML = '<i class="fas fa-play"></i>';
            if (state.progressInterval) clearInterval(state.progressInterval);
        },
        
        togglePlayPause() { state.isPlaying ? this.pause() : this.play(); },
        
        startProgressTimer() {
            if (state.progressInterval) clearInterval(state.progressInterval);
            state.progressInterval = setInterval(() => {
                if (state.isPlaying && dom.musicPlayer.duration && !dom.musicPlayer.paused) {
                    const percent = (dom.musicPlayer.currentTime / dom.musicPlayer.duration) * 100;
                    dom.progressFill.style.width = percent + '%';
                    dom.currentTimeEl.textContent = this.formatTime(dom.musicPlayer.currentTime);
                    dom.totalTimeEl.textContent = this.formatTime(dom.musicPlayer.duration);
                }
            }, 200);
        },
        
        mudarGenero(genero) {
            state.generoAtual = genero;
            state.filteredPlaylist = filtrarPorGenero(genero);
            state.currentIndex = 0;
            dom.genreBadge.innerHTML = genero === 'TODOS' ? '<i class="fas fa-random"></i> TODOS' : `<i class="fas fa-music"></i> ${genero}`;
            mostrarNotificacao(`🎵 ${genero}`, 1000);
            if (state.isPlaying) this.play();
        }
    };
    
    // ========== MODO TV ==========
    function ativarModoTv() {
        state.isTvMode = true;
        dom.tvOverlay.classList.add('active');
        dom.tvVideo.play();
        mostrarNotificacao("📺 MODO TV", 1000);
    }
    function desativarModoTv() {
        state.isTvMode = false;
        dom.tvOverlay.classList.remove('active');
        dom.tvVideo.pause();
        dom.tvVideo.currentTime = 0;
        mostrarNotificacao("🎵 Voltei", 1000);
    }
    
    // ========== COMPARTILHAR ==========
    function abrirCompartilhar() {
        if (navigator.share) navigator.share({ title: 'Rádio Patico', url: location.href });
        else { navigator.clipboard.writeText(location.href); mostrarNotificacao("Link copiado!", 1000); }
    }
    
    // ========== BLUETOOTH ==========
    async function conectarBluetooth() {
        mostrarNotificacao("🔵 Procurando...", 1200);
        if ('bluetooth' in navigator) {
            try { await navigator.bluetooth.requestDevice({ acceptAllDevices: true }); mostrarNotificacao("✅ Conectado", 2000); }
            catch(e) { mostrarNotificacao("❌ Cancelado", 1200); }
        } else { mostrarNotificacao("⚠️ Chrome/Edge", 1500); }
    }
    
    // ========== CONTROLES DE VISIBILIDADE ==========
    function hideControls() {
        if (state.isTvMode) return;
        dom.bottomControls.classList.add('hide-controls');
        dom.genreButton.style.opacity = '0';
        dom.menuButton.style.opacity = '0';
        document.getElementById('volumeControl').style.opacity = '0';
    }
    function showControls() {
        if (state.isTvMode) return;
        dom.bottomControls.classList.remove('hide-controls');
        dom.genreButton.style.opacity = '1';
        dom.menuButton.style.opacity = '1';
        document.getElementById('volumeControl').style.opacity = '1';
        if (state.controlsTimer) clearTimeout(state.controlsTimer);
        state.controlsTimer = setTimeout(() => { if (state.isPlaying && !state.isLoadingTrack) hideControls(); }, 3000);
    }
    
    // ========== EVENTOS ==========
    let radioStarted = false;
    function iniciarRadioDireto() {
        if (radioStarted) return;
        radioStarted = true;
        dom.splash.classList.add('hidden');
        setTimeout(() => dom.splash.style.display = 'none', 800);
        dom.appRoot.style.display = 'block';
        document.documentElement.requestFullscreen();
        PlayerEngine.mudarGenero('MPB');
        iniciarMonitorTravamento(); // liga o verificador
        PlayerEngine.play();
        showControls();
    }
    
    function setupEventListeners() {
        document.getElementById('splashStartBtn').addEventListener('click', iniciarRadioDireto);
        document.getElementById('skipAdBtn').addEventListener('click', iniciarRadioDireto);
        
        dom.playBtn.addEventListener('click', () => PlayerEngine.togglePlayPause());
        dom.prevBtn.addEventListener('click', () => PlayerEngine.prev());
        dom.nextBtn.addEventListener('click', () => PlayerEngine.next());
        dom.shuffleBtn.addEventListener('click', () => {
            state.filteredPlaylist = shuffleArray(state.filteredPlaylist);
            state.currentIndex = 0;
            mostrarNotificacao('🔀 Aleatório', 800);
            if (state.isPlaying) PlayerEngine.play();
        });
        document.getElementById('progressBar').addEventListener('click', e => {
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (dom.musicPlayer.duration) dom.musicPlayer.currentTime = percent * dom.musicPlayer.duration;
        });
        
        dom.genreButton.addEventListener('click', () => document.getElementById('genresModal').classList.add('open'));
        document.querySelectorAll('.genre-card').forEach(card => {
            card.addEventListener('click', () => {
                PlayerEngine.mudarGenero(card.getAttribute('data-genero'));
                document.getElementById('genresModal').classList.remove('open');
            });
        });
        document.getElementById('closeGenresBtn').addEventListener('click', () => document.getElementById('genresModal').classList.remove('open'));
        
        dom.menuButton.addEventListener('click', (e) => { e.stopPropagation(); dom.menuPopup.classList.toggle('open'); });
        document.addEventListener('click', (e) => { if (!dom.menuButton.contains(e.target) && !dom.menuPopup.contains(e.target)) dom.menuPopup.classList.remove('open'); });
        
        document.getElementById('tvMenuBtn').addEventListener('click', () => { ativarModoTv(); dom.menuPopup.classList.remove('open'); });
        document.getElementById('fullscreenMenuBtn').addEventListener('click', () => { document.documentElement.requestFullscreen(); dom.menuPopup.classList.remove('open'); });
        document.getElementById('shareMenuBtn').addEventListener('click', () => { abrirCompartilhar(); dom.menuPopup.classList.remove('open'); });
        document.getElementById('bluetoothMenuBtn').addEventListener('click', () => { conectarBluetooth(); dom.menuPopup.classList.remove('open'); });
        
        dom.tvCloseBtn.addEventListener('click', () => desativarModoTv());
        dom.volumeSlider.addEventListener('input', (e) => { dom.musicPlayer.volume = parseFloat(e.target.value); localStorage.setItem('radio_volume', e.target.value); });
        const savedVolume = localStorage.getItem('radio_volume');
        if (savedVolume) { dom.musicPlayer.volume = parseFloat(savedVolume); dom.volumeSlider.value = savedVolume; }
        
        // Toque para mostrar/esconder controles
        dom.appRoot.addEventListener('click', (e) => {
            if (state.isTvMode) return;
            if (e.target.closest('.control-btn') || e.target.closest('.genre-button') || e.target.closest('.menu-button')) { showControls(); return; }
            dom.bottomControls.classList.contains('hide-controls') ? showControls() : hideControls();
        });
        
        // Swipe para trocar música
        let touchStart = 0;
        dom.appRoot.addEventListener('touchstart', (e) => { if (!state.isTvMode) touchStart = e.changedTouches[0].screenX; });
        dom.appRoot.addEventListener('touchend', (e) => {
            if (state.isTvMode) return;
            const diff = e.changedTouches[0].screenX - touchStart;
            if (Math.abs(diff) > 60) diff > 0 ? PlayerEngine.prev() : PlayerEngine.next();
        });
    }
    
    // ========== INICIAR ==========
    async function init() {
        await carregarPlaylist();
        dom.musicPlayer.volume = 0.9;
        setupEventListeners();
        state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        document.body.addEventListener('touchstart', () => { if (state.audioContext?.state === 'suspended') state.audioContext.resume(); }, { once: true });
    }
    init();
    console.log('🚀 Rádio Patico - verificador de travamento ATIVO | Vídeo fixo pak.mp4');
</script>
</body>
