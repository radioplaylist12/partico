<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 16px;
        }

        /* Player Principal */
        .radio-container {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 24px 20px 32px;
            max-width: 480px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        /* Capa do Álbum */
        .album-cover {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #e63946, #ff6b6b, #ffb347);
            border-radius: 32px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 35px rgba(230, 57, 70, 0.4);
            animation: softPulse 2s infinite;
        }

        @keyframes softPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .album-cover i {
            font-size: 56px;
            color: white;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        /* Informações da Música */
        .music-title {
            text-align: center;
            color: white;
            font-size: 1.35rem;
            font-weight: bold;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 8px;
        }

        .music-artist {
            text-align: center;
            color: #aaa;
            font-size: 0.8rem;
            margin-bottom: 24px;
        }

        /* Barra de Progresso */
        .progress-wrapper {
            margin-bottom: 20px;
        }

        .time-row {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 0.7rem;
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #e63946;
            width: 0%;
            border-radius: 10px;
        }

        /* Botões de Controle */
        .control-buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 28px;
        }

        .ctrl-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .ctrl-btn:active {
            transform: scale(0.92);
            background: #e63946;
        }

        .play-pause {
            background: #e63946;
            width: 68px;
            height: 68px;
            font-size: 1.8rem;
            border: none;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.5);
        }

        /* Like / Deslike */
        .feedback-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .feedback-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            transition: 0.1s;
        }

        .feedback-btn:active { transform: scale(0.92); }
        .like { color: #4ade80; }
        .dislike { color: #ef4444; }

        /* Gêneros */
        .genres-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .genre-tag {
            background: rgba(255, 255, 255, 0.08);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #ddd;
            cursor: pointer;
            font-weight: 500;
            transition: 0.1s;
        }

        .genre-tag:active {
            background: #e63946;
            color: white;
            transform: scale(0.95);
        }

        /* Menu Inferior */
        .bottom-menu {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .menu-option {
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 25px;
            font-size: 0.7rem;
            color: #bbb;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .menu-option:active {
            background: #e63946;
            color: white;
        }

        /* Status */
        .player-status {
            text-align: center;
            margin-top: 12px;
            font-size: 0.7rem;
            color: #4ade80;
        }

        /* Botão Ativar (Destaque) */
        .activate-radio {
            background: linear-gradient(135deg, #ff8c00, #ff6600);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            animation: btnGlow 1.5s infinite;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        @keyframes btnGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 102, 0, 0.7); }
            50% { transform: scale(1.02); box-shadow: 0 0 0 8px rgba(255, 102, 0, 0); }
        }

        .activate-radio:active { transform: scale(0.98); }

        /* Modais */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
        }
        .modal-overlay.open { display: block; }

        .modal-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(145deg, #1a1a2e, #0f0f1a);
            border-radius: 32px;
            padding: 24px;
            max-width: 300px;
            width: 85%;
            text-align: center;
            border: 2px solid #e63946;
            z-index: 1001;
            display: none;
            color: white;
        }
        .modal-card.open { display: block; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -40%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        .modal-card h3 { color: #e63946; margin-bottom: 16px; }
        .modal-card p { margin: 8px 0; font-size: 0.9rem; }
        .modal-card button {
            background: #e63946;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            margin-top: 18px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        /* Toast */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            color: white;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 0.8rem;
            z-index: 2000;
            opacity: 0;
            transition: 0.2s;
            white-space: nowrap;
            pointer-events: none;
            border-left: 3px solid #e63946;
        }
        .toast-msg.show { opacity: 1; }

        /* Modo Carro (simplificado para caber) */
        @media (max-width: 480px) {
            .radio-container { padding: 20px 16px 28px; }
            .album-cover { width: 120px; height: 120px; }
            .album-cover i { font-size: 48px; }
            .ctrl-btn { width: 48px; height: 48px; }
            .play-pause { width: 60px; height: 60px; font-size: 1.5rem; }
        }
    </style>
</head>

    { id: 439, title: "Epitáfio", artist: "Titãs", src: "Epit_fio_Epit_fio_muzzik.m4a", genero: "MPB", tipo: "ao vivo" },
    { id: 440, title: "Espumas ao Vento", artist: "Fagner", src: "Espumas_ao_Espumas_ao_Vento.m4a", genero: "MPB", tipo: "ao vivo" },
    { id: 441, title: "Esquece e Vem", artist: "Nico Rezende", src: "Esquece_e_Esquece_e_vem_Nico_5.m4a", genero: "MPB", tipo: "ao vivo" },

    ];

    const GENRES_LIST = ["TODOS", "POP", "ROCK", "JAZZ", "CLASSICA", "ELETRONICA", "MPB", "SAMBA"];

    // ==================== VARIÁVEIS GLOBAIS ====================
    let activePlaylist = [...MUSIC_DB];
    let currentIdx = 0;
    let isPlaying = false;
    let isRadioActive = false;
    let progressInterval = null;
    let likes = [];
    let dislikes = [];
    let statsData = { played: 0, totalSec: 0 };

    // Elementos DOM
    const audio = document.getElementById('audioPlayer');
    const activateBtn = document.getElementById('activateBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const songTitleSpan = document.getElementById('songTitle');
    const songArtistSpan = document.getElementById('songArtist');
    const progressFillDiv = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const totalTimeSpan = document.getElementById('totalTime');
    const progressBarBg = document.getElementById('progressBarBg');
    const statusSpan = document.getElementById('statusMsg');
    const likeButton = document.getElementById('likeBtn');
    const dislikeButton = document.getElementById('dislikeBtn');
    const genresContainer = document.getElementById('genresContainer');
    const toastDiv = document.getElementById('toastMsg');

    // ==================== FUNÇÕES DE APOIO ====================
    function showToast(msg, duration = 2000) {
        toastDiv.innerText = msg;
        toastDiv.classList.add('show');
        setTimeout(() => toastDiv.classList.remove('show'), duration);
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "0:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updatePlayerUI() {
        const track = activePlaylist[currentIdx];
        if (track) {
            songTitleSpan.innerText = track.title;
            songArtistSpan.innerText = `${track.artist} • ${track.genre}`;
        }
        statusSpan.innerHTML = isPlaying ? '<i class="fas fa-play-circle"></i> Tocando agora' : '<i class="fas fa-pause-circle"></i> Pausado';
    }

    function loadTrack(index) {
        if (index >= activePlaylist.length) index = 0;
        if (index < 0) index = activePlaylist.length - 1;
        currentIdx = index;
        const track = activePlaylist[currentIdx];
        audio.src = track.src;
        audio.load();
        updatePlayerUI();
        progressFillDiv.style.width = '0%';
        currentTimeSpan.innerText = '0:00';
        totalTimeSpan.innerText = '0:00';
    }

    function startProgressTimer() {
        if (progressInterval) clearInterval(progressInterval);
        progressInterval = setInterval(() => {
            if (audio.duration && !isNaN(audio.duration) && isPlaying) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFillDiv.style.width = percent + '%';
                currentTimeSpan.innerText = formatTime(audio.currentTime);
                totalTimeSpan.innerText = formatTime(audio.duration);
            }
        }, 400);
    }

    function playMusic() {
        if (!isRadioActive) {
            showToast("⚠️ Primeiro clique em ATIVAR RÁDIO", 2000);
            return;
        }
        audio.play().then(() => {
            isPlaying = true;
            playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
            startProgressTimer();
            statusSpan.innerHTML = '<i class="fas fa-play-circle"></i> Tocando agora';
            showToast(`🎵 Tocando: ${activePlaylist[currentIdx].title}`);
        }).catch(err => {
            console.log("Erro ao tocar:", err);
            showToast("🔊 Clique no botão ATIVAR RÁDIO primeiro", 2000);
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        });
    }

    function pauseMusic() {
        audio.pause();
        isPlaying = false;
        playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
        if (progressInterval) clearInterval(progressInterval);
        statusSpan.innerHTML = '<i class="fas fa-pause-circle"></i> Pausado';
    }

    function togglePlayPause() {
        if (!isRadioActive) {
            showToast("⚠️ Ative a rádio primeiro!", 1500);
            return;
        }
        isPlaying ? pauseMusic() : playMusic();
    }

    function nextTrack() {
        if (!isRadioActive) return;
        let newIdx = currentIdx + 1;
        if (newIdx >= activePlaylist.length) newIdx = 0;
        loadTrack(newIdx);
        if (isPlaying) playMusic();
        statsData.played++;
        saveStatsLocally();
        showToast("⏭️ Próxima música", 1000);
    }

    function prevTrack() {
        if (!isRadioActive) return;
        let newIdx = currentIdx - 1;
        if (newIdx < 0) newIdx = activePlaylist.length - 1;
        loadTrack(newIdx);
        if (isPlaying) playMusic();
        showToast("⏮️ Voltar música", 1000);
    }

    function seekToPosition(e) {
        if (!isRadioActive) return;
        const rect = progressBarBg.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        if (audio.duration) audio.currentTime = percent * audio.duration;
    }

    // ==================== GÊNEROS ====================
    function buildGenres() {
        genresContainer.innerHTML = '';
        GENRES_LIST.forEach(genre => {
            const tag = document.createElement('span');
            tag.className = 'genre-tag';
            tag.innerText = genre;
            tag.onclick = () => filterByGenre(genre);
            genresContainer.appendChild(tag);
        });
    }

    function filterByGenre(genre) {
        if (!isRadioActive) { showToast("Ative a rádio primeiro", 1500); return; }
        if (genre === "TODOS") {
            activePlaylist = [...MUSIC_DB];
        } else {
            const filtered = MUSIC_DB.filter(m => m.genre === genre);
            activePlaylist = filtered.length ? filtered : [...MUSIC_DB];
        }
        currentIdx = 0;
        loadTrack(0);
        if (isPlaying) playMusic();
        showToast(`🎵 Gênero: ${genre}`, 1500);
    }

    // ==================== LIKE / DISLIKE (IA) ====================
    function saveUserPrefs() { localStorage.setItem('radio_prefs', JSON.stringify({ likes, dislikes })); }
    function loadUserPrefs() {
        const raw = localStorage.getItem('radio_prefs');
        if (raw) {
            try { const data = JSON.parse(raw); likes = data.likes || []; dislikes = data.dislikes || []; } catch(e) {}
        }
    }

    function likeCurrent() {
        if (!isRadioActive) { showToast("Ative a rádio primeiro", 1500); return; }
        const track = activePlaylist[currentIdx];
        if (!likes.includes(track.id)) {
            likes.push(track.id);
            dislikes = dislikes.filter(id => id !== track.id);
            saveUserPrefs();
            showToast(`👍 Curtiu "${track.title}"`, 1500);
        } else {
            showToast(`❤️ "${track.title}" já foi curtida`, 1000);
        }
    }

    function dislikeCurrent() {
        if (!isRadioActive) { showToast("Ative a rádio primeiro", 1500); return; }
        const track = activePlaylist[currentIdx];
        if (!dislikes.includes(track.id)) {
            dislikes.push(track.id);
            likes = likes.filter(id => id !== track.id);
            saveUserPrefs();
            showToast(`👎 Não curtiu "${track.title}"`, 1500);
            nextTrack();
        } else {
            showToast(`👎 "${track.title}" já está nos dislikes`, 1000);
        }
    }

    // ==================== ESTATÍSTICAS ====================
    function saveStatsLocally() { localStorage.setItem('radio_stats', JSON.stringify(statsData)); }
    function loadStatsLocally() {
        const stored = localStorage.getItem('radio_stats');
        if (stored) {
            try { statsData = JSON.parse(stored); } catch(e) {}
        }
    }

    function showStatsModal() {
        const content = `
            <p>🎵 Músicas ouvidas: ${statsData.played}</p>
            <p>⏱️ Tempo total: ${Math.floor(statsData.totalSec / 60)} min</p>
            <p>👍 Curtidas: ${likes.length}</p>
            <p>👎 Dislikes: ${dislikes.length}</p>
        `;
        document.getElementById('statsContent').innerHTML = content;
        document.getElementById('modalOverlay').classList.add('open');
        document.getElementById('statsModal').classList.add('open');
    }

    function showAiModal() {
        const content = `
            <p>🤖 IA - Preferências</p>
            <p>✅ Músicas curtidas: ${likes.length}</p>
            <p>❌ Músicas rejeitadas: ${dislikes.length}</p>
            <p style="margin-top:12px;">💡 Quanto mais você curte, mais a IA aprende seu gosto!</p>
        `;
        document.getElementById('aiContent').innerHTML = content;
        document.getElementById('modalOverlay').classList.add('open');
        document.getElementById('aiModal').classList.add('open');
    }

    function closeAllModals() {
        document.getElementById('modalOverlay').classList.remove('open');
        document.getElementById('statsModal').classList.remove('open');
        document.getElementById('aiModal').classList.remove('open');
        document.getElementById('tvPixModal').classList.remove('open');
    }

    // ==================== MODO TV (PIX) ====================
    function showTvPix() {
        document.getElementById('modalOverlay').classList.add('open');
        document.getElementById('tvPixModal').classList.add('open');
    }

    function copyPixKey() {
        navigator.clipboard.writeText("12988461978");
        showToast("✅ Chave PIX copiada: 12988461978", 2000);
        closeAllModals();
    }

    // ==================== OUTRAS FUNÇÕES ====================
    function shareApp() {
        if (navigator.share) {
            navigator.share({ title: 'Rádio Patico IA', text: '🎵 Rádio com IA que aprende seu gosto!', url: window.location.href });
        } else {
            navigator.clipboard.writeText(window.location.href);
            showToast("🔗 Link copiado!", 1500);
        }
    }

    function goFullscreen() { document.documentElement.requestFullscreen(); }

    function activateRadioSystem() {
        if (isRadioActive) return;
        isRadioActive = true;
        activateBtn.style.display = 'none';
        loadUserPrefs();
        loadStatsLocally();
        loadTrack(0);
        statusSpan.innerHTML = '<i class="fas fa-check-circle"></i> Rádio ativada! Clique no PLAY';
        statusSpan.style.color = '#a3e635';
        showToast("✅ Rádio ativada com sucesso! Aperte o play.", 2500);
        // tenta tocar (pode ser bloqueado, mas ok)
        audio.play().catch(() => {});
    }

    // ==================== MODO CARRO ====================
    let isCarMode = false;
    function toggleCarMode() {
        isCarMode = !isCarMode;
        if (isCarMode) {
            document.body.style.background = "#000";
            document.querySelector('.radio-container').style.transform = "scale(1.02)";
            showToast("🚗 Modo Carro ativado (botões maiores)", 1500);
        } else {
            document.querySelector('.radio-container').style.transform = "scale(1)";
            showToast("Modo Carro desativado", 1000);
        }
    }

    // ==================== EVENTOS PRINCIPAIS ====================
    activateBtn.addEventListener('click', activateRadioSystem);
    playPauseBtn.addEventListener('click', togglePlayPause);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);
    progressBarBg.addEventListener('click', seekToPosition);
    likeButton.addEventListener('click', likeCurrent);
    dislikeButton.addEventListener('click', dislikeCurrent);
    document.getElementById('statsBtn').addEventListener('click', showStatsModal);
    document.getElementById('aiBtn').addEventListener('click', showAiModal);
    document.getElementById('shareBtn').addEventListener('click', shareApp);
    document.getElementById('fullscreenBtn').addEventListener('click', goFullscreen);
    document.getElementById('carModeBtn').addEventListener('click', toggleCarMode);
    document.getElementById('tvModeBtn').addEventListener('click', showTvPix);
    document.getElementById('copyPixBtn').addEventListener('click', copyPixKey);
    document.getElementById('closeTvPix').addEventListener('click', closeAllModals);
    document.getElementById('closeStats').addEventListener('click', closeAllModals);
    document.getElementById('closeAi').addEventListener('click', closeAllModals);
    document.getElementById('modalOverlay').addEventListener('click', closeAllModals);

    // Eventos do áudio
    audio.addEventListener('ended', () => { nextTrack(); });
    audio.addEventListener('timeupdate', () => {
        if (audio.currentTime > 0 && !statsData.savedFlag) {
            statsData.totalSec += audio.currentTime;
            saveStatsLocally();
            statsData.savedFlag = true;
        }
    });
    audio.addEventListener('loadedmetadata', () => {
        totalTimeSpan.innerText = formatTime(audio.duration);
    });

    // ==================== GESTOS (DESLIZAR) ====================
    let touchStart = 0;
    document.addEventListener('touchstart', (e) => {
        touchStart = e.changedTouches[0].screenX;
    });
    document.addEventListener('touchend', (e) => {
        if (!isRadioActive) return;
        const diff = e.changedTouches[0].screenX - touchStart;
        if (Math.abs(diff) > 60) {
            if (diff > 0) prevTrack();
            else nextTrack();
        }
    });

    // ==================== INICIALIZAR ====================
    buildGenres();
    audio.volume = 0.8;
    console.log("✅ Rádio Patico IA - COMPLETA! Clique no botão LARANJA para ativar.");
</script>
