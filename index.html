<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rádio Patico - Player Musical</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .app {
            width: 100%;
            height: 100vh;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        /* Video Background */
        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Overlay escuro para legibilidade */
        .overlay-dark {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            z-index: 2;
            pointer-events: none;
        }

        /* Container principal de controles */
        .controls-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.2);
            padding: 16px 20px 25px;
            z-index: 20;
            transition: transform 0.3s ease;
        }

        .controls-container.hide {
            transform: translateY(100%);
        }

        /* Informações da música */
        .track-title {
            text-align: center;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            text-align: center;
            color: #ccc;
            font-size: 0.8rem;
            margin-bottom: 8px;
        }

        .next-info {
            text-align: center;
            font-size: 0.7rem;
            color: #aaa;
            margin-bottom: 8px;
        }

        /* Barra de progresso */
        .progress-area {
            margin-bottom: 12px;
        }
        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #ccc;
            margin-bottom: 4px;
        }
        .progress-bar-bg {
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            cursor: pointer;
        }
        .progress-fill {
            height: 100%;
            background: #e63946;
            width: 0%;
            border-radius: 3px;
        }

        /* Botões de controle */
        .control-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 10px;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:active {
            transform: scale(0.92);
            background: #e63946;
        }
        .play-btn {
            background: #e63946;
            width: 56px;
            height: 56px;
            font-size: 1.5rem;
            box-shadow: 0 0 15px rgba(230,57,70,0.5);
        }

        /* Botões de like/dislike (avaliação do site) */
        .rating-bar {
            position: fixed;
            bottom: 140px;
            left: 20px;
            display: flex;
            gap: 12px;
            z-index: 25;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .rating-btn {
            background: transparent;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 40px;
            transition: 0.1s;
        }
        .rating-btn.like { color: #4ade80; }
        .rating-btn.dislike { color: #f87171; }
        .rating-btn:active { transform: scale(0.85); }

        /* Botão de gêneros */
        .genre-fab {
            position: fixed;
            bottom: 140px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: radial-gradient(circle at 30% 20%, #1e1e2f, #0a0a1a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 25;
            border: 1px solid rgba(0,255,255,0.5);
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
            transition: 0.1s;
        }
        .genre-fab:active { transform: scale(0.9); background: #e63946; }
        .genre-fab i { font-size: 1.4rem; color: #0ff; }

        /* Modal de Gêneros */
        .modal-genres {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
            border-radius: 28px 28px 0 0;
            padding: 24px 16px 30px;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            border-top: 1px solid #e63946;
        }
        .modal-genres.open { transform: translateY(0); }
        .modal-genres h3 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        .genres-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .genre-card {
            background: rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: 0.1s;
        }
        .genre-card:active { transform: scale(0.96); background: #e63946; }
        .genre-card i { font-size: 1.5rem; color: white; display: block; margin-bottom: 5px; }
        .genre-card span { font-size: 0.7rem; font-weight: bold; color: white; }
        .close-genres {
            width: 100%;
            background: #e63946;
            border: none;
            padding: 12px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* Menu lateral */
        .menu-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 1.2rem;
        }
        .menu-popup {
            position: fixed;
            top: 68px;
            right: 12px;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 10px;
            z-index: 31;
            display: none;
            flex-direction: column;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .menu-popup.open { display: flex; }
        .menu-popup button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            text-align: left;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .menu-popup button:active { background: #e63946; }

        /* Notificações */
        .toast-msg {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            font-size: 0.8rem;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .toast-msg.show { opacity: 1; }

        /* Splash */
        .splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s;
        }
        .splash.hide { opacity: 0; pointer-events: none; }
        .splash-content { text-align: center; color: white; }
        .splash-content i { font-size: 4rem; color: #e63946; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; transform: scale(1); } 100% { opacity: 1; transform: scale(1.05); } }

        .activate-btn {
            position: fixed;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff8c00, #ff6600);
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            z-index: 10001;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 0 20px rgba(255,102,0,0.5);
        }
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            z-index: 10002;
            display: none;
            gap: 8px;
        }
        .volume-toast {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: black;
            padding: 6px 16px;
            border-radius: 30px;
            color: white;
            font-size: 0.75rem;
            z-index: 10003;
            opacity: 0;
            transition: 0.1s;
        }
        .genre-badge {
            position: fixed;
            top: 16px;
            left: 16px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            padding: 5px 14px;
            border-radius: 30px;
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            z-index: 30;
            border-left: 3px solid #e63946;
        }
    </style>
</head>

    // Gêneros disponíveis (extraídos da playlist)
    const ALL_GENRES = [...new Set(PLAYLIST.map(m => m.genero))].sort();
    const GENRES_LIST = ["TODOS", ...ALL_GENRES];

    // Estado do app
    let state = {
        isPlaying: false,
        currentIndex: 0,
        filteredPlaylist: [],
        currentGenre: "TODOS",
        audioAllowed: false,
        timerInterval: null,
        trackStartTime: 0,
        totalDuration: 0,
        volume: 0.8
    };

    // DOM elements
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const nextInfo = document.getElementById('nextInfo');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const totalTimeSpan = document.getElementById('totalTime');
    const progressBarBg = document.getElementById('progressBarBg');
    const toastMsg = document.getElementById('toastMsg');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const activateBtn = document.getElementById('activateBtn');
    const splash = document.getElementById('splash');
    const genreBadgeSpan = document.getElementById('genreBadge');
    const volumeToastDiv = document.getElementById('volumeToast');
    const controlsBar = document.getElementById('controlsBar');
    const likeBtn = document.getElementById('likeBtn');
    const dislikeBtn = document.getElementById('dislikeBtn');
    const genreFab = document.getElementById('genreFab');
    const genresModal = document.getElementById('genresModal');
    const closeGenresBtn = document.getElementById('closeGenresBtn');
    const genresGrid = document.getElementById('genresGrid');
    const menuBtn = document.getElementById('menuBtn');
    const menuPopup = document.getElementById('menuPopup');
    const tvModeBtn = document.getElementById('tvModeBtn');
    const shareBtn = document.getElementById('shareBtn');
    const infoBtn = document.getElementById('infoBtn');
    const bgVideo = document.getElementById('bgVideo');

    // Helper: show toast
    function showToast(text, duration = 2000) {
        toastMsg.textContent = text;
        toastMsg.classList.add('show');
        setTimeout(() => toastMsg.classList.remove('show'), duration);
    }

    // Formatar tempo
    function formatTime(sec) {
        if (isNaN(sec)) return "0:00";
        const mins = Math.floor(sec / 60);
        const seconds = Math.floor(sec % 60);
        return `${mins}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    // Atualizar informações da UI
    function updateTrackInfo() {
        const track = state.filteredPlaylist[state.currentIndex];
        if (!track) return;
        trackTitle.textContent = track.title;
        trackArtist.textContent = track.artist;
        const nextTrack = state.filteredPlaylist[(state.currentIndex + 1) % state.filteredPlaylist.length];
        nextInfo.textContent = nextTrack ? `Próxima: ${nextTrack.title} - ${nextTrack.artist}` : "Próxima: --";
        genreBadgeSpan.innerHTML = `<i class="fas fa-tag"></i> ${state.currentGenre === "TODOS" ? "TODOS OS ESTILOS" : state.currentGenre}`;
        
        // Trocar vídeo de fundo baseado no gênero (simples)
        if (state.currentGenre === "SERTANEJO") bgVideo.src = "https://videos.pexels.com/video-files/3172282/3172282-uhd_1440_2560_30fps.mp4";
        else if (state.currentGenre === "FORRÓ") bgVideo.src = "https://videos.pexels.com/video-files/2845281/2845281-uhd_1440_2560_25fps.mp4";
        else bgVideo.src = "https://videos.pexels.com/video-files/855742/855742-hd_1920_1080_30fps.mp4";
        bgVideo.play().catch(e=>{});
    }

    // Carregar e tocar música atual
    async function loadAndPlay() {
        if (!state.audioAllowed) {
            showToast("🔊 Clique em ATIVAR PLAYER primeiro!", 2000);
            return false;
        }
        const track = state.filteredPlaylist[state.currentIndex];
        if (!track) return false;
        loadingSpinner.style.display = "flex";
        audio.pause();
        audio.src = track.src;
        audio.load();
        
        return new Promise((resolve) => {
            const timeout = setTimeout(() => {
                loadingSpinner.style.display = "none";
                showToast("Erro ao carregar música", 1500);
                resolve(false);
            }, 8000);
            
            audio.oncanplaythrough = async () => {
                clearTimeout(timeout);
                loadingSpinner.style.display = "none";
                try {
                    await audio.play();
                    state.isPlaying = true;
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    updateTrackInfo();
                    startProgressTimer();
                    resolve(true);
                } catch (err) {
                    showToast("Reprodução automática bloqueada", 1500);
                    state.isPlaying = false;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    resolve(false);
                }
            };
            audio.onerror = () => {
                clearTimeout(timeout);
                loadingSpinner.style.display = "none";
                showToast("Falha no áudio", 1500);
                resolve(false);
            };
        });
    }

    // Timer da barra de progresso
    function startProgressTimer() {
        if (state.timerInterval) clearInterval(state.timerInterval);
        state.timerInterval = setInterval(() => {
            if (audio.duration && !audio.paused) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${percent}%`;
                currentTimeSpan.textContent = formatTime(audio.currentTime);
                totalTimeSpan.textContent = formatTime(audio.duration);
            }
        }, 200);
    }
    
    function stopProgressTimer() {
        if (state.timerInterval) clearInterval(state.timerInterval);
        state.timerInterval = null;
    }

    // Avançar música
    async function nextTrack() {
        if (!state.filteredPlaylist.length) return;
        state.currentIndex = (state.currentIndex + 1) % state.filteredPlaylist.length;
        updateTrackInfo();
        if (state.isPlaying) {
            await loadAndPlay();
        } else {
            // Apenas atualiza info
            const track = state.filteredPlaylist[state.currentIndex];
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
            totalTimeSpan.textContent = "0:00";
            progressFill.style.width = "0%";
            currentTimeSpan.textContent = "0:00";
        }
    }

    async function prevTrack() {
        if (!state.filteredPlaylist.length) return;
        state.currentIndex = (state.currentIndex - 1 + state.filteredPlaylist.length) % state.filteredPlaylist.length;
        updateTrackInfo();
        if (state.isPlaying) {
            await loadAndPlay();
        } else {
            const track = state.filteredPlaylist[state.currentIndex];
            trackTitle.textContent = track.title;
            trackArtist.textContent = track.artist;
        }
    }

    // Toggle play/pause
    async function togglePlay() {
        if (!state.audioAllowed) {
            showToast("Ative o player no botão laranja", 1500);
            return;
        }
        if (state.isPlaying) {
            audio.pause();
            state.isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopProgressTimer();
        } else {
            if (audio.src && audio.currentTime > 0 && !audio.ended) {
                await audio.play();
                state.isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                startProgressTimer();
            } else {
                await loadAndPlay();
            }
        }
    }

    // Filtrar por gênero
    function filterByGenre(genre) {
        if (genre === "TODOS") {
            state.filteredPlaylist = [...PLAYLIST];
        } else {
            state.filteredPlaylist = PLAYLIST.filter(m => m.genero === genre);
            if (state.filteredPlaylist.length === 0) {
                showToast(`Nenhuma música para ${genre}`, 1500);
                state.filteredPlaylist = [...PLAYLIST];
                genre = "TODOS";
            }
        }
        state.currentGenre = genre;
        state.currentIndex = 0;
        updateTrackInfo();
        if (state.isPlaying) {
            loadAndPlay();
        } else {
            const track = state.filteredPlaylist[0];
            if (track) {
                trackTitle.textContent = track.title;
                trackArtist.textContent = track.artist;
                totalTimeSpan.textContent = "0:00";
                progressFill.style.width = "0%";
                currentTimeSpan.textContent = "0:00";
            }
        }
        showToast(`🎵 Estilo: ${genre}`, 1500);
        genresModal.classList.remove('open');
    }

    // Construir modal de gêneros
    function buildGenresModal() {
        genresGrid.innerHTML = "";
        GENRES_LIST.forEach(genre => {
            const card = document.createElement('div');
            card.className = 'genre-card';
            let icon = "fa-music";
            if (genre === "SERTANEJO") icon = "fa-guitar";
            else if (genre === "FORRÓ") icon = "fa-drum";
            else if (genre === "SAMBA") icon = "fa-dance";
            else if (genre === "POP") icon = "fa-microphone-alt";
            else if (genre === "MPB") icon = "fa-guitar";
            else if (genre === "BREGA") icon = "fa-heart";
            else if (genre === "TODOS") icon = "fa-list-ul";
            card.innerHTML = `<i class="fas ${icon}"></i><span>${genre}</span>`;
            card.addEventListener('click', () => filterByGenre(genre));
            genresGrid.appendChild(card);
        });
    }

    // Inicializar com todos
    function initPlayer() {
        state.filteredPlaylist = [...PLAYLIST];
        state.currentGenre = "TODOS";
        state.currentIndex = 0;
        updateTrackInfo();
        audio.volume = state.volume;
        // Evento de finalizar música
        audio.onended = () => {
            nextTrack();
        };
        buildGenresModal();
    }

    // Ativar áudio (user gesture)
    async function activateAudio() {
        try {
            // Forçar toque de áudio silencioso para desbloquear
            const testAudio = new Audio();
            testAudio.volume = 0;
            await testAudio.play().catch(()=>{});
            state.audioAllowed = true;
            splash.classList.add('hide');
            activateBtn.style.display = 'none';
            showToast("✅ Áudio ativado! Aproveite a música", 2500);
            await loadAndPlay();
        } catch (err) {
            showToast("Toque no botão novamente para ativar", 2000);
            state.audioAllowed = false;
        }
    }

    // Avaliações (Like/Dislike - apenas feedback do site)
    function sendLike() {
        const track = state.filteredPlaylist[state.currentIndex];
        if(track) showToast(`👍 Obrigado por curtir "${track.title}"! Sua opinião é importante.`, 2500);
        else showToast("👍 Curtiu! Avaliação registrada.", 2000);
    }
    function sendDislike() {
        const track = state.filteredPlaylist[state.currentIndex];
        if(track) showToast(`👎 Que pena que não gostou de "${track.title}". Vamos melhorar!`, 2500);
        else showToast("👎 Feedback registrado.", 2000);
    }

    // Modo TV / Fullscreen
    function toggleTvMode() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => showToast("Erro fullscreen", 1500));
            showToast("📺 Modo TV ativado", 1500);
        } else {
            document.exitFullscreen();
            showToast("Modo normal", 1500);
        }
    }
    function shareApp() {
        if (navigator.share) {
            navigator.share({ title: "Rádio Patico", text: "Ouça música variada!", url: window.location.href });
        } else {
            navigator.clipboard.writeText(window.location.href);
            showToast("Link copiado!", 1500);
        }
    }
    function showAbout() {
        showToast("🎵 Rádio Patico - Player com diversos estilos! Use likes para avaliar o site.", 3000);
    }

    // Controle de volume por gesto (direita esquerda)
    let touchStartX = 0;
    let lastTap = 0;
    document.addEventListener('touchstart', (e) => {
        if (e.target.closest('.controls-container') || e.target.closest('.rating-bar') || e.target.closest('.genre-fab')) return;
        touchStartX = e.touches[0].clientX;
        const now = Date.now();
        if (now - lastTap < 300) {
            e.preventDefault();
            togglePlay();
            lastTap = 0;
        } else { lastTap = now; }
    });
    document.addEventListener('touchend', (e) => {
        if (!touchStartX) return;
        const diff = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) prevTrack();
            else nextTrack();
            showToast(diff > 0 ? "⏮ Anterior" : "⏭ Próxima", 1000);
        }
        touchStartX = 0;
    });

    // Controle de volume deslizando na borda direita
    let volumeStartY = 0;
    const volumeZone = document.createElement('div');
    volumeZone.style.position = 'fixed';
    volumeZone.style.right = '0';
    volumeZone.style.top = '20%';
    volumeZone.style.bottom = '20%';
    volumeZone.style.width = '30px';
    volumeZone.style.zIndex = '50';
    volumeZone.style.background = 'transparent';
    document.body.appendChild(volumeZone);
    volumeZone.addEventListener('touchstart', (e) => { volumeStartY = e.touches[0].clientY; e.preventDefault(); });
    volumeZone.addEventListener('touchmove', (e) => {
        const delta = (volumeStartY - e.touches[0].clientY) / 300;
        let newVol = Math.min(1, Math.max(0, audio.volume + delta));
        audio.volume = newVol;
        state.volume = newVol;
        volumeToastDiv.textContent = `🔊 Volume: ${Math.round(newVol*100)}%`;
        volumeToastDiv.style.opacity = '1';
        setTimeout(() => volumeToastDiv.style.opacity = '0', 800);
        volumeStartY = e.touches[0].clientY;
    });
    
    // Event listeners UI
    activateBtn.addEventListener('click', activateAudio);
    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);
    likeBtn.addEventListener('click', sendLike);
    dislikeBtn.addEventListener('click', sendDislike);
    genreFab.addEventListener('click', () => genresModal.classList.add('open'));
    closeGenresBtn.addEventListener('click', () => genresModal.classList.remove('open'));
    menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menuPopup.classList.toggle('open'); });
    document.addEventListener('click', (e) => { if (!menuBtn.contains(e.target)) menuPopup.classList.remove('open'); });
    tvModeBtn.addEventListener('click', () => { toggleTvMode(); menuPopup.classList.remove('open'); });
    shareBtn.addEventListener('click', () => { shareApp(); menuPopup.classList.remove('open'); });
    infoBtn.addEventListener('click', () => { showAbout(); menuPopup.classList.remove('open'); });
    progressBarBg.addEventListener('click', (e) => {
        const rect = progressBarBg.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        if (audio.duration) audio.currentTime = percent * audio.duration;
    });
    
    // Auto-hide controls
    let hideTimer;
    function showControls() { controlsBar.classList.remove('hide'); clearTimeout(hideTimer); hideTimer = setTimeout(() => controlsBar.classList.add('hide'), 3000); }
    document.addEventListener('touchstart', showControls);
    document.addEventListener('click', showControls);
    showControls();

    // Inicializar
    initPlayer();
    audio.volume = 0.8;
    // video bg loop
    bgVideo.play().catch(()=>{});
    showToast("Bem-vindo! Clique em ATIVAR PLAYER", 3000);
</script>
