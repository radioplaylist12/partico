<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Rádio Patico IA - FUNCIONAL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        /* BOTÃO LARANJA - PRINCIPAL */
        .btn-laranja {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff8c00, #ff5500);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 18px 40px;
            border: none;
            border-radius: 60px;
            z-index: 99999;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 68, 0, 0.8);
            animation: pular 1s infinite;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }

        .btn-laranja.ativo {
            background: linear-gradient(135deg, #00aa44, #008833);
            animation: none;
            box-shadow: 0 0 20px rgba(0, 170, 68, 0.5);
        }

        @keyframes pular {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
            100% { transform: translateX(-50%) scale(1); }
        }

        /* Player principal */
        .player {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            z-index: 100;
            border-top: 1px solid rgba(255,255,255,0.1);
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .player.visible {
            transform: translateY(0);
        }

        .musica-nome {
            color: white;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .proxima {
            color: #aaa;
            font-size: 0.7rem;
            text-align: center;
            margin-bottom: 8px;
        }

        .progresso {
            margin-bottom: 10px;
        }

        .tempos {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 0.65rem;
            margin-bottom: 4px;
        }

        .barra {
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            cursor: pointer;
        }

        .preenchimento {
            height: 100%;
            background: #e63946;
            width: 0%;
            border-radius: 3px;
        }

        .botoes {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 5px;
        }

        .botao {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .botao-play {
            background: #e63946;
            width: 56px;
            height: 56px;
            font-size: 1.3rem;
        }

        .botao:active {
            transform: scale(0.95);
        }

        /* Like/Dislike */
        .likes {
            position: fixed;
            bottom: 110px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .like-btn, .dislike-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .like-btn { color: #4ade80; }
        .dislike-btn { color: #ef4444; }

        /* Botão gênero */
        .genero-btn {
            position: fixed;
            bottom: 110px;
            right: 90px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a2e, #0a0a1a);
            border: 2px solid #00ffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .genero-btn i { font-size: 1.3rem; color: #0ff; }

        /* Botão Pix */
        .pix-btn {
            position: fixed;
            bottom: 110px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            padding: 8px 14px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            border: 1px solid #ffd700;
            z-index: 100;
        }

        .pix-btn i { color: #ffd700; }
        .pix-btn span { color: white; font-size: 0.7rem; font-weight: bold; }

        /* Status */
        .status {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 30px;
            z-index: 100;
            font-size: 0.7rem;
            color: #ffaa00;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status.ativo { color: #4ade80; }

        /* Modal gêneros */
        .modal-generos {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 30px 30px 0 0;
            padding: 20px;
            z-index: 1000;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .modal-generos.open { transform: translateY(0); }

        .modal-generos h3 {
            color: white;
            text-align: center;
            margin-bottom: 15px;
        }

        .grid-generos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .card-genero {
            background: rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
        }

        .card-genero i { font-size: 1.5rem; color: white; display: block; margin-bottom: 5px; }
        .card-genero span { font-size: 0.7rem; color: white; font-weight: bold; }

        .fechar-modal {
            width: 100%;
            padding: 12px;
            background: #e63946;
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* Mensagem flutuante */
        .toast {
            position: fixed;
            bottom: 40%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.8rem;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
            pointer-events: none;
        }

        .toast.show { opacity: 1; }

        /* Loading */
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 15px 25px;
            border-radius: 50px;
            color: white;
            display: none;
            gap: 10px;
            z-index: 10001;
        }

        /* Vídeo */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        .toque-info {
            position: fixed;
            bottom: 45%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 0.7rem;
            z-index: 100;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<!-- VÍDEO DE FUNDO -->
<video class="video-bg" id="videoBg" autoplay loop muted playsinline></video>

<!-- BOTÃO LARANJA PRINCIPAL -->
<button class="btn-laranja" id="btnAtivar">
    <i class="fas fa-play-circle"></i>
    🎵 ATIVAR RÁDIO
</button>

<!-- STATUS -->
<div class="status" id="status">
    <i class="fas fa-circle"></i>
    <span>Aguardando</span>
</div>

<!-- PLAYER -->
<div class="player" id="player">
    <div class="musica-nome" id="musicaNome">🎵 Rádio Patico IA</div>
    <div class="proxima" id="proximaMusica">Próxima: --</div>
    <div class="progresso">
        <div class="tempos">
            <span id="tempoAtual">0:00</span>
            <span id="tempoTotal">0:00</span>
        </div>
        <div class="barra" id="barraProgresso">
            <div class="preenchimento" id="preenchimento"></div>
        </div>
    </div>
    <div class="botoes">
        <button class="botao" id="btnAnterior"><i class="fas fa-step-backward"></i></button>
        <button class="botao botao-play" id="btnPlayPause"><i class="fas fa-play"></i></button>
        <button class="botao" id="btnProximo"><i class="fas fa-step-forward"></i></button>
    </div>
</div>

<!-- LIKE/DISLIKE -->
<div class="likes">
    <button class="like-btn" id="btnLike"><i class="fas fa-thumbs-up"></i></button>
    <button class="dislike-btn" id="btnDislike"><i class="fas fa-thumbs-down"></i></button>
</div>

<!-- BOTÃO GÊNERO -->
<button class="genero-btn" id="btnGenero">
    <i class="fas fa-music"></i>
</button>

<!-- BOTÃO PIX -->
<div class="pix-btn" id="btnPix">
    <i class="fas fa-hand-holding-heart"></i>
    <span>PIX</span>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- LOADING -->
<div class="loading" id="loading">
    <i class="fas fa-circle-notch fa-spin"></i>
    <span>Carregando...</span>
</div>

<!-- MODAL GÊNEROS -->
<div class="modal-generos" id="modalGeneros">
    <h3><i class="fas fa-music"></i> ESCOLHA SEU ESTILO</h3>
    <div class="grid-generos">
        <div class="card-genero" data-genero="SERTANEJO"><i class="fas fa-guitar"></i><span>SERTANEJO</span></div>
        <div class="card-genero" data-genero="FORRÓ"><i class="fas fa-drum"></i><span>FORRÓ</span></div>
        <div class="card-genero" data-genero="POP"><i class="fas fa-microphone-alt"></i><span>POP</span></div>
        <div class="card-genero" data-genero="SAMBA"><i class="fas fa-music"></i><span>SAMBA</span></div>
        <div class="card-genero" data-genero="BREGA"><i class="fas fa-heart"></i><span>BREGA</span></div>
        <div class="card-genero" data-genero="MPB"><i class="fas fa-guitar"></i><span>MPB</span></div>
        <div class="card-genero" data-genero="TODOS"><i class="fas fa-list"></i><span>TODOS</span></div>
        <div class="card-genero" data-genero="LIVE"><i class="fas fa-broadcast-tower"></i><span>🔴 AO VIVO</span></div>
    </div>
    <button class="fechar-modal" id="fecharGeneros">FECHAR</button>
</div>

<!-- FONTS E ICONES -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
    // ==================== PLAYLIST DE TESTE (FUNCIONA IMEDIATAMENTE) ====================
    // Estas músicas são de domínio público e funcionam 100%
    const PLAYLIST_COMPLETA = [
        { id: 1, title: "SoundHelix Song 1", artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", genero: "POP", tipo: "normal" },
        { id: 2, title: "SoundHelix Song 2", artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", genero: "POP", tipo: "normal" },
        { id: 3, title: "SoundHelix Song 3", artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", genero: "POP", tipo: "ao vivo" },
        { id: 4, title: "SoundHelix Song 4", artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", genero: "SERTANEJO", tipo: "normal" },
        { id: 5, title: "SoundHelix Song 5", artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", genero: "FORRÓ", tipo: "normal" },
        { id: 6, title: "SoundHelix Song 6", artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3", genero: "SAMBA", tipo: "normal" },
        { id: 7, title: "SoundHelix Song 7", artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3", genero: "BREGA", tipo: "normal" },
        { id: 8, title: "SoundHelix Song 8", artist: "SoundHelix", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3", genero: "MPB", tipo: "normal" }
    ];

    // ==================== CONFIGURAÇÕES ====================
    let state = {
        tocando: false,
        aoVivo: true,
        generoAtual: "LIVE",
        playlist: [],
        indexAtual: 0,
        historico: [],
        carregando: false,
        aleatorio: false,
        audioAtivo: false,
        preferencias: { likes: [], dislikes: [], generosPref: {} },
        stats: { totalTocadas: 0 }
    };

    // Elementos DOM
    const elementos = {
        btnAtivar: document.getElementById('btnAtivar'),
        status: document.getElementById('status'),
        player: document.getElementById('player'),
        musicaNome: document.getElementById('musicaNome'),
        proximaMusica: document.getElementById('proximaMusica'),
        tempoAtual: document.getElementById('tempoAtual'),
        tempoTotal: document.getElementById('tempoTotal'),
        preenchimento: document.getElementById('preenchimento'),
        barraProgresso: document.getElementById('barraProgresso'),
        btnPlayPause: document.getElementById('btnPlayPause'),
        btnAnterior: document.getElementById('btnAnterior'),
        btnProximo: document.getElementById('btnProximo'),
        btnLike: document.getElementById('btnLike'),
        btnDislike: document.getElementById('btnDislike'),
        btnGenero: document.getElementById('btnGenero'),
        btnPix: document.getElementById('btnPix'),
        modalGeneros: document.getElementById('modalGeneros'),
        fecharGeneros: document.getElementById('fecharGeneros'),
        toast: document.getElementById('toast'),
        loading: document.getElementById('loading'),
        videoBg: document.getElementById('videoBg'),
        audioPlayer: new Audio()
    };

    // ==================== FUNÇÕES ÚTEIS ====================
    function mostrarToast(msg, duracao = 2000) {
        elementos.toast.textContent = msg;
        elementos.toast.classList.add('show');
        setTimeout(() => elementos.toast.classList.remove('show'), duracao);
    }

    function mostrarLoading() { elementos.loading.style.display = 'flex'; }
    function esconderLoading() { elementos.loading.style.display = 'none'; }

    function formatarTempo(seg) {
        if (!seg || isNaN(seg)) return '0:00';
        const m = Math.floor(seg / 60);
        const s = Math.floor(seg % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function embaralhar(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function atualizarPlaylist() {
        if (state.aoVivo) {
            const aoVivo = PLAYLIST_COMPLETA.filter(m => m.tipo === 'ao vivo');
            state.playlist = aoVivo.length ? embaralhar([...aoVivo]) : embaralhar([...PLAYLIST_COMPLETA]);
            state.historico = [];
        } else if (state.generoAtual === 'TODOS') {
            state.playlist = embaralhar([...PLAYLIST_COMPLETA]);
        } else {
            let filtradas = PLAYLIST_COMPLETA.filter(m => m.genero === state.generoAtual);
            state.playlist = filtradas.length ? embaralhar(filtradas) : embaralhar([...PLAYLIST_COMPLETA]);
        }
        state.indexAtual = Math.floor(Math.random() * state.playlist.length);
    }

    function atualizarInfoMusica() {
        const musica = state.playlist[state.indexAtual];
        if (!musica) return;
        elementos.musicaNome.textContent = `${musica.title} - ${musica.artist}`;
        
        let proxIndex = state.indexAtual + 1;
        if (proxIndex >= state.playlist.length) proxIndex = 0;
        const prox = state.playlist[proxIndex];
        elementos.proximaMusica.textContent = prox ? `Próxima: ${prox.title}` : 'Próxima: --';
    }

    function atualizarControles() {
        if (state.tocando) {
            elementos.btnPlayPause.innerHTML = '<i class="fas fa-pause"></i>';
        } else {
            elementos.btnPlayPause.innerHTML = '<i class="fas fa-play"></i>';
        }
    }

    function atualizarBadgeGenero() {
        // Não tem badge visual mas vamos atualizar o estado
        console.log('Gênero:', state.generoAtual);
    }

    // ==================== FUNÇÃO PRINCIPAL DE TOCAR ====================
    async function tocarMusica() {
        if (!state.audioAtivo) {
            mostrarToast('Clique no botão ATIVAR RÁDIO primeiro!');
            return;
        }
        if (state.playlist.length === 0 || state.carregando) return;
        
        state.carregando = true;
        mostrarLoading();
        
        const musica = state.playlist[state.indexAtual];
        if (!musica || !musica.src) {
            esconderLoading();
            state.carregando = false;
            proximaMusica();
            return;
        }
        
        elementos.audioPlayer.pause();
        elementos.audioPlayer.src = musica.src;
        elementos.audioPlayer.load();
        
        const timeoutId = setTimeout(() => {
            esconderLoading();
            state.carregando = false;
            mostrarToast(`Erro: ${musica.title}`);
            proximaMusica();
        }, 8000);
        
        elementos.audioPlayer.oncanplaythrough = async () => {
            clearTimeout(timeoutId);
            esconderLoading();
            state.carregando = false;
            
            try {
                await elementos.audioPlayer.play();
                state.tocando = true;
                atualizarControles();
                atualizarInfoMusica();
                
                // Estatísticas
                state.stats.totalTocadas++;
                localStorage.setItem('radio_stats', JSON.stringify(state.stats));
                
                // Timer de progresso
                const interval = setInterval(() => {
                    if (state.tocando && elementos.audioPlayer.duration) {
                        const percent = (elementos.audioPlayer.currentTime / elementos.audioPlayer.duration) * 100;
                        elementos.preenchimento.style.width = percent + '%';
                        elementos.tempoAtual.textContent = formatarTempo(elementos.audioPlayer.currentTime);
                        elementos.tempoTotal.textContent = formatarTempo(elementos.audioPlayer.duration);
                        
                        if (elementos.audioPlayer.currentTime >= elementos.audioPlayer.duration - 0.5) {
                            clearInterval(interval);
                            proximaMusica();
                        }
                    }
                }, 200);
                
                window.intervaloProgresso = interval;
                
            } catch (err) {
                clearTimeout(timeoutId);
                esconderLoading();
                state.carregando = false;
                console.log('Erro ao tocar:', err);
            }
        };
        
        elementos.audioPlayer.onerror = () => {
            clearTimeout(timeoutId);
            esconderLoading();
            state.carregando = false;
            proximaMusica();
        };
    }
    
    function pausarMusica() {
        elementos.audioPlayer.pause();
        state.tocando = false;
        atualizarControles();
        if (window.intervaloProgresso) clearInterval(window.intervaloProgresso);
    }
    
    function playPause() {
        if (!state.audioAtivo) {
            mostrarToast('Clique em ATIVAR RÁDIO primeiro!');
            return;
        }
        state.tocando ? pausarMusica() : tocarMusica();
    }
    
    function proximaMusica() {
        if (state.carregando) return;
        if (window.intervaloProgresso) clearInterval(window.intervaloProgresso);
        
        if (state.aoVivo) {
            const tocadasIds = state.historico.map(m => m?.id);
            const disponiveis = state.playlist.filter(m => !tocadasIds.includes(m.id));
            if (disponiveis.length === 0) {
                state.historico = [];
                state.indexAtual = Math.floor(Math.random() * state.playlist.length);
            } else {
                const prox = disponiveis[Math.floor(Math.random() * disponiveis.length)];
                state.indexAtual = state.playlist.findIndex(m => m.id === prox.id);
            }
            state.historico.push(state.playlist[state.indexAtual]);
            if (state.historico.length > 10) state.historico.shift();
        } else if (state.aleatorio) {
            let novoIndex;
            do { novoIndex = Math.floor(Math.random() * state.playlist.length); }
            while (novoIndex === state.indexAtual && state.playlist.length > 1);
            state.indexAtual = novoIndex;
        } else {
            state.indexAtual = (state.indexAtual + 1) % state.playlist.length;
        }
        
        atualizarInfoMusica();
        if (state.tocando) tocarMusica();
    }
    
    function musicaAnterior() {
        if (state.carregando) return;
        if (window.intervaloProgresso) clearInterval(window.intervaloProgresso);
        state.indexAtual = (state.indexAtual - 1 + state.playlist.length) % state.playlist.length;
        atualizarInfoMusica();
        if (state.tocando) tocarMusica();
    }
    
    function curtirMusica() {
        const musica = state.playlist[state.indexAtual];
        if (!musica) return;
        if (!state.preferencias.likes.includes(musica.id)) {
            state.preferencias.likes.push(musica.id);
            state.preferencias.dislikes = state.preferencias.dislikes.filter(id => id !== musica.id);
            state.preferencias.generosPref[musica.genero] = (state.preferencias.generosPref[musica.genero] || 0) + 1;
            localStorage.setItem('radio_prefs', JSON.stringify(state.preferencias));
            mostrarToast(`👍 Curtiu!`, 1500);
        } else {
            mostrarToast(`Você já curtiu`, 1500);
        }
    }
    
    function naoCurtirMusica() {
        const musica = state.playlist[state.indexAtual];
        if (!musica) return;
        if (!state.preferencias.dislikes.includes(musica.id)) {
            state.preferencias.dislikes.push(musica.id);
            state.preferencias.likes = state.preferencias.likes.filter(id => id !== musica.id);
            localStorage.setItem('radio_prefs', JSON.stringify(state.preferencias));
            mostrarToast(`👎 Pulando...`, 1500);
            proximaMusica();
        }
    }
    
    function mudarGenero(genero) {
        if (genero === 'LIVE') {
            state.aoVivo = true;
            state.generoAtual = 'LIVE';
        } else {
            state.aoVivo = false;
            state.generoAtual = genero;
        }
        atualizarPlaylist();
        atualizarBadgeGenero();
        atualizarInfoMusica();
        if (state.audioAtivo && state.tocando) tocarMusica();
        mostrarToast(`${genero === 'LIVE' ? '🔴 AO VIVO' : genero} ativado`);
        elementos.modalGeneros.classList.remove('open');
    }
    
    // ==================== ATIVAR ÁUDIO (BOTÃO LARANJA) ====================
    async function ativarAudio() {
        mostrarToast('🔊 Ativando áudio...');
        
        try {
            // Criar contexto de áudio para ativar
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioCtx();
            const ganho = ctx.createGain();
            const osc = ctx.createOscillator();
            
            osc.connect(ganho);
            ganho.connect(ctx.destination);
            ganho.gain.value = 0.001; // Quase mudo
            
            osc.start();
            await ctx.resume();
            osc.stop();
            
            state.audioAtivo = true;
            
            // Atualizar UI
            elementos.btnAtivar.classList.add('ativo');
            elementos.btnAtivar.innerHTML = '<i class="fas fa-check-circle"></i> RÁDIO ATIVA';
            elementos.status.innerHTML = '<i class="fas fa-brain"></i> IA Ativa';
            elementos.status.classList.add('ativo');
            elementos.player.classList.add('visible');
            
            // Inicializar playlist
            atualizarPlaylist();
            atualizarInfoMusica();
            
            // Começar a tocar
            await tocarMusica();
            
            mostrarToast('✅ Rádio ativada com sucesso!');
            
            // Vídeo de fundo
            elementos.videoBg.src = 'https://cdn.pixabay.com/video/2022/03/20/113034-693262485_large.mp4';
            elementos.videoBg.play().catch(e => console.log('Video:', e));
            
        } catch (erro) {
            console.error('Erro:', erro);
            mostrarToast('❌ Clique novamente para ativar o áudio');
            state.audioAtivo = false;
        }
    }
    
    // ==================== CARREGAR DADOS SALVOS ====================
    function carregarDados() {
        const prefsSalvas = localStorage.getItem('radio_prefs');
        if (prefsSalvas) {
            try { state.preferencias = JSON.parse(prefsSalvas); } catch(e) {}
        }
        const statsSalvas = localStorage.getItem('radio_stats');
        if (statsSalvas) {
            try { state.stats = JSON.parse(statsSalvas); } catch(e) {}
        }
    }
    
    // ==================== EVENTOS ====================
    function configurarEventos() {
        elementos.btnAtivar.addEventListener('click', ativarAudio);
        elementos.btnPlayPause.addEventListener('click', playPause);
        elementos.btnProximo.addEventListener('click', proximaMusica);
        elementos.btnAnterior.addEventListener('click', musicaAnterior);
        elementos.btnLike.addEventListener('click', curtirMusica);
        elementos.btnDislike.addEventListener('click', naoCurtirMusica);
        
        elementos.barraProgresso.addEventListener('click', (e) => {
            if (!state.audioAtivo) return;
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (elementos.audioPlayer.duration) {
                elementos.audioPlayer.currentTime = percent * elementos.audioPlayer.duration;
            }
        });
        
        elementos.btnGenero.addEventListener('click', () => {
            elementos.modalGeneros.classList.add('open');
        });
        
        elementos.fecharGeneros.addEventListener('click', () => {
            elementos.modalGeneros.classList.remove('open');
        });
        
        document.querySelectorAll('.card-genero').forEach(card => {
            card.addEventListener('click', () => {
                const genero = card.getAttribute('data-genero');
                mudarGenero(genero);
            });
        });
        
        elementos.btnPix.addEventListener('click', () => {
            navigator.clipboard.writeText('12988461978');
            mostrarToast('✅ Chave Pix copiada: 12988461978');
        });
        
        // Swipe para próxima/anterior
        let toqueInicioX = 0;
        document.addEventListener('touchstart', (e) => {
            toqueInicioX = e.changedTouches[0].screenX;
        });
        document.addEventListener('touchend', (e) => {
            if (!state.audioAtivo) return;
            const diff = e.changedTouches[0].screenX - toqueInicioX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) musicaAnterior();
                else proximaMusica();
                mostrarToast(diff > 0 ? '⏮️ Anterior' : '⏭️ Próxima');
            }
        });
        
        // Esconder player ao tocar
        let timerEsconder;
        function mostrarPlayer() {
            elementos.player.classList.add('visible');
            clearTimeout(timerEsconder);
            timerEsconder = setTimeout(() => {
                if (state.tocando) elementos.player.classList.remove('visible');
            }, 3000);
        }
        document.addEventListener('touchstart', mostrarPlayer);
        document.addEventListener('click', mostrarPlayer);
        mostrarPlayer();
    }
    
    // ==================== INICIAR ====================
    function init() {
        carregarDados();
        configurarEventos();
        elementos.audioPlayer.volume = 0.8;
        console.log('✅ Rádio Patico IA pronta! Clique no botão laranja.');
    }
    
    init();
</script>
</body>
</html>
