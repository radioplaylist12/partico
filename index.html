<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rádio Patico IA • Futurista</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { min-height: 100vh; background-color: #000; overflow: hidden; position: fixed; width: 100%; height: 100%; }
        .app { width: 100%; height: 100vh; background: #000; position: relative; overflow: hidden; }
        .fullscreen-video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1; }
        .fullscreen-video-container video { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .controls-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; }
        .bottom-controls { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,0.2); padding: 12px 20px; z-index: 20; pointer-events: auto; }
        .track-info { text-align: center; margin-bottom: 8px; }
        .track-info p { font-size: 0.85rem; font-weight: 500; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .progress-area { margin-bottom: 8px; }
        .progress-time { display: flex; justify-content: space-between; font-size: 0.7rem; color: #ccc; margin-bottom: 4px; }
        .progress-bar { height: 4px; background: rgba(255,255,255,0.3); cursor: pointer; border-radius: 4px; }
        .progress-fill { height: 100%; background: #e63946; width: 0%; border-radius: 4px; }
        .control-buttons { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .control-btn { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 1.2rem; width: 48px; height: 48px; cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .control-btn:active { transform: scale(0.9); background: #e63946; color: #000; }
        .play-btn { font-size: 1.6rem; width: 58px; height: 58px; background: #e63946; color: #000; border: none; box-shadow: 0 0 15px rgba(230,57,70,0.4); }
        .feedback-buttons { position: fixed; bottom: 140px; left: 20px; display: flex; gap: 12px; z-index: 27; }
        .feedback-btn { width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: all 0.2s ease; }
        .feedback-btn.like { color: #4ade80; }
        .feedback-btn.dislike { color: #ef4444; }
        .genre-badge { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 20px; font-size: 0.7rem; color: white; z-index: 31; pointer-events: none; border-left: 3px solid #e63946; font-weight: bold; }
        .audio-indicator { position: absolute; top: 12px; right: 70px; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 4px 10px; border-radius: 20px; font-size: 0.6rem; color: #4ade80; z-index: 31; pointer-events: none; display: flex; align-items: center; gap: 5px; }
        .visualizer { position: fixed; top: 70px; right: 20px; display: flex; gap: 4px; align-items: center; justify-content: center; z-index: 31; pointer-events: none; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); padding: 8px 12px; border-radius: 30px; }
        .visualizer-bar { width: 4px; height: 20px; background: linear-gradient(135deg, #e63946, #ff6b6b); border-radius: 2px; transition: height 0.05s ease; }
        .loading-spinner { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); backdrop-filter: blur(12px); padding: 15px 25px; border-radius: 50px; z-index: 10001; display: none; align-items: center; gap: 12px; color: white; font-size: 0.9rem; font-weight: bold; border: 1px solid rgba(230,57,70,0.5); pointer-events: none; }
        .loading-spinner.show { display: flex; }
        .genre-button {
            position: fixed;
            bottom: 100px;
            right: 20px;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle at 30% 10%, #1a1a2e, #0a0a1a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            border: 2px solid rgba(0, 255, 255, 0.6);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3), 0 8px 20px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            backdrop-filter: blur(12px);
            animation: cyberPulse 2s infinite alternate;
        }
        .genre-button:active { transform: scale(0.95); background: radial-gradient(circle at 30% 10%, #e63946, #a01030); box-shadow: 0 0 30px #ff00aa; border-color: #ff00aa; }
        .genre-button i { font-size: 2.2rem; color: #00ffff; filter: drop-shadow(0 0 8px cyan); pointer-events: none; }
        @keyframes cyberPulse {
            0% { box-shadow: 0 0 10px rgba(0, 255, 255, 0.4), 0 0 5px rgba(0, 255, 255, 0.2); border-color: rgba(0, 255, 255, 0.5); }
            100% { box-shadow: 0 0 25px rgba(0, 255, 255, 0.8), 0 0 15px rgba(0, 255, 255, 0.4); border-color: #00ffff; }
        }
        .genres-modal { position: fixed; bottom: 0; left: 0; right: 0; background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 30px 30px 0 0; padding: 20px; z-index: 5000; transform: translateY(100%); transition: transform 0.3s; }
        .genres-modal.open { transform: translateY(0); }
        .genres-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .genre-card { border-radius: 14px; padding: 12px 8px; text-align: center; cursor: pointer; transition: transform 0.1s; }
        .genre-card:active { transform: scale(0.96); }
        .genre-card i { font-size: 1.6rem; display: block; margin-bottom: 6px; color: white; text-shadow: 1px 1px 0 rgba(0,0,0,0.3); }
        .genre-card span { font-size: 0.7rem; font-weight: 700; color: white; text-shadow: 1px 1px 0 rgba(0,0,0,0.3); }
        .genre-card[data-genero="SERTANEJO"] { background: linear-gradient(135deg, #d4a373, #b5835a); }
        .genre-card[data-genero="FORRÓ"] { background: linear-gradient(135deg, #f4a261, #e76f51); }
        .genre-card[data-genero="FORRÓ ANTIGO"] { background: linear-gradient(135deg, #e9c46a, #f4a261); }
        .genre-card[data-genero="SAMBA"] { background: linear-gradient(135deg, #2a9d8f, #264653); }
        .genre-card[data-genero="POP"] { background: linear-gradient(135deg, #0077b6, #023e8a); }
        .genre-card[data-genero="BREGA"] { background: linear-gradient(135deg, #e76f51, #f4a261); }
        .genre-card[data-genero="MPB"] { background: linear-gradient(135deg, #9c27b0, #6a1b9a); }
        .genre-card[data-genero="VARIADAS"] { background: linear-gradient(135deg, #00b4d8, #0077b6); }
        .genre-card[data-genero="TODOS"] { background: linear-gradient(135deg, #6c757d, #495057); }
        .genre-card[data-genero="LIVE"] { background: linear-gradient(135deg, #e63946, #9b1d1d); }
        .genre-card[data-genero="MODA TOP"] { background: linear-gradient(135deg, #ff006e, #8338ec); }
        .genre-card[data-genero="AS++"] { background: linear-gradient(135deg, #3a86ff, #9c27b0); }
        .close-genres { width: 100%; padding: 12px; background: #e63946; border: none; border-radius: 25px; color: white; margin-top: 10px; cursor: pointer; }
        #tap-to-start { position: fixed; bottom: 20%; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #ff8c00, #ff6600); color: white; padding: 14px 28px; border-radius: 60px; font-weight: bold; font-size: 1rem; z-index: 10000; cursor: pointer; animation: btnPulse 1.5s infinite; white-space: nowrap; box-shadow: 0 4px 20px rgba(255, 102, 0, 0.5); border: none; }
        @keyframes btnPulse { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.03); } 100% { transform: translateX(-50%) scale(1); } }
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s; }
        #splash.hidden { opacity: 0; pointer-events: none; }
        .splash-content { text-align: center; color: #fff; }
        .splash-content i { font-size: 4.5rem; color: #e63946; margin-bottom: 1rem; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0.6; transform: scale(1); } }
        .notification-top { position: absolute; top: 12px; left: 12px; right: 12px; text-align: center; z-index: 30; pointer-events: none; transition: opacity 0.3s; opacity: 0; }
        .notification-top.show { opacity: 1; }
        .notification-top .message { display: inline-block; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); border-radius: 30px; padding: 8px 20px; font-size: 0.85rem; color: #fff; border-left: 3px solid #e63946; }
    </style>
</head>
<body>
    <div id="splash"><div class="splash-content"><i class="fas fa-play-circle"></i><h1>Rádio Patico IA</h1><p>🎵 A inteligência artificial aprende seu gosto!</p></div></div>
    <div id="tap-to-start"><i class="fas fa-play-circle"></i> 🎵 ATIVAR RÁDIO</div>
    <div class="app">
        <div class="fullscreen-video-container"><video id="mainVideo" autoplay loop muted playsinline><source src="pai.mp4" type="video/mp4"></video></div>
        <div class="controls-overlay">
            <div class="bottom-controls" id="bottomControls">
                <div class="track-info"><p id="trackArtist">🎵 Clique em ATIVAR RÁDIO</p></div>
                <div class="progress-area">
                    <div class="progress-time"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
                    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
                </div>
                <div class="control-buttons">
                    <button class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                    <button class="control-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
                    <button class="control-btn" id="shuffleBtn"><i class="fas fa-random"></i></button>
                    <button class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
                </div>
            </div>
        </div>
    </div>
    <div class="genre-badge" id="genreBadge"><i class="fas fa-broadcast-tower"></i> 🔴 LIVE</div>
    <div class="audio-indicator" id="audioIndicator"><i class="fas fa-circle"></i> Aguardando</div>
    <div class="visualizer" id="visualizer"><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div></div>
    <div class="feedback-buttons"><button class="feedback-btn like" id="likeBtn"><i class="fas fa-thumbs-up"></i></button><button class="feedback-btn dislike" id="dislikeBtn"><i class="fas fa-thumbs-down"></i></button></div>
    <div class="loading-spinner" id="loadingSpinner"><i class="fas fa-circle-notch fa-spin"></i><span>Carregando música...</span></div>
    <button class="genre-button" id="genreButton"><i class="fas fa-music"></i></button>
    <div id="notificationTop" class="notification-top"><div class="message" id="notificationMessage"></div></div>
    
    <div class="genres-modal" id="genresModal">
        <h3 style="color:white; text-align:center; margin-bottom:15px;"><i class="fas fa-music"></i> ESCOLHA SEU ESTILO</h3>
        <div class="genres-grid">
            <div class="genre-card" data-genero="SERTANEJO"><i class="fas fa-guitar"></i><span>SERTANEJO</span></div>
            <div class="genre-card" data-genero="FORRÓ"><i class="fas fa-drum"></i><span>FORRÓ</span></div>
            <div class="genre-card" data-genero="FORRÓ ANTIGO"><i class="fas fa-accordion"></i><span>FORRÓ ANTIGO</span></div>
            <div class="genre-card" data-genero="SAMBA"><i class="fas fa-music"></i><span>SAMBA</span></div>
            <div class="genre-card" data-genero="POP"><i class="fas fa-microphone-alt"></i><span>POP</span></div>
            <div class="genre-card" data-genero="BREGA"><i class="fas fa-heart"></i><span>BREGA</span></div>
            <div class="genre-card" data-genero="MPB"><i class="fas fa-guitar"></i><span>MPB</span></div>
            <div class="genre-card" data-genero="VARIADAS"><i class="fas fa-random"></i><span>VARIADAS</span></div>
            <div class="genre-card" data-genero="MODA TOP"><i class="fas fa-star"></i><span>MODA TOP</span></div>
            <div class="genre-card" data-genero="AS++"><i class="fas fa-crown"></i><span>AS++</span></div>
            <div class="genre-card" data-genero="TODOS"><i class="fas fa-list-ul"></i><span>TODOS</span></div>
            <div class="genre-card" data-genero="LIVE" style="background: linear-gradient(135deg, #e63946, #ff0000);"><i class="fas fa-broadcast-tower"></i><span>🔴 VOLTAR AO VIVO</span></div>
        </div>
        <button class="close-genres" id="closeGenresBtn"><i class="fas fa-times-circle"></i> FECHAR</button>
    </div>
    
    <audio id="musicPlayer" preload="auto" crossorigin="anonymous"></audio>
    <audio id="backgroundAudio" preload="auto" crossorigin="anonymous" style="display: none;"></audio>

    <script>
        // PLAYLIST RESUMIDA PARA TESTE (com os novos gêneros)
        const musicas = [
            { id: 1, title: "Corpo Nu", artist: "Panda", src: "Panda_Corpo_Nu_muzzik.m4a", genero: "SERTANEJO", tipo: "normal" },
            { id: 14, title: "Ficar por Ficar", artist: "Zé Vaqueiro", src: "Zé-Vaqueiro-Ficar-por-Ficar.m4a", genero: "FORRÓ", tipo: "normal" },
            { id: 48, title: "Lance Livre", artist: "Kamisa 10", src: "Kamisa10.m4a", genero: "SAMBA", tipo: "normal" },
            { id: 56, title: "Haven't Met You Yet", artist: "Michael Bublé", src: "Michael_Bubl.m4a", genero: "POP", tipo: "normal" },
            { id: 64, title: "Tarde Demais", artist: "À Vontade", src: "tarde.mp3", genero: "BREGA", tipo: "normal" },
            { id: 100, title: "Palpite", artist: "Vanessa Rangel", src: "palpite.m4a", genero: "MPB", tipo: "normal" },
            { id: 63, title: "Easy", artist: "Commodores", src: "easy.mp3", genero: "VARIADAS", tipo: "normal" },
            // NOVOS GÊNEROS
            { id: 500, title: "Moda Top Exemplo", artist: "Artista Sertanejo", src: "modatop1.m4a", genero: "MODA TOP", tipo: "normal" },
            { id: 503, title: "Forró Antigo Exemplo", artist: "Sanfoneiro X", src: "forroantigo1.m4a", genero: "FORRÓ ANTIGO", tipo: "normal" },
            { id: 506, title: "AS++ Exemplo", artist: "Banda Internacional", src: "aspp1.m4a", genero: "AS++", tipo: "normal" }
        ];

        const VOLUME_PLAYER = 0.9;
        let isAoVivo = true;
        let currentIndex = 0, isPlaying = false;
        let filteredPlaylist = [];
        let isBackgroundActive = false;

        const musicPlayerEl = document.getElementById('musicPlayer');
        const playBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const trackArtist = document.getElementById('trackArtist');
        const splash = document.getElementById('splash');
        const tapToStart = document.getElementById('tap-to-start');
        const genreButton = document.getElementById('genreButton');
        const genresModal = document.getElementById('genresModal');
        const audioIndicator = document.getElementById('audioIndicator');

        musicPlayerEl.volume = VOLUME_PLAYER;

        function openGenresModal() { genresModal.classList.add('open'); }
        function closeGenresModal() { genresModal.classList.remove('open'); }
        document.getElementById('closeGenresBtn').addEventListener('click', closeGenresModal);
        genreButton.addEventListener('click', openGenresModal);

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function showNotification(msg, duration = 3000) {
            const msgEl = document.getElementById('notificationMessage');
            const topDiv = document.getElementById('notificationTop');
            msgEl.innerText = msg;
            topDiv.classList.add('show');
            setTimeout(() => topDiv.classList.remove('show'), duration);
        }

        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function updateGenreBadge(genero) {
            const badge = document.getElementById('genreBadge');
            let icon = "fa-music";
            switch(genero) {
                case "SERTANEJO": icon = "fa-guitar"; break;
                case "FORRÓ": icon = "fa-drum"; break;
                case "FORRÓ ANTIGO": icon = "fa-accordion"; break;
                case "POP": icon = "fa-microphone-alt"; break;
                case "BREGA": icon = "fa-heart"; break;
                case "MPB": icon = "fa-guitar"; break;
                case "MODA TOP": icon = "fa-star"; break;
                case "AS++": icon = "fa-crown"; break;
                default: icon = "fa-music";
            }
            badge.innerHTML = `<i class="fas ${icon}"></i> ${genero}`;
            badge.classList.remove('live');
        }

        function loadTrackUI(index) {
            const track = filteredPlaylist[index];
            if (!track) return;
            trackArtist.textContent = `${track.title} - ${track.artist} [${track.genero}]`;
            currentTimeEl.textContent = '0:00';
            totalTimeEl.textContent = '0:00';
            progressFill.style.width = '0%';
            if (!isAoVivo) updateGenreBadge(track.genero);
        }

        function playMusic() {
            const track = filteredPlaylist[currentIndex];
            if (!track) return;
            musicPlayerEl.src = track.src;
            musicPlayerEl.load();
            musicPlayerEl.play();
            isPlaying = true;
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            trackArtist.textContent = `${track.title} - ${track.artist} [${track.genero}]`;
            if (!isAoVivo) updateGenreBadge(track.genero);
            
            musicPlayerEl.ontimeupdate = () => {
                const percent = (musicPlayerEl.currentTime / musicPlayerEl.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(musicPlayerEl.currentTime);
                totalTimeEl.textContent = formatTime(musicPlayerEl.duration);
            };
            musicPlayerEl.onended = () => { nextTrack(); };
        }

        function pauseMusic() {
            musicPlayerEl.pause();
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
        }

        function togglePlayPause() { isPlaying ? pauseMusic() : playMusic(); }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % filteredPlaylist.length;
            loadTrackUI(currentIndex);
            if (isPlaying) playMusic();
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + filteredPlaylist.length) % filteredPlaylist.length;
            loadTrackUI(currentIndex);
            if (isPlaying) playMusic();
        }

        function filterByGenre(genero) {
            if (isAoVivo) isAoVivo = false;
            let novaPlaylist = [];
            if (genero === "TODOS") {
                novaPlaylist = shuffleArray([...musicas]);
                showNotification("🎵 Tocando todas as músicas!", 2000);
            } else {
                novaPlaylist = musicas.filter(m => m.genero === genero);
                novaPlaylist = shuffleArray(novaPlaylist);
                if (novaPlaylist.length === 0) {
                    novaPlaylist = shuffleArray([...musicas]);
                    showNotification(`⚠️ Nenhuma música em ${genero}. Carregando todas.`, 2000);
                } else {
                    showNotification(`🎵 ${genero} ativado - ${novaPlaylist.length} músicas!`, 2000);
                }
            }
            filteredPlaylist = novaPlaylist;
            currentIndex = 0;
            loadTrackUI(currentIndex);
            if (isPlaying) playMusic();
        }

        document.querySelectorAll('.genre-card').forEach(card => {
            card.addEventListener('click', () => {
                const genero = card.getAttribute('data-genero');
                if (genero === "LIVE") {
                    isAoVivo = true;
                    showNotification("🔴 MODO AO VIVO ATIVADO!", 2000);
                    document.getElementById('genreBadge').innerHTML = '<i class="fas fa-broadcast-tower"></i> 🔴 LIVE';
                    document.getElementById('genreBadge').classList.add('live');
                } else {
                    filterByGenre(genero);
                }
                closeGenresModal();
            });
        });

        playBtn.addEventListener('click', togglePlayPause);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);
        document.getElementById('progressBar').addEventListener('click', (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (musicPlayerEl.duration) musicPlayerEl.currentTime = percent * musicPlayerEl.duration;
        });

        function createSilentAudio() {
            const sampleRate = 44100, duration = 5, numSamples = sampleRate * duration;
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);
            const writeString = (view, offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
            writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + numSamples * 2, true); writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
            view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(view, 36, 'data');
            view.setUint32(40, numSamples * 2, true); let offset = 44;
            for (let i = 0; i < numSamples; i++) { view.setInt16(offset, 0, true); offset += 2; }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        const backgroundAudioEl = document.getElementById('backgroundAudio');
        async function ativarAudioBackground() {
            try {
                const silentUrl = URL.createObjectURL(createSilentAudio());
                backgroundAudioEl.src = silentUrl;
                backgroundAudioEl.loop = true;
                backgroundAudioEl.volume = 0.001;
                await backgroundAudioEl.play();
                isBackgroundActive = true;
                audioIndicator.innerHTML = '<i class="fas fa-brain"></i> IA Ativa';
                audioIndicator.style.color = '#4ade80';
                return true;
            } catch(e) {
                audioIndicator.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Erro';
                audioIndicator.style.color = '#ef4444';
                return false;
            }
        }

        function iniciarComMusicaAleatoria() {
            isAoVivo = true;
            let musicasAoVivo = musicas.filter(m => m.tipo === "ao vivo");
            if (musicasAoVivo.length === 0) musicasAoVivo = shuffleArray([...musicas]);
            filteredPlaylist = musicasAoVivo;
            currentIndex = 0;
            loadTrackUI(currentIndex);
            document.getElementById('genreBadge').innerHTML = '<i class="fas fa-broadcast-tower"></i> 🔴 LIVE';
            document.getElementById('genreBadge').classList.add('live');
        }

        tapToStart.addEventListener('click', async () => {
            const ok = await ativarAudioBackground();
            if (ok) {
                playMusic();
                tapToStart.style.display = 'none';
                splash.classList.add('hidden');
                setTimeout(() => splash.style.display = 'none', 500);
                showNotification('✅ Áudio ativado!', 2000);
            }
        });

        iniciarComMusicaAleatoria();
        tapToStart.style.display = 'block';
        
        // Visualizer simples
        setInterval(() => {
            const bars = document.querySelectorAll('.visualizer-bar');
            if (isPlaying) {
                bars.forEach(bar => bar.style.height = (8 + Math.random() * 32) + 'px');
            } else {
                bars.forEach(bar => bar.style.height = '4px');
            }
        }, 100);
    </script>
</body>
</html>
