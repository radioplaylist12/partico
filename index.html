<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rádio Patico - MPB • POP • AO VIVO • MODA TOP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Seu CSS permanece o mesmo (já estava bom) – omitido para brevidade, mas você pode copiar do último código funcional */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root { --bg-primary: #0a0a0f; --accent: #00f3ff; --secondary: #ff2d7f; }
        body { min-height: 100vh; background: var(--bg-primary); overflow: hidden; position: fixed; width: 100%; height: 100%; font-family: 'Rajdhani', sans-serif; }
        /* ... todo o CSS que você já tem ... */
        /* Para não alongar, mantenha o CSS que estava no último código funcional */
    </style>
    <!-- CSS completo (use o mesmo que você já tinha, não vou repetir para economizar tokens) -->
</head>
<body>
    <!-- HTML idêntico ao que você já tem (splash, tap-to-start, app, etc.) -->
    <div id="splash">...</div>
    <div id="tap-to-start">🎵 ATIVAR RÁDIO</div>
    <div class="app" id="appRoot">...</div>
    <audio id="musicPlayer" preload="auto"></audio>
    <audio id="backgroundAudio" preload="auto" style="display:none;"></audio>

    <script>
        // ==================== CONFIGURAÇÕES ====================
        const CONFIG = {
            VOLUME_PLAYER: 0.9,
            VIDEO_FIXO: 'pak1.mp4',
            VIDEO_MIGUEL: 'miguel.mp4',
            VIDEO_TV: 'tv.mp4',
            SITE_MIGUEL: 'https://oticassaomiguel.com.br/',
            PLAYLIST_URL: 'https://raw.githubusercontent.com/radioplaylist12/partico/main/playlist.json',
            TIMEOUT_CARREGAMENTO_MUSICA: 8000,
            NUMERO_WHATSAPP: '5512988461978'
        };

        let PLAYLIST = []; // Será preenchida via fetch

        // ==================== ESTADO ====================
        const state = {
            isPlaying: false,
            generoAtual: 'AO VIVO',
            currentIndex: 0,
            filteredPlaylist: [],
            isLoadingTrack: false,
            isTvMode: false,
            isMiguelVideoActive: false,
            miguelVideoTimeout: null,
            progressInterval: null,
            controlsTimer: null,
            lastClickTime: 0,
            stats: { totalPlayed: 0, totalSeconds: 0 },
            isBackgroundActive: false,
            backgroundInterval: null,
            wakeLock: null
        };

        // DOM (refs)
        const dom = {
            musicPlayer: document.getElementById('musicPlayer'),
            backgroundAudio: document.getElementById('backgroundAudio'),
            playBtn: document.getElementById('playPauseBtn'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            shuffleBtn: document.getElementById('shuffleBtn'),
            progressFill: document.getElementById('progressFill'),
            currentTimeEl: document.getElementById('currentTime'),
            totalTimeEl: document.getElementById('totalTime'),
            trackMarquee: document.getElementById('trackMarquee'),
            splash: document.getElementById('splash'),
            appRoot: document.getElementById('appRoot'),
            loadingSpinner: document.getElementById('loadingSpinner'),
            genreBadge: document.getElementById('genreBadge'),
            bottomControls: document.getElementById('bottomControls'),
            genreButton: document.getElementById('genreButton'),
            menuButton: document.getElementById('menuButton'),
            menuPopup: document.getElementById('menuPopup'),
            mainVideo: document.getElementById('mainVideo'),
            volumeSlider: document.getElementById('volumeSlider'),
            tapToStart: document.getElementById('tap-to-start'),
            audioIndicator: document.getElementById('audioIndicator')
        };

        // ==================== FUNÇÕES AUXILIARES ====================
        function mostrarNotificacao(msg, dur = 2000) {
            const n = document.getElementById('notificationTop');
            if (n) { n.textContent = msg; n.classList.add('show'); setTimeout(() => n.classList.remove('show'), dur); }
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function salvarStats() { localStorage.setItem('radio_patico_stats', JSON.stringify(state.stats)); }
        function carregarStats() { const s = localStorage.getItem('radio_patico_stats'); if (s) Object.assign(state.stats, JSON.parse(s)); }
        function formatTime(sec) { if (isNaN(sec)) return '0:00'; const m = Math.floor(sec / 60); const s = Math.floor(sec % 60); return `${m}:${s < 10 ? '0' : ''}${s}`; }

        // ========== CARREGAR PLAYLIST DO JSON ==========
        async function carregarPlaylist() {
            try {
                const resp = await fetch(CONFIG.PLAYLIST_URL);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                PLAYLIST = await resp.json();
                console.log(`✅ Playlist carregada: ${PLAYLIST.length} músicas`);
                // Garantir que cada música tenha um id e artista
                PLAYLIST = PLAYLIST.map((m, idx) => {
                    if (!m.id) m.id = idx;
                    if (!m.artist) m.artist = "Desconhecido";
                    return m;
                });
                localStorage.setItem('playlist_cache', JSON.stringify(PLAYLIST));
                localStorage.setItem('playlist_cache_time', Date.now().toString());
            } catch (e) {
                console.error("Erro ao carregar playlist do GitHub", e);
                const cached = localStorage.getItem('playlist_cache');
                if (cached) {
                    PLAYLIST = JSON.parse(cached);
                    console.log("⚠️ Usando cache local");
                } else {
                    // Fallback de emergência (para não ficar sem música)
                    PLAYLIST = [
                        { id: 0, title: "Música de Exemplo", artist: "Artista", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", genero: "POP" }
                    ];
                    mostrarNotificacao("⚠️ Usando playlist de fallback", 3000);
                }
            }
        }

        function filtrarPorGenero(genero) {
            let filtrada = PLAYLIST.filter(m => m.genero === genero);
            if (filtrada.length === 0) filtrada = [...PLAYLIST];
            return shuffleArray(filtrada);
        }

        // ========== ÁUDIO DE FUNDO SILENCIOSO (MANTÉM TELA BLOQUEADA) ==========
        function criarAudioSilencioso() {
            const sampleRate = 44100, duration = 5, numSamples = sampleRate * duration;
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);
            const writeString = (view, offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
            writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + numSamples * 2, true); writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
            view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(view, 36, 'data');
            view.setUint32(40, numSamples * 2, true); let offset = 44;
            for (let i = 0; i < numSamples; i++) { view.setInt16(offset, 0, true); offset += 2; }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function ativarAudioBackground() {
            try {
                const silentUrl = URL.createObjectURL(criarAudioSilencioso());
                dom.backgroundAudio.src = silentUrl;
                dom.backgroundAudio.loop = true;
                dom.backgroundAudio.volume = 0.001;
                await dom.backgroundAudio.play();
                state.isBackgroundActive = true;
                dom.audioIndicator.innerHTML = '<i class="fas fa-brain"></i> Ativo';
                dom.audioIndicator.style.color = '#4ade80';
                iniciarManutencaoConstante();

                if ('wakeLock' in navigator) {
                    try {
                        state.wakeLock = await navigator.wakeLock.request('screen');
                        document.addEventListener('visibilitychange', async () => {
                            if (document.visibilityState === 'visible' && !state.wakeLock) {
                                state.wakeLock = await navigator.wakeLock.request('screen');
                            }
                        });
                    } catch (e) { console.log("WakeLock não suportado"); }
                }
                return true;
            } catch (error) {
                dom.audioIndicator.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Erro';
                return false;
            }
        }

        function iniciarManutencaoConstante() {
            if (state.backgroundInterval) clearInterval(state.backgroundInterval);
            state.backgroundInterval = setInterval(async () => {
                try {
                    if (dom.backgroundAudio.paused && state.isBackgroundActive) await dom.backgroundAudio.play().catch(e => { });
                    if (state.isPlaying && dom.musicPlayer.paused && !dom.musicPlayer.ended) await dom.musicPlayer.play().catch(e => { });
                    const duration = dom.musicPlayer.duration;
                    const current = dom.musicPlayer.currentTime;
                    if (state.isPlaying && duration && !isNaN(duration) && (duration - current) < 0.3 && current > 0) {
                        await nextTrack();
                    }
                } catch (e) { }
            }, 1000);
        }

        // ========== VÍDEO ==========
        function fixarVideo() {
            if (state.isMiguelVideoActive || state.isTvMode) return;
            if (dom.mainVideo && !dom.mainVideo.src.includes(CONFIG.VIDEO_FIXO)) {
                dom.mainVideo.pause();
                dom.mainVideo.src = CONFIG.VIDEO_FIXO;
                dom.mainVideo.load();
                dom.mainVideo.play().catch(e => console.warn);
            }
        }

        function ativarModoTv() { state.isTvMode = true; document.getElementById('tvOverlay').classList.add('active'); document.getElementById('tvVideo').play().catch(e => console.log); mostrarNotificacao("📺 MODO TV", 1000); }
        function desativarModoTv() { state.isTvMode = false; document.getElementById('tvOverlay').classList.remove('active'); document.getElementById('tvVideo').pause(); document.getElementById('tvVideo').currentTime = 0; mostrarNotificacao("🎵 Voltei", 1000); fixarVideo(); }
        function ativarVideoMiguel() { if (state.isMiguelVideoActive || state.isTvMode) return; state.isMiguelVideoActive = true; dom.mainVideo.pause(); dom.mainVideo.src = CONFIG.VIDEO_MIGUEL; dom.mainVideo.load(); dom.mainVideo.play().catch(e => console.warn); state.miguelVideoTimeout = setTimeout(() => desativarVideoMiguel(), 30000); }
        function desativarVideoMiguel() { if (!state.isMiguelVideoActive) return; state.isMiguelVideoActive = false; dom.mainVideo.pause(); dom.mainVideo.src = CONFIG.VIDEO_FIXO; dom.mainVideo.load(); dom.mainVideo.play().catch(e => console.warn); }
        function abrirSiteMiguel() { window.open(CONFIG.SITE_MIGUEL, '_blank'); mostrarNotificacao("🌐 Abrindo site", 1200); }

        // ========== PLAYER ==========
        async function nextTrack() {
            if (state.isLoadingTrack || state.isTvMode) return;
            if (state.progressInterval) clearInterval(state.progressInterval);
            state.currentIndex = (state.currentIndex + 1) % state.filteredPlaylist.length;
            await playCurrent();
        }

        async function prevTrack() {
            if (state.isLoadingTrack || state.isTvMode) return;
            if (state.progressInterval) clearInterval(state.progressInterval);
            state.currentIndex = (state.currentIndex - 1 + state.filteredPlaylist.length) % state.filteredPlaylist.length;
            await playCurrent();
        }

        async function playCurrent() {
            if (state.isLoadingTrack || state.isTvMode) return;
            if (!state.filteredPlaylist.length) {
                state.filteredPlaylist = filtrarPorGenero(state.generoAtual);
                if (!state.filteredPlaylist.length) return;
            }
            const track = state.filteredPlaylist[state.currentIndex];
            if (!track || !track.src) { nextTrack(); return; }

            state.isLoadingTrack = true;
            dom.loadingSpinner.classList.add('show');
            dom.musicPlayer.pause();
            dom.musicPlayer.src = track.src;
            dom.musicPlayer.load();

            dom.trackMarquee.innerHTML = `<span class="marquee-text">🎵 ${track.title} - ${track.artist} [${track.genero}] | RÁDIO PATICO</span>`;
            dom.currentTimeEl.textContent = '0:00';
            dom.totalTimeEl.textContent = '0:00';
            dom.progressFill.style.width = '0%';
            fixarVideo();

            let loaded = false;
            let timeout = setTimeout(() => {
                if (!loaded) { dom.loadingSpinner.classList.remove('show'); state.isLoadingTrack = false; nextTrack(); }
            }, CONFIG.TIMEOUT_CARREGAMENTO_MUSICA);

            dom.musicPlayer.oncanplaythrough = async () => {
                if (loaded) return;
                loaded = true;
                clearTimeout(timeout);
                dom.loadingSpinner.classList.remove('show');
                state.isLoadingTrack = false;
                try {
                    await dom.musicPlayer.play();
                    state.isPlaying = true;
                    dom.playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    startProgressTimer();
                    dom.musicPlayer.onended = () => { nextTrack(); };
                    state.stats.totalPlayed++;
                    salvarStats();
                    const totalPlayedSpan = document.getElementById('statTotalPlayed');
                    if (totalPlayedSpan) totalPlayedSpan.textContent = state.stats.totalPlayed;
                    if (dom.musicPlayer.duration) dom.totalTimeEl.textContent = formatTime(dom.musicPlayer.duration);
                } catch (e) { nextTrack(); }
            };
            dom.musicPlayer.onerror = () => {
                if (!loaded) { loaded = true; clearTimeout(timeout); dom.loadingSpinner.classList.remove('show'); state.isLoadingTrack = false; setTimeout(() => nextTrack(), 500); }
            };
        }

        function startProgressTimer() {
            if (state.progressInterval) clearInterval(state.progressInterval);
            state.progressInterval = setInterval(() => {
                if (state.isPlaying && dom.musicPlayer.duration && !dom.musicPlayer.paused) {
                    const percent = (dom.musicPlayer.currentTime / dom.musicPlayer.duration) * 100;
                    dom.progressFill.style.width = percent + '%';
                    dom.currentTimeEl.textContent = formatTime(dom.musicPlayer.currentTime);
                    dom.totalTimeEl.textContent = formatTime(dom.musicPlayer.duration);
                }
            }, 200);
        }

        function togglePlayPause() {
            if (!state.isBackgroundActive) { mostrarNotificacao('Clique em "ATIVAR RÁDIO" primeiro!', 2000); return; }
            if (state.isPlaying) {
                dom.musicPlayer.pause();
                state.isPlaying = false;
                dom.playBtn.innerHTML = '<i class="fas fa-play"></i>';
            } else {
                playCurrent();
            }
        }

        function mudarGenero(genero) {
            state.generoAtual = genero;
            state.filteredPlaylist = filtrarPorGenero(genero);
            state.currentIndex = 0;
            dom.genreBadge.innerHTML = genero === 'AO VIVO' ? '<i class="fas fa-broadcast-tower"></i> AO VIVO' : `<i class="fas fa-music"></i> ${genero}`;
            mostrarNotificacao(`🎵 Gênero: ${genero}`, 1000);
            if (state.isPlaying && !state.isTvMode) playCurrent();
            else if (state.isBackgroundActive && !state.isPlaying) playCurrent();
        }

        // ========== CONTROLES DE VISIBILIDADE ==========
        function hideControls() {
            if (!state.isTvMode) {
                dom.bottomControls.classList.add('hide-controls');
                dom.genreButton.style.opacity = '0';
                dom.menuButton.style.opacity = '0';
                document.getElementById('volumeControl').style.opacity = '0';
            }
        }
        function showControls() {
            if (!state.isTvMode) {
                dom.bottomControls.classList.remove('hide-controls');
                dom.genreButton.style.opacity = '1';
                dom.menuButton.style.opacity = '1';
                document.getElementById('volumeControl').style.opacity = '1';
                if (state.controlsTimer) clearTimeout(state.controlsTimer);
                state.controlsTimer = setTimeout(() => {
                    if (state.isPlaying && !state.isLoadingTrack && !state.isTvMode) hideControls();
                }, 4000);
            }
        }

        // ========== GESTOS ==========
        let touchStartX = 0, lastTap = 0;
        dom.appRoot.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            const now = Date.now();
            if (now - lastTap < 300) { e.preventDefault(); togglePlayPause(); }
            lastTap = now;
            showControls();
        });
        dom.appRoot.addEventListener('touchend', (e) => {
            const diff = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(diff) > 50) diff > 0 ? prevTrack() : nextTrack();
            showControls();
        });

        // ========== EVENTOS DA INTERFACE ==========
        function setupEventListeners() {
            dom.tapToStart.addEventListener('click', async () => {
                mostrarNotificacao('🔊 Ativando áudio...', 2000);
                const ok = await ativarAudioBackground();
                if (ok) {
                    await playCurrent();
                    dom.tapToStart.style.display = 'none';
                    dom.splash.classList.add('hidden');
                    setTimeout(() => dom.splash.style.display = 'none', 500);
                    dom.appRoot.style.display = 'block';
                    document.documentElement.requestFullscreen().catch(e => { });
                    mostrarNotificacao('✅ Rádio tocando em segundo plano!', 3000);
                } else {
                    mostrarNotificacao('❌ Falha ao ativar áudio.', 3000);
                }
            });

            dom.playBtn.addEventListener('click', togglePlayPause);
            dom.prevBtn.addEventListener('click', prevTrack);
            dom.nextBtn.addEventListener('click', nextTrack);
            dom.shuffleBtn.addEventListener('click', () => {
                if (!state.isTvMode) {
                    state.filteredPlaylist = shuffleArray(state.filteredPlaylist);
                    state.currentIndex = 0;
                    mostrarNotificacao('🔀 Aleatório', 800);
                    if (state.isPlaying) playCurrent();
                }
            });
            document.getElementById('progressBar').addEventListener('click', (e) => {
                if (!state.isTvMode && dom.musicPlayer.duration) {
                    const rect = e.currentTarget.getBoundingClientRect();
                    const percent = (e.clientX - rect.left) / rect.width;
                    dom.musicPlayer.currentTime = percent * dom.musicPlayer.duration;
                }
            });
            dom.genreButton.addEventListener('click', () => document.getElementById('genresModal').classList.add('open'));
            document.querySelectorAll('.genre-card').forEach(card => {
                card.addEventListener('click', () => {
                    mudarGenero(card.getAttribute('data-genero'));
                    document.getElementById('genresModal').classList.remove('open');
                });
            });
            document.getElementById('closeGenresBtn').addEventListener('click', () => document.getElementById('genresModal').classList.remove('open'));
            dom.menuButton.addEventListener('click', (e) => { e.stopPropagation(); dom.menuPopup.classList.toggle('open'); });
            document.addEventListener('click', (e) => { if (!dom.menuButton.contains(e.target) && !dom.menuPopup.contains(e.target)) dom.menuPopup.classList.remove('open'); });
            document.getElementById('tvMenuBtn').addEventListener('click', () => { ativarModoTv(); dom.menuPopup.classList.remove('open'); });
            document.getElementById('fullscreenMenuBtn').addEventListener('click', () => { document.documentElement.requestFullscreen(); dom.menuPopup.classList.remove('open'); });
            document.getElementById('shareMenuBtn').addEventListener('click', () => { if (navigator.share) navigator.share({ title: 'Rádio Patico', url: location.href }); else { navigator.clipboard.writeText(location.href); mostrarNotificacao("Link copiado!", 1000); } dom.menuPopup.classList.remove('open'); });
            document.getElementById('bluetoothMenuBtn').addEventListener('click', () => { if ('bluetooth' in navigator) navigator.bluetooth.requestDevice({ acceptAllDevices: true }).catch(e => { }); mostrarNotificacao("🔵 Bluetooth", 1000); dom.menuPopup.classList.remove('open'); });
            document.getElementById('pixMenuBtn').addEventListener('click', () => { document.getElementById('pixModal').style.display = 'block'; dom.menuPopup.classList.remove('open'); });
            document.getElementById('manualMenuBtn').addEventListener('click', () => { document.getElementById('manualModal').style.display = 'block'; dom.menuPopup.classList.remove('open'); });
            document.getElementById('statsMenuBtn').addEventListener('click', () => { document.getElementById('statTotalPlayed').textContent = state.stats.totalPlayed; const h = Math.floor(state.stats.totalSeconds / 3600); const m = Math.floor((state.stats.totalSeconds % 3600) / 60); document.getElementById('statTotalTime').textContent = `${h}h ${m}m`; document.getElementById('statsModal').style.display = 'block'; dom.menuPopup.classList.remove('open'); });
            document.getElementById('feedbackMenuBtn').addEventListener('click', () => { document.getElementById('feedbackModal').style.display = 'block'; dom.menuPopup.classList.remove('open'); });
            document.getElementById('copyPixBtn').addEventListener('click', () => { navigator.clipboard.writeText('12988461978'); mostrarNotificacao('✅ Pix copiado!', 1000); });
            document.getElementById('closePixBtn').addEventListener('click', () => document.getElementById('pixModal').style.display = 'none');
            document.getElementById('closeStatsBtn').addEventListener('click', () => document.getElementById('statsModal').style.display = 'none');
            document.getElementById('closeManualBtn').addEventListener('click', () => document.getElementById('manualModal').style.display = 'none');
            document.getElementById('tvCloseBtn').addEventListener('click', () => desativarModoTv());
            dom.volumeSlider.addEventListener('input', (e) => { dom.musicPlayer.volume = parseFloat(e.target.value); localStorage.setItem('radio_volume', e.target.value); });
            const savedVol = localStorage.getItem('radio_volume'); if (savedVol) { dom.musicPlayer.volume = parseFloat(savedVol); dom.volumeSlider.value = savedVol; }
            dom.videoContainer.addEventListener('click', () => { if (state.isMiguelVideoActive) abrirSiteMiguel(); else ativarVideoMiguel(); });
            dom.appRoot.addEventListener('click', (e) => {
                if (!state.isTvMode) {
                    if (e.target.closest('.control-btn') || e.target.closest('.genre-button') || e.target.closest('.menu-button')) showControls();
                    else if (dom.bottomControls.classList.contains('hide-controls')) showControls();
                    else hideControls();
                }
            });

            // Feedback
            let currentRating = 0;
            document.querySelectorAll('#ratingStars .star').forEach(star => {
                star.addEventListener('click', () => {
                    currentRating = parseInt(star.dataset.rating);
                    document.querySelectorAll('#ratingStars .star').forEach((s, i) => {
                        if (i < currentRating) { s.classList.add('fas', 'active'); s.classList.remove('far'); }
                        else { s.classList.remove('fas', 'active'); s.classList.add('far'); }
                    });
                });
            });
            document.getElementById('cancelFeedback').addEventListener('click', () => { document.getElementById('feedbackModal').style.display = 'none'; document.getElementById('feedbackText').value = ''; currentRating = 0; });
            document.getElementById('sendFeedback').addEventListener('click', () => {
                if (currentRating === 0) { mostrarNotificacao('⭐ Dê uma nota', 1000); return; }
                let msg = `🎵 *Rádio Patico*\n⭐ Nota: ${'★'.repeat(currentRating)}${'☆'.repeat(5 - currentRating)}\n`;
                const text = document.getElementById('feedbackText').value.trim();
                if (text) msg += `💬 ${text}\n`;
                window.open(`https://wa.me/${CONFIG.NUMERO_WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
                mostrarNotificacao('✅ Obrigado!', 1000);
                document.getElementById('feedbackModal').style.display = 'none';
                document.getElementById('feedbackText').value = '';
                currentRating = 0;
            });
        }

        // ==================== INICIALIZAÇÃO ====================
        async function init() {
            await carregarPlaylist();         // Carrega do JSON
            carregarStats();
            dom.musicPlayer.volume = CONFIG.VOLUME_PLAYER;
            state.filteredPlaylist = filtrarPorGenero('AO VIVO');
            state.currentIndex = 0;
            setupEventListeners();
            // Exibe splash e botão de ativação
            dom.splash.classList.remove('hidden');
            dom.tapToStart.style.display = 'block';
            showControls();
            console.log("🚀 Rádio Patico com JSON e segundo plano ativo!");
        }
        init();
    </script>

    <!-- Elementos que faltavam (TV overlay, modais, etc.) – mantenha os mesmos do seu código original -->
</body>
</html>
