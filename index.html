<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rádio Patico IA - LUIS GOMES RN</title>
    <link rel="icon" type="image/png" href="falcon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="falcon.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root { --bg-primary: #0a0a0f; --accent: #00f3ff; --secondary: #ff2d7f; }
        body { min-height: 100vh; background: var(--bg-primary); overflow: hidden; position: fixed; width: 100%; height: 100%; font-family: 'Rajdhani', sans-serif; }
        
        #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 20% 30%, #0a0a0f, #000000); display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
        #splash::before { content: ""; position: absolute; width: 200%; height: 200%; background-image: linear-gradient(rgba(0, 243, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.1) 1px, transparent 1px); background-size: 40px 40px; animation: gridMove 20s linear infinite; }
        @keyframes gridMove { 0% { transform: translate(0, 0); } 100% { transform: translate(40px, 40px); } }
        .splash-content { text-align: center; z-index: 2; animation: fadeInUp 1s ease-out; }
        .splash-content i { font-size: 6rem; background: linear-gradient(135deg, #00f3ff, #ff2d7f); -webkit-background-clip: text; background-clip: text; color: transparent; animation: pulseGlow 1.8s infinite; margin-bottom: 1rem; }
        .splash-content h1 { font-family: 'Orbitron', monospace; font-size: 2.5rem; letter-spacing: 4px; background: linear-gradient(135deg, #fff, #00f3ff, #ff2d7f); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 8px; animation: glitch 3s infinite; }
        .splash-content p { font-family: 'Rajdhani', sans-serif; font-size: 1rem; letter-spacing: 2px; color: #00f3ff; text-transform: uppercase; font-weight: 500; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0%, 100% { text-shadow: 0 0 0px rgba(0, 243, 255, 0); transform: scale(1); } 50% { text-shadow: 0 0 30px rgba(0, 243, 255, 0.8); transform: scale(1.05); } }
        @keyframes glitch { 0%, 100% { text-shadow: 2px 0 #ff2d7f, -2px 0 #00f3ff; } 25% { text-shadow: -2px 0 #ff2d7f, 2px 0 #00f3ff; } 50% { text-shadow: 2px 2px #ff2d7f, -2px -2px #00f3ff; } 75% { text-shadow: -2px -2px #ff2d7f, 2px 2px #00f3ff; } }
        #splash.hidden { opacity: 0; pointer-events: none; }
        
        .app { width: 100%; height: 100vh; background: var(--bg-primary); position: relative; overflow: hidden; }
        .fullscreen-video-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1; }
        .fullscreen-video-container video { width: 100%; height: 100%; object-fit: cover; }
        
        .info-area { position: fixed; bottom: 230px; left: 0; right: 0; background: rgba(0, 0, 0, 0.7); padding: 10px 16px; z-index: 25; text-align: center; border-top: 1px solid rgba(0, 243, 255, 0.3); border-bottom: 1px solid rgba(0, 243, 255, 0.3); backdrop-filter: blur(10px); }
        .track-info { margin-bottom: 4px; }
        .marquee-wrap { width: 100%; overflow: hidden; white-space: nowrap; }
        .marquee-text { display: inline-block; animation: marquee 30s linear infinite; color: #00f3ff; font-weight: 700; font-size: 1.1rem; letter-spacing: 1px; text-shadow: 0 0 3px rgba(0,243,255,0.5); will-change: transform; }
        .next-track { font-size: 0.7rem; color: rgba(255, 255, 255, 0.8); }
        
        .bottom-controls { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px); border-top: 1px solid rgba(0, 243, 255, 0.3); padding: 10px 20px 20px; z-index: 20; transition: transform 0.3s ease; border-radius: 24px 24px 0 0; }
        .bottom-controls.hide { transform: translateY(100%); opacity: 0; pointer-events: none; }
        .progress-area { margin-bottom: 10px; }
        .progress-time { display: flex; justify-content: space-between; font-size: 0.65rem; color: #aaa; }
        .progress-bar { height: 3px; background: rgba(255, 255, 255, 0.2); border-radius: 3px; cursor: pointer; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00f3ff, #ff2d7f); width: 0%; border-radius: 3px; }
        .control-buttons { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .control-btn { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); border: 1px solid rgba(0, 243, 255, 0.5); color: #00f3ff; font-size: 1.1rem; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .control-btn:active { transform: scale(0.92); background: #00f3ff; color: #000; box-shadow: 0 0 15px #00f3ff; }
        .play-btn { width: 56px; height: 56px; background: linear-gradient(135deg, #00f3ff, #ff2d7f); color: #000; border: none; box-shadow: 0 0 15px rgba(0, 243, 255, 0.6); }
        
        .genre-badge { position: absolute; top: 16px; left: 16px; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(12px); padding: 5px 14px; border-radius: 40px; font-size: 0.7rem; font-weight: bold; color: #00f3ff; z-index: 31; border-left: 3px solid #00f3ff; font-family: 'Orbitron', monospace; letter-spacing: 1px; }
        .genre-badge.live { border-left-color: #ff2d7f; animation: pulseRed 1s infinite; }
        
        .menu-button { position: absolute; top: 16px; right: 16px; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); color: #00f3ff; border: 1px solid #00f3ff; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; z-index: 31; }
        .menu-popup { position: absolute; top: 70px; right: 16px; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(16px); border-radius: 20px; padding: 10px; z-index: 32; display: none; flex-direction: column; gap: 8px; border: 1px solid #00f3ff; }
        .menu-popup.open { display: flex; }
        .menu-popup button { background: rgba(255, 255, 255, 0.05); border: none; color: white; padding: 8px 16px; border-radius: 40px; font-size: 0.8rem; font-weight: 600; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .menu-popup button:active { background: #00f3ff; color: #000; }
        
        .visualizer { position: fixed; top: 80px; right: 20px; display: flex; gap: 4px; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); padding: 5px 10px; border-radius: 30px; z-index: 31; }
        .visualizer-bar { width: 3px; height: 16px; background: #00f3ff; border-radius: 2px; transition: height 0.05s ease; }
        
        .loading-spinner { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); padding: 12px 24px; border-radius: 60px; z-index: 10001; display: none; gap: 12px; color: #00f3ff; font-weight: bold; border: 1px solid #00f3ff; }
        .loading-spinner.show { display: flex; }
        
        .notification-top { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(12px); padding: 6px 18px; border-radius: 50px; color: #00f3ff; font-size: 0.8rem; z-index: 30; opacity: 0; transition: 0.2s; pointer-events: none; white-space: nowrap; border-left: 3px solid #00f3ff; }
        .notification-top.show { opacity: 1; }
        
        .tap-instruction { position: fixed; bottom: 30%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); padding: 8px 16px; border-radius: 30px; color: white; font-size: 0.7rem; z-index: 202; pointer-events: none; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
        .tap-instruction.visible { opacity: 1; }
        
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        @keyframes pulseRed { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        
        #tap-to-start { position: fixed; bottom: 20%; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #00f3ff, #ff2d7f); color: #000; padding: 12px 24px; border-radius: 50px; font-weight: bold; font-family: 'Orbitron', monospace; z-index: 10000; cursor: pointer; display: none; box-shadow: 0 0 20px #00f3ff; white-space: nowrap; border: none; animation: btnPulse 1.5s infinite; }
        @keyframes btnPulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }
        
        .genres-modal { position: fixed; bottom: 0; left: 0; right: 0; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); background: linear-gradient(135deg, #0a0a0f, #001a2a); border-radius: 30px 30px 0 0; padding: 20px 16px 25px; z-index: 5000; border-top: 2px solid #00f3ff; }
        .genres-modal.open { transform: translateY(0); }
        .genres-modal h3 { color: #00f3ff; text-align: center; font-family: 'Orbitron', monospace; margin-bottom: 15px; font-size: 1rem; }
        .genres-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .genre-card { background: rgba(0, 243, 255, 0.15); border-radius: 14px; padding: 8px 2px; text-align: center; cursor: pointer; transition: 0.1s; border: 1px solid rgba(0, 243, 255, 0.4); }
        .genre-card:active { transform: scale(0.96); background: rgba(0, 243, 255, 0.4); }
        .genre-card i { font-size: 1.4rem; color: #00f3ff; display: block; margin-bottom: 4px; }
        .genre-card span { font-size: 0.7rem; font-weight: bold; color: white; }
        .close-genres { background: #00f3ff; border: none; padding: 10px; border-radius: 40px; font-weight: bold; cursor: pointer; width: 100%; color: #000; margin-top: 10px; }
        
        .swipe-indicator { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.8rem; z-index: 10002; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
    </style>
</head>
<body>

<div id="splash">
    <div class="splash-content">
        <i class="fas fa-microchip"></i>
        <h1>RÁDIO PATICO IA</h1>
        <p>⚡ Toca mesmo com a tela travada ⚡</p>
    </div>
</div>

<div id="tap-to-start"><i class="fas fa-play-circle"></i> ATIVAR RÁDIO (toca com tela travada)</div>

<div class="app" id="appRoot">
    <div class="fullscreen-video-container">
        <video id="mainVideo" autoplay loop muted playsinline><source src="pailogo.mp4" type="video/mp4"></video>

    <div class="info-area">

        <button id="shareMenuBtn"><i class="fas fa-share-alt"></i> Compartilhar</button>
    </div>
</div>

<div class="tap-instruction" id="tapInstruction"><i class="fas fa-hand-pointer"></i> Toque na tela para controles</div>

<div class="genres-modal" id="genresModal">
    <h3>🎧 ESTILOS MUSICAIS</h3>
    <div class="genres-grid">
        <div class="genre-card" data-genero="SERTANEJO"><i class="fas fa-guitar"></i><span>SERTANEJO</span></div>
        <div class="genre-card" data-genero="FORRÓ"><i class="fas fa-drum"></i><span>FORRÓ</span></div>
        <div class="genre-card" data-genero="SAMBA"><i class="fas fa-music"></i><span>SAMBA</span></div>
        <div class="genre-card" data-genero="POP"><i class="fas fa-microphone-alt"></i><span>POP</span></div>
        <div class="genre-card" data-genero="VARIADAS"><i class="fas fa-random"></i><span>VARIADAS</span></div>
        <div class="genre-card" data-genero="TODOS"><i class="fas fa-list-ul"></i><span>TODOS</span></div>
        <div class="genre-card" data-genero="LIVE"><i class="fas fa-broadcast-tower"></i><span>🔴 AO VIVO</span></div>
    </div>
    <button class="close-genres" id="closeGenresBtn">FECHAR</button>
</div>

<audio id="musicPlayer" preload="auto" crossorigin></audio>
<audio id="backgroundAudio" preload="auto" crossorigin style="display: none;"></audio>

<script>
    // ==================== PLAYLIST ====================
    const PLAYLIST = [
        { id: 1, title: "Corpo Nu", artist: "Panda", src: "Panda_Corpo_Nu_muzzik.m4a", genero: "SERTANEJO" },
        { id: 2, title: "Infarto", artist: "Diego & Victor Hugo", src: "Diego_Victor_Hugo_Infarto_muzzik.m4a", genero: "SERTANEJO" },
        { id: 3, title: "Esqueci Você", artist: "Bruno & Marrone", src: "Bruno_Marrone_e_Henrique_Diego_Esqueci_Voc__muzzik.m4a", genero: "SERTANEJO" },
        { id: 4, title: "Ficar por Ficar", artist: "Zé Vaqueiro", src: "Zé-Vaqueiro-Ficar-por-Ficar.m4a", genero: "FORRÓ" },
        { id: 5, title: "Coração Partido", artist: "Luan Estilizado", src: "16 - Coracao Partido - Luan Estilizado.mp3", genero: "FORRÓ" },
        { id: 6, title: "Porsche Azul", artist: "Claudio & Ney", src: "Claudio_Ney_e_Juliana_Porsche_Azul_.m4a", genero: "FORRÓ" },
        { id: 7, title: "Lance Livre", artist: "Kamisa 10", src: "Kamisa 10 - Lance Livre _ NA VIBE DO K10(MP3_160K).mp3", genero: "SAMBA" },
        { id: 8, title: "Foi Bom Mas Foi Ontem", artist: "Grupo Menos é Mais", src: "Grupo Menos é Mais e João Gomes - Foi Bom_ Mas Foi Ontem (Clipe Oficial)(MP3_160K).mp3", genero: "SAMBA" },
        { id: 9, title: "Haven't Met You Yet", artist: "Michael Bublé", src: "Michael_Bubl_Haven_t_Met_You_Yet.m4a", genero: "POP" },
        { id: 10, title: "Billie Jean", artist: "Michael Jackson", src: "Michael_Jackson_Billie_Jean.m4a", genero: "POP" }
    ];
    
    // ==================== CONFIGURAÇÕES ====================
    const VIDEO_POR_GENERO = {
        SERTANEJO: 'sertanejo181.mp4', FORRÓ: 'forro181.mp4', SAMBA: 'samba181.mp4',
        POP: 'pop181.mp4', VARIADAS: 'variadas.mp4', LIVE: 'pailog.mp4', DEFAULT: 'pailogo.mp4'
    };
    
    // ==================== ELEMENTOS ====================
    const musicPlayer = document.getElementById('musicPlayer');
    const playBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const trackMarquee = document.getElementById('trackMarquee');
    const nextTrackInfo = document.getElementById('nextTrackInfo');
    const splash = document.getElementById('splash');
    const tapToStart = document.getElementById('tap-to-start');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const genreBadge = document.getElementById('genreBadge');
    const bottomControls = document.getElementById('bottomControls');
    const visualizerBars = document.querySelectorAll('.visualizer-bar');
    const menuButton = document.getElementById('menuButton');
    const menuPopup = document.getElementById('menuPopup');
    const mainVideo = document.getElementById('mainVideo');
    const genresModal = document.getElementById('genresModal');
    const notificationTop = document.getElementById('notificationTop');
    const tapInstruction = document.getElementById('tapInstruction');
    const swipeIndicator = document.getElementById('swipeIndicator');
    
    // ==================== ÁUDIO FANTASMA (SEGREDO DO CAZÉ) ====================
    const audioFantasma = new Audio();
    let fantasmaAtivo = false;
    let audioAtivo = false;
    
    function criarAudioSilencioso() {
        const sampleRate = 44100;
        const duracao = 5;
        const numAmostras = sampleRate * duracao;
        const buffer = new ArrayBuffer(44 + numAmostras * 2);
        const view = new DataView(buffer);
        
        const escreverString = (view, offset, str) => {
            for (let i = 0; i < str.length; i++) {
                view.setUint8(offset + i, str.charCodeAt(i));
            }
        };
        
        escreverString(view, 0, 'RIFF');
        view.setUint32(4, 36 + numAmostras * 2, true);
        escreverString(view, 8, 'WAVE');
        escreverString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        escreverString(view, 36, 'data');
        view.setUint32(40, numAmostras * 2, true);
        
        let offset = 44;
        for (let i = 0; i < numAmostras; i++) {
            view.setInt16(offset, 0, true);
            offset += 2;
        }
        
        return new Blob([buffer], { type: 'audio/wav' });
    }
    
    async function ativarAudioFantasma() {
        try {
            const urlSilenciosa = URL.createObjectURL(criarAudioSilencioso());
            audioFantasma.src = urlSilenciosa;
            audioFantasma.loop = true;
            audioFantasma.volume = 0.001;
            await audioFantasma.play();
            fantasmaAtivo = true;
            console.log("✅ Áudio fantasma ativado!");
            return true;
        } catch (error) {
            console.log("Erro:", error);
            return false;
        }
    }
    
    // ==================== ESTADO ====================
    let isPlaying = false;
    let isLoading = false;
    let currentIndex = 0;
    let filteredPlaylist = [...PLAYLIST];
    let isAoVivo = true;
    let currentGenre = "SERTANEJO";
    let progressInterval = null;
    let visualizerInterval = null;
    let hideControlsTimer = null;
    
    // ==================== MANUTENÇÃO CONSTANTE (CORREÇÃO TELA TRAVADA) ====================
    let manutencaoInterval = null;
    
    function iniciarManutencao() {
        if (manutencaoInterval) clearInterval(manutencaoInterval);
        
        manutencaoInterval = setInterval(() => {
            try {
                // Mantém áudio fantasma vivo
                if (fantasmaAtivo && audioFantasma.paused) {
                    audioFantasma.play().catch(e => {});
                }
                
                // Se a música deveria estar tocando mas foi pausada pelo sistema
                if (isPlaying && musicPlayer.paused && !musicPlayer.ended && !isLoading) {
                    console.log("🔊 Retomando música...");
                    musicPlayer.play().catch(e => {});
                }
                
                // Se a música terminou
                if (isPlaying && musicPlayer.ended && !isLoading) {
                    console.log("⏭️ Próxima música...");
                    nextTrack();
                }
            } catch(e) {}
        }, 2000);
    }
    
    // ==================== RECUPERA QUANDO TELA VOLTA ====================
    document.addEventListener('visibilitychange', () => {
        if (!document.hidden && isPlaying && musicPlayer.paused && !musicPlayer.ended && !isLoading) {
            musicPlayer.play().catch(e => {});
        }
    });
    
    // ==================== FUNÇÕES UTILITÁRIAS ====================
    function formatTime(sec) {
        if (isNaN(sec) || !isFinite(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
    
    function mostrarNotificacao(msg, tempo = 2500) {
        const n = notificationTop;
        n.textContent = msg;
        n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), tempo);
    }
    
    function showSwipeIndicator(text) {
        swipeIndicator.textContent = text;
        swipeIndicator.style.opacity = '1';
        setTimeout(() => { swipeIndicator.style.opacity = '0'; }, 1000);
    }
    
    function hideControls() {
        bottomControls.classList.add('hide');
        tapInstruction.classList.remove('visible');
    }
    
    function showControls() {
        bottomControls.classList.remove('hide');
        tapInstruction.classList.add('visible');
        if (hideControlsTimer) clearTimeout(hideControlsTimer);
        hideControlsTimer = setTimeout(() => {
            if (isPlaying && !isLoading) hideControls();
        }, 3000);
    }
    
    function updateMarquee(track) {
        const genero = isAoVivo ? '🔴 AO VIVO' : track.genero;
        const msg = `🎵 ${track.title} - ${track.artist} [${genero}] | RÁDIO PATICO IA | Toca com tela travada 🔒`;
        trackMarquee.innerHTML = `<span class="marquee-text">${msg}</span>`;
        
        let nextIdx = currentIndex + 1;
        if (nextIdx >= filteredPlaylist.length) nextIdx = 0;
        const next = filteredPlaylist[nextIdx];
        nextTrackInfo.innerHTML = next ? `Próxima: ${next.title} - ${next.artist}` : 'Próxima: --';
    }
    
    function updateGenreBadge(genero) {
        if (isAoVivo) {
            genreBadge.innerHTML = '<i class="fas fa-broadcast-tower"></i> LIVE';
            genreBadge.classList.add('live');
        } else {
            genreBadge.innerHTML = `<i class="fas fa-music"></i> ${genero}`;
            genreBadge.classList.remove('live');
        }
    }
    
    function atualizarVideo(genero) {
        let file = VIDEO_POR_GENERO[genero] || VIDEO_POR_GENERO.DEFAULT;
        if (isAoVivo) file = VIDEO_POR_GENERO.LIVE;
        if (mainVideo.src.endsWith(file)) return;
        mainVideo.pause();
        mainVideo.src = file;
        mainVideo.load();
        mainVideo.play().catch(e => console.log);
    }
    
    function iniciarProgresso() {
        if (progressInterval) clearInterval(progressInterval);
        progressInterval = setInterval(() => {
            if (isPlaying && musicPlayer.duration && !musicPlayer.paused) {
                const percent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(musicPlayer.currentTime);
                totalTimeEl.textContent = formatTime(musicPlayer.duration);
            }
        }, 200);
    }
    
    function pararProgresso() {
        if (progressInterval) clearInterval(progressInterval);
        progressInterval = null;
    }
    
    function iniciarVisualizer() {
        if (visualizerInterval) clearInterval(visualizerInterval);
        visualizerInterval = setInterval(() => {
            if (isPlaying && !musicPlayer.paused) {
                visualizerBars.forEach(bar => {
                    const h = 5 + Math.random() * 25;
                    bar.style.height = h + 'px';
                });
            } else {
                visualizerBars.forEach(bar => bar.style.height = '4px');
            }
        }, 100);
    }
    
    function pararVisualizer() {
        if (visualizerInterval) clearInterval(visualizerInterval);
        visualizerInterval = null;
        visualizerBars.forEach(bar => bar.style.height = '4px');
    }
    
    // ==================== PLAYER ====================
    async function playMusic() {
        if (!audioAtivo) {
            mostrarNotificacao("⚠️ Clique em ATIVAR RÁDIO primeiro!", 2000);
            return false;
        }
        if (isLoading) return false;
        if (filteredPlaylist.length === 0) return false;
        
        isLoading = true;
        loadingSpinner.classList.add('show');
        
        const track = filteredPlaylist[currentIndex];
        if (!track || !track.src) {
            isLoading = false;
            loadingSpinner.classList.remove('show');
            return false;
        }
        
        musicPlayer.src = track.src;
        musicPlayer.volume = 0.9;
        musicPlayer.load();
        
        updateMarquee(track);
        if (!isAoVivo) updateGenreBadge(track.genero);
        atualizarVideo(isAoVivo ? 'LIVE' : track.genero);
        
        return new Promise((resolve) => {
            const timeout = setTimeout(() => {
                loadingSpinner.classList.remove('show');
                isLoading = false;
                mostrarNotificacao(`⚠️ Timeout: ${track.title}`, 2000);
                nextTrack();
                resolve(false);
            }, 8000);
            
            musicPlayer.oncanplaythrough = async () => {
                clearTimeout(timeout);
                try {
                    await musicPlayer.play();
                    isPlaying = true;
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    iniciarProgresso();
                    iniciarVisualizer();
                    loadingSpinner.classList.remove('show');
                    isLoading = false;
                    resolve(true);
                } catch(e) {
                    clearTimeout(timeout);
                    loadingSpinner.classList.remove('show');
                    isLoading = false;
                    isPlaying = false;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    resolve(false);
                }
            };
            
            musicPlayer.onerror = () => {
                clearTimeout(timeout);
                loadingSpinner.classList.remove('show');
                isLoading = false;
                mostrarNotificacao(`⚠️ Erro: ${track.title}`, 2000);
                setTimeout(() => nextTrack(), 500);
                resolve(false);
            };
            
            musicPlayer.onended = () => {
                if (!isLoading) {
                    nextTrack();
                }
            };
        });
    }
    
    function pauseMusic() {
        musicPlayer.pause();
        isPlaying = false;
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
        pararProgresso();
        pararVisualizer();
    }
    
    function togglePlayPause() {
        if (!audioAtivo) {
            mostrarNotificacao("⚠️ Clique em ATIVAR RÁDIO primeiro!", 2000);
            return;
        }
        if (isPlaying) {
            pauseMusic();
        } else {
            playMusic();
        }
    }
    
    function nextTrack() {
        if (isLoading) return;
        pararProgresso();
        
        if (isAoVivo) {
            currentIndex = (currentIndex + 1) % filteredPlaylist.length;
        } else {
            currentIndex = (currentIndex + 1) % filteredPlaylist.length;
            if (currentIndex === 0 && filteredPlaylist.length > 0) {
                filteredPlaylist = shuffleArray([...PLAYLIST.filter(m => m.genero === currentGenre)]);
                if (filteredPlaylist.length === 0) filteredPlaylist = [...PLAYLIST];
            }
        }
        
        updateMarquee(filteredPlaylist[currentIndex]);
        if (isPlaying) playMusic();
    }
    
    function prevTrack() {
        if (isLoading) return;
        pararProgresso();
        currentIndex = (currentIndex - 1 + filteredPlaylist.length) % filteredPlaylist.length;
        updateMarquee(filteredPlaylist[currentIndex]);
        if (isPlaying) playMusic();
    }
    
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }
    
    function filterByGenre(genero) {
        if (genero === 'LIVE') {
            isAoVivo = true;
            filteredPlaylist = shuffleArray([...PLAYLIST]);
            currentIndex = 0;
            updateGenreBadge('LIVE');
            atualizarVideo('LIVE');
            mostrarNotificacao("🔴 Modo AO VIVO ativado!", 2000);
        } else {
            isAoVivo = false;
            currentGenre = genero;
            filteredPlaylist = PLAYLIST.filter(m => m.genero === genero);
            if (filteredPlaylist.length === 0) {
                filteredPlaylist = [...PLAYLIST];
                mostrarNotificacao(`⚠️ Nenhuma música para ${genero}`, 2000);
            }
            currentIndex = 0;
            updateGenreBadge(genero);
            atualizarVideo(genero);
            mostrarNotificacao(`🎵 ${genero} ativado`, 1500);
        }
        updateMarquee(filteredPlaylist[currentIndex]);
        if (isPlaying) playMusic();
    }
    
    // ==================== GESTOS TOUCH ====================
    let touchStartX = 0;
    let lastTap = 0;
    
    document.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTap;
        if (tapLength < 300 && tapLength > 0) {
            e.preventDefault();
            togglePlayPause();
            showSwipeIndicator(isPlaying ? '⏸️ Pausado' : '▶️ Play');
            showControls();
        }
        lastTap = currentTime;
        showControls();
    });
    
    document.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) {
                prevTrack();
                showSwipeIndicator('⏮️ Anterior');
            } else {
                nextTrack();
                showSwipeIndicator('⏭️ Próxima');
            }
            showControls();
        }
    });
    
    document.addEventListener('click', () => {
        showControls();
    });
    
    // ==================== EVENTOS ====================
    playBtn.addEventListener('click', togglePlayPause);
    prevBtn.addEventListener('click', () => { prevTrack(); showControls(); });
    nextBtn.addEventListener('click', () => { nextTrack(); showControls(); });
    
    document.getElementById('progressBar').addEventListener('click', (e) => {
        if (musicPlayer.duration) {
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            musicPlayer.currentTime = percent * musicPlayer.duration;
        }
        showControls();
    });
    
    menuButton.addEventListener('click', (e) => {
        e.stopPropagation();
        menuPopup.classList.toggle('open');
    });
    
    document.addEventListener('click', (e) => {
        if (!menuButton.contains(e.target) && !menuPopup.contains(e.target)) {
            menuPopup.classList.remove('open');
        }
    });
    
    document.getElementById('fullscreenMenuBtn').addEventListener('click', () => {
        document.documentElement.requestFullscreen();
        menuPopup.classList.remove('open');
    });
    
    document.getElementById('shareMenuBtn').addEventListener('click', () => {
        if (navigator.share) {
            navigator.share({ title: 'Rádio Patico IA', text: '🎵 Rádio que toca com tela travada!', url: location.href });
        } else {
            navigator.clipboard.writeText(location.href);
            mostrarNotificacao('Link copiado!', 1500);
        }
        menuPopup.classList.remove('open');
    });
    
    document.querySelectorAll('.genre-card').forEach(card => {
        card.addEventListener('click', () => {
            const genero = card.getAttribute('data-genero');
            filterByGenre(genero);
            genresModal.classList.remove('open');
        });
    });
    
    document.getElementById('closeGenresBtn').addEventListener('click', () => {
        genresModal.classList.remove('open');
    });
    
    document.getElementById('genreBadge').addEventListener('click', () => {
        genresModal.classList.add('open');
    });
    
    // ==================== ATIVAR ÁUDIO (BOTÃO PRINCIPAL) ====================
    tapToStart.addEventListener('click', async () => {
        mostrarNotificacao("🔊 Ativando áudio para tocar com tela travada...", 2000);
        
        const fantasmaOk = await ativarAudioFantasma();
        
        if (fantasmaOk) {
            audioAtivo = true;
            iniciarManutencao();
            
            if ('wakeLock' in navigator) {
                try {
                    await navigator.wakeLock.request('screen');
                } catch(e) {}
            }
            
            splash.classList.add('hidden');
            setTimeout(() => { splash.style.display = 'none'; }, 500);
            tapToStart.style.display = 'none';
            
            isAoVivo = true;
            filteredPlaylist = shuffleArray([...PLAYLIST]);
            currentIndex = 0;
            updateMarquee(filteredPlaylist[currentIndex]);
            updateGenreBadge('LIVE');
            atualizarVideo('LIVE');
            
            await playMusic();
            
            mostrarNotificacao("✅ Rádio ativada! A música continua mesmo com a tela travada! 🔒", 4000);
        } else {
            mostrarNotificacao("❌ Falha ao ativar áudio. Tente novamente.", 3000);
        }
    });
    
    // ==================== INICIALIZAÇÃO ====================
    musicPlayer.volume = 0.9;
    tapToStart.style.display = 'block';
    showControls();
    
    console.log("🎵 Rádio Patico IA - Toca com tela travada!");
    console.log("Clique no botão ATIVAR RÁDIO");
</script>
</body>
</html>
