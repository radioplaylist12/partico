<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rádio Patico • Playlist IA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background-color: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        .app {
            width: 100%;
            height: 100vh;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .fullscreen-video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1;
        }

        .fullscreen-video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .controls-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none;
        }

        .genre-button {
            position: fixed;
            bottom: 140px;
            right: 20px;
            background: linear-gradient(135deg, #8E2DE2, #4A00E0);
            color: white;
            border: none;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            z-index: 26;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .genre-button:active {
            transform: scale(0.95);
        }

        .genres-modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 30px 30px 0 0;
            padding: 25px 20px 30px;
            z-index: 2000;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            max-height: 85vh;
            overflow-y: auto;
        }

        .genres-modal.open {
            transform: translateY(0);
        }

        .genres-modal h3 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #00f3ff, #ff2d7f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .genres-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .genre-card {
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .genre-card:active {
            transform: scale(0.96);
            background: rgba(0, 243, 255, 0.2);
            border-color: #00f3ff;
        }

        .genre-card i {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
            color: #00f3ff;
        }

        .genre-card span {
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
        }

        .close-genres {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00f3ff, #ff2d7f);
            border: none;
            border-radius: 30px;
            color: #000;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }

        .genre-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #00f3ff;
            z-index: 31;
            border-left: 3px solid #00f3ff;
            font-weight: bold;
            pointer-events: none;
        }

        .audio-indicator {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            color: #4ade80;
            z-index: 31;
            display: flex;
            align-items: center;
            gap: 5px;
            pointer-events: none;
        }

        .bottom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255,255,255,0.15);
            padding: 12px 20px 25px;
            z-index: 20;
            pointer-events: auto;
        }

        .track-info {
            text-align: center;
            margin-bottom: 8px;
            color: #fff;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .progress-area {
            margin-bottom: 8px;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #aaa;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.25);
            cursor: pointer;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00f3ff, #ff2d7f);
            width: 0%;
            border-radius: 4px;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-top: 5px;
        }

        .control-btn {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            font-size: 1.2rem;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .control-btn:active {
            transform: scale(0.92);
            background: #00f3ff;
            color: #000;
        }

        .play-btn {
            font-size: 1.6rem;
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #00f3ff, #ff2d7f);
            color: #000;
            border: none;
        }

        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
            flex-direction: column;
        }

        #splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-content {
            text-align: center;
            color: #fff;
        }

        .splash-content i {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #00f3ff, #ff2d7f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
            animation: pulse 1.5s infinite;
        }

        .splash-content h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
        }

        .loading-text {
            font-size: 0.8rem;
            margin-top: 15px;
            color: #888;
        }

        @keyframes pulse {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 0.6; transform: scale(1); }
        }

        #tap-to-start {
            position: fixed;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #00f3ff, #ff2d7f);
            color: #000;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1rem;
            z-index: 10000;
            cursor: pointer;
            display: none;
            animation: btnPulse 1.5s infinite;
            white-space: nowrap;
            border: none;
        }

        @keyframes btnPulse {
            0% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.03); }
            100% { transform: translateX(-50%) scale(1); }
        }

        .notification-top {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 8px 20px;
            font-size: 0.8rem;
            color: #00f3ff;
            z-index: 30;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
            border-left: 3px solid #00f3ff;
        }

        .notification-top.show {
            opacity: 1;
        }

        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 10001;
            display: none;
            align-items: center;
            gap: 12px;
            color: white;
            border: 1px solid #00f3ff;
        }

        .loading-spinner.show {
            display: flex;
        }
    </style>
</head>
<body>
    <div id="splash">
        <div class="splash-content">
            <i class="fas fa-broadcast-tower"></i>
            <h1>RÁDIO PATICO</h1>
            <div class="loading-text"><i class="fas fa-circle-notch fa-spin"></i> Carregando playlist IA...</div>
        </div>
    </div>

    <div class="app" id="appContainer" style="display: none;">
        <div class="fullscreen-video-container">
            <video id="mainVideo" autoplay loop muted playsinline>
                <source src="pak1.mp4" type="video/mp4">
            </video>
        </div>

        <div class="genre-badge" id="genreBadge"><i class="fas fa-music"></i> CARREGANDO</div>
        <div class="audio-indicator" id="audioIndicator"><i class="fas fa-circle"></i> Aguardando</div>

        <button class="genre-button" id="genreButton"><i class="fas fa-guitar"></i></button>

        <div class="controls-overlay">
            <div class="bottom-controls" id="bottomControls">
                <div class="track-info"><p id="trackArtist">🎵 Rádio Patico</p></div>
                <div class="progress-area">
                    <div class="progress-time"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
                    <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
                </div>
                <div class="control-buttons">
                    <button class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                    <button class="control-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
                    <button class="control-btn" id="shuffleBtn"><i class="fas fa-random"></i></button>
                    <button class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div class="genres-modal" id="genresModal">
        <h3><i class="fas fa-head-side-brain"></i> ESCOLHA SEU ESTILO</h3>
        <div class="genres-grid" id="genresGrid"></div>
        <button class="close-genres" id="closeGenresBtn"><i class="fas fa-check-circle"></i> FECHAR</button>
    </div>

    <div class="notification-top" id="notificationTop"><span id="notificationMsg"></span></div>
    <div class="loading-spinner" id="loadingSpinner"><i class="fas fa-circle-notch fa-spin"></i><span>Carregando música...</span></div>
    <div id="tap-to-start"><i class="fas fa-play-circle"></i> ▶ ATIVAR RÁDIO</div>

    <audio id="musicPlayer" preload="auto"></audio>
    <audio id="backgroundAudio" preload="auto" style="display: none;"></audio>

    <script>
        // CORREÇÃO: URL CORRETA do seu JSON
        const PLAYLIST_JSON_URL = "https://raw.githubusercontent.com/radioplaylist12/partico/refs/heads/main/listroger.json";
        
        // GÊNEROS DISPONÍVEIS (todos que existem no seu JSON)
        const GENEROS = [
            "SERTANEJO", "FORRÓ", "FORRÓ ANTIGO", "SAMBA", "POP", 
            "MPB", "BREGA", "MODA TOP", "PAGODE", "TODOS"
        ];

        const GENERO_STYLES = {
            "SERTANEJO": { icon: "fa-guitar", color: "linear-gradient(135deg,#f2994a,#f2c94c)" },
            "FORRÓ": { icon: "fa-drum", color: "linear-gradient(135deg,#2193b0,#6dd5ed)" },
            "FORRÓ ANTIGO": { icon: "fa-accordion", color: "linear-gradient(135deg,#134e5e,#71b280)" },
            "SAMBA": { icon: "fa-drumstick-bite", color: "linear-gradient(135deg,#f12711,#f5af19)" },
            "POP": { icon: "fa-microphone-alt", color: "linear-gradient(135deg,#8E2DE2,#4A00E0)" },
            "MPB": { icon: "fa-guitar", color: "linear-gradient(135deg,#cc2b5e,#753a88)" },
            "BREGA": { icon: "fa-heart", color: "linear-gradient(135deg,#e63946,#ff6b6b)" },
            "MODA TOP": { icon: "fa-hat-cowboy", color: "linear-gradient(135deg,#00b4db,#0083b0)" },
            "PAGODE": { icon: "fa-drumstick-bite", color: "linear-gradient(135deg,#f12711,#f5af19)" },
            "TODOS": { icon: "fa-list-ul", color: "linear-gradient(135deg,#00b4db,#0083b0)" }
        };

        let musicas = [];
        let filteredPlaylist = [];
        let currentIndex = 0;
        let isPlaying = false;
        let shuffleMode = false;
        let isBackgroundActive = false;
        let currentGenre = "MPB";
        let timerInterval = null;
        let retryCount = 0;
        let generoCycle = ["MPB", "POP"];
        let cycleIndex = 0;

        const musicPlayer = document.getElementById('musicPlayer');
        const playBtn = document.getElementById('playPauseBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const trackArtist = document.getElementById('trackArtist');
        const genreBadge = document.getElementById('genreBadge');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const splash = document.getElementById('splash');
        const tapToStart = document.getElementById('tap-to-start');
        const appContainer = document.getElementById('appContainer');
        const genresModal = document.getElementById('genresModal');
        const genresGrid = document.getElementById('genresGrid');

        musicPlayer.volume = 0.9;

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function showNotification(msg, duration = 2500) {
            const noti = document.getElementById('notificationTop');
            const msgSpan = document.getElementById('notificationMsg');
            msgSpan.innerText = msg;
            noti.classList.add('show');
            setTimeout(() => noti.classList.remove('show'), duration);
        }

        function updateGenreBadge() {
            const style = GENERO_STYLES[currentGenre] || GENERO_STYLES["TODOS"];
            genreBadge.innerHTML = `<i class="fas ${style.icon}"></i> ${currentGenre}`;
        }

        function buildGenresGrid() {
            genresGrid.innerHTML = '';
            GENEROS.forEach(genero => {
                const style = GENERO_STYLES[genero] || GENERO_STYLES["TODOS"];
                const card = document.createElement('div');
                card.className = 'genre-card';
                card.style.background = style.color;
                card.innerHTML = `<i class="fas ${style.icon}"></i><span>${genero}</span>`;
                card.onclick = () => {
                    currentGenre = genero;
                    filterByGenre();
                    genresModal.classList.remove('open');
                };
                genresGrid.appendChild(card);
            });
        }

        function filterByGenre() {
            if (!musicas.length) return;

            let filtered = [];
            if (currentGenre === "TODOS") {
                filtered = [...musicas];
                showNotification(`🎵 TODOS os gêneros - ${filtered.length} músicas`, 2500);
            } else {
                filtered = musicas.filter(m => m.genero === currentGenre);
                if (filtered.length === 0) {
                    showNotification(`⚠️ Nenhuma música para ${currentGenre}`, 1500);
                    return;
                }
                showNotification(`🎵 ${currentGenre} - ${filtered.length} músicas`, 2500);
            }
            
            filteredPlaylist = filtered;
            
            if (shuffleMode) {
                filteredPlaylist = shuffleArray([...filteredPlaylist]);
            }

            updateGenreBadge();
            currentIndex = 0;
            loadTrackUI(0);
            if (isPlaying) playMusic();
        }

        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function setInitialGenre() {
            const selected = generoCycle[cycleIndex % generoCycle.length];
            cycleIndex++;
            currentGenre = selected;
            updateGenreBadge();
        }

        function loadTrackUI(index) {
            if (!filteredPlaylist.length) return;
            const track = filteredPlaylist[index];
            if (!track) return;
            const tipoTag = track.tipo === "ao vivo" ? ' 🔴 AO VIVO' : '';
            trackArtist.innerHTML = `${track.title || 'Sem título'} - ${track.artist || 'Desconhecido'} [${track.genero}]${tipoTag}`;
            currentTimeEl.textContent = '0:00';
            if (track.duration) totalTimeEl.textContent = formatTime(track.duration);
            else totalTimeEl.textContent = '0:00';
            progressFill.style.width = '0%';
        }

        async function playMusic() {
            if (!isBackgroundActive) {
                showNotification('⚠️ Toque em "ATIVAR RÁDIO" primeiro!', 2000);
                return false;
            }
            if (!filteredPlaylist.length) {
                showNotification("Playlist vazia! Tente outro gênero.", 1500);
                return false;
            }

            loadingSpinner.classList.add('show');
            const track = filteredPlaylist[currentIndex];
            
            if (!track || !track.src) {
                loadingSpinner.classList.remove('show');
                showNotification(`Arquivo inválido: ${track?.title || 'desconhecido'}`, 2000);
                nextTrack();
                return false;
            }

            musicPlayer.src = track.src;
            musicPlayer.load();

            return new Promise((resolve) => {
                const timeout = setTimeout(() => {
                    loadingSpinner.classList.remove('show');
                    showNotification(`Timeout: ${track.title}`, 2000);
                    nextTrack();
                    resolve(false);
                }, 15000);

                musicPlayer.oncanplaythrough = async () => {
                    clearTimeout(timeout);
                    loadingSpinner.classList.remove('show');
                    try {
                        await musicPlayer.play();
                        isPlaying = true;
                        playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        startTimer();
                        resolve(true);
                    } catch(e) {
                        clearTimeout(timeout);
                        loadingSpinner.classList.remove('show');
                        console.error("Play error:", e);
                        resolve(false);
                    }
                };

                musicPlayer.onerror = (e) => {
                    clearTimeout(timeout);
                    loadingSpinner.classList.remove('show');
                    console.error("Error loading:", track.src, e);
                    showNotification(`Erro: ${track.title}`, 2000);
                    setTimeout(() => nextTrack(), 1500);
                    resolve(false);
                };
                
                musicPlayer.addEventListener('ended', () => {
                    if (isPlaying) nextTrack();
                }, { once: true });
            });
        }

        function pauseMusic() {
            musicPlayer.pause();
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopTimer();
        }

        function togglePlayPause() {
            if (!isBackgroundActive) {
                showNotification('Ative o áudio primeiro!', 1500);
                return;
            }
            isPlaying ? pauseMusic() : playMusic();
        }

        function nextTrack() {
            if (!filteredPlaylist.length) {
                showNotification("Playlist vazia!", 1500);
                return;
            }
            
            if (shuffleMode) {
                const randomIndex = Math.floor(Math.random() * filteredPlaylist.length);
                currentIndex = randomIndex;
            } else {
                currentIndex = (currentIndex + 1) % filteredPlaylist.length;
            }
            
            loadTrackUI(currentIndex);
            if (isPlaying) {
                setTimeout(() => playMusic(), 100);
            }
        }

        function prevTrack() {
            if (!filteredPlaylist.length) return;
            currentIndex = (currentIndex - 1 + filteredPlaylist.length) % filteredPlaylist.length;
            loadTrackUI(currentIndex);
            if (isPlaying) playMusic();
        }

        function startTimer() {
            stopTimer();
            timerInterval = setInterval(() => {
                if (isPlaying && musicPlayer.duration && !musicPlayer.paused && musicPlayer.currentTime) {
                    const percent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
                    progressFill.style.width = percent + '%';
                    currentTimeEl.textContent = formatTime(musicPlayer.currentTime);
                    totalTimeEl.textContent = formatTime(musicPlayer.duration);
                } else if (musicPlayer.duration && !isNaN(musicPlayer.duration)) {
                    totalTimeEl.textContent = formatTime(musicPlayer.duration);
                }
            }, 200);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
        }

        function createSilentAudio() {
            const sampleRate = 44100, duration = 2, numSamples = sampleRate * duration;
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);
            const writeString = (view, offset, str) => {
                for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
            };
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, numSamples * 2, true);
            let offset = 44;
            for (let i = 0; i < numSamples; i++) {
                view.setInt16(offset, 0, true);
                offset += 2;
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

        const backgroundAudio = document.getElementById('backgroundAudio');

        async function ativarAudioBackground() {
            try {
                const silentUrl = URL.createObjectURL(createSilentAudio());
                backgroundAudio.src = silentUrl;
                backgroundAudio.loop = true;
                backgroundAudio.volume = 0.001;
                await backgroundAudio.play();
                isBackgroundActive = true;
                document.getElementById('audioIndicator').innerHTML = '<i class="fas fa-brain"></i> IA Ativa';
                document.getElementById('audioIndicator').style.color = '#4ade80';
                
                if ('wakeLock' in navigator) {
                    try {
                        await navigator.wakeLock.request('screen');
                    } catch(e) {}
                }
                
                await playMusic();
                return true;
            } catch (error) {
                console.error("Erro ativar audio:", error);
                document.getElementById('audioIndicator').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Erro';
                return false;
            }
        }

        async function carregarPlaylist() {
            try {
                splash.querySelector('.loading-text').innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Baixando playlist IA...';
                const url = `${PLAYLIST_JSON_URL}?t=${Date.now()}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error('JSON vazio');
                }

                musicas = data.map((item, idx) => ({
                    id: item.id || idx + 1,
                    title: item.title || "Sem título",
                    artist: item.artist || "Desconhecido",
                    src: item.src || "",
                    genero: item.genero || "VARIADAS",
                    tipo: item.tipo || "normal",
                    duration: item.duration || null
                }));

                // Remove duplicatas pelo src
                const uniqueMap = new Map();
                for (const m of musicas) {
                    if (m.src && !uniqueMap.has(m.src)) {
                        uniqueMap.set(m.src, m);
                    }
                }
                musicas = Array.from(uniqueMap.values());
                
                console.log(`✅ Playlist carregada: ${musicas.length} músicas únicas`);
                splash.querySelector('.loading-text').innerHTML = `<i class="fas fa-check-circle"></i> ${musicas.length} músicas!`;

                // Conta músicas por gênero
                const genreCount = {};
                musicas.forEach(m => {
                    genreCount[m.genero] = (genreCount[m.genero] || 0) + 1;
                });
                console.log("Músicas por gênero:", genreCount);
                
                setInitialGenre();
                
                let initialFiltered = musicas.filter(m => m.genero === currentGenre);
                if (initialFiltered.length === 0) {
                    showNotification(`⚠️ Sem ${currentGenre}, usando TODOS`, 2000);
                    currentGenre = "TODOS";
                    initialFiltered = [...musicas];
                    updateGenreBadge();
                }
                
                filteredPlaylist = initialFiltered;
                if (shuffleMode) filteredPlaylist = shuffleArray([...filteredPlaylist]);
                
                currentIndex = 0;
                loadTrackUI(0);
                updateGenreBadge();

                setTimeout(() => {
                    splash.classList.add('hidden');
                    setTimeout(() => {
                        splash.style.display = 'none';
                        appContainer.style.display = 'block';
                        tapToStart.style.display = 'block';
                    }, 500);
                }, 1000);

            } catch (error) {
                console.error("Erro fatal:", error);
                splash.querySelector('.loading-text').innerHTML = `<i class="fas fa-exclamation-triangle"></i> Erro: ${error.message}`;
                
                musicas = [
                    { id: 1, title: "Corpo Nu", artist: "Panda", src: "Panda_Corpo_Nu_muzzik.m4a", genero: "SERTANEJO", tipo: "normal" },
                    { id: 2, title: "Infarto", artist: "Diego & Victor Hugo", src: "Diego_Victor_Hugo_Infarto_muzzik.m4a", genero: "SERTANEJO", tipo: "normal" },
                    { id: 3, title: "Haven't Met You Yet", artist: "Michael Bublé", src: "Michael_Bubl_Haven_t_Met_You_Yet.m4a", genero: "POP", tipo: "ao vivo" }
                ];
                
                currentGenre = "MPB";
                filteredPlaylist = [...musicas];
                currentIndex = 0;
                loadTrackUI(0);
                updateGenreBadge();
                
                setTimeout(() => {
                    splash.classList.add('hidden');
                    appContainer.style.display = 'block';
                    tapToStart.style.display = 'block';
                }, 1000);
            }
        }

        // EVENTOS
        document.getElementById('progressBar').addEventListener('click', (e) => {
            if (musicPlayer.duration) {
                const rect = e.currentTarget.getBoundingClientRect();
                musicPlayer.currentTime = ((e.clientX - rect.left) / rect.width) * musicPlayer.duration;
            }
        });

        playBtn.addEventListener('click', togglePlayPause);
        document.getElementById('nextBtn').addEventListener('click', nextTrack);
        document.getElementById('prevBtn').addEventListener('click', prevTrack);
        document.getElementById('shuffleBtn').addEventListener('click', () => {
            shuffleMode = !shuffleMode;
            showNotification(shuffleMode ? '🔀 Aleatório ON' : '➡️ Sequencial', 1500);
            if (shuffleMode && filteredPlaylist.length) {
                filteredPlaylist = shuffleArray([...filteredPlaylist]);
                currentIndex = 0;
                loadTrackUI(0);
                if (isPlaying) playMusic();
            } else if (!shuffleMode && filteredPlaylist.length) {
                filteredPlaylist = musicas.filter(m => currentGenre === "TODOS" ? true : m.genero === currentGenre);
                currentIndex = 0;
                loadTrackUI(0);
                if (isPlaying) playMusic();
            }
        });
        
        document.getElementById('genreButton').addEventListener('click', () => genresModal.classList.add('open'));
        document.getElementById('closeGenresBtn').addEventListener('click', () => genresModal.classList.remove('open'));
        document.getElementById('tap-to-start').addEventListener('click', async () => {
            showNotification('🔊 Ativando áudio...', 1500);
            await ativarAudioBackground();
            tapToStart.style.display = 'none';
        });

        setInterval(() => {
            const mainVideo = document.getElementById('mainVideo');
            if (mainVideo && mainVideo.paused && document.getElementById('appContainer').style.display !== 'none') {
                mainVideo.play().catch(e => console.log);
            }
        }, 3000);

        buildGenresGrid();
        carregarPlaylist();
    </script>
</body>
</html>
