<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cazé Playlist IA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: white;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }
        
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
            text-align: center;
        }
        #splash.hidden { opacity: 0; pointer-events: none; }
        .splash-content i { font-size: 4rem; color: #e63946; margin-bottom: 20px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
        .status-text { margin-top: 15px; font-size: 0.8rem; color: #ffaa00; }
        
        #tap-to-start {
            position: fixed;
            bottom: 25%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff6600, #ff3300);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 10000;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 20px rgba(255, 51, 0, 0.5);
            white-space: nowrap;
            display: none;
        }
        
        .app {
            width: 100%;
            height: 100vh;
            position: relative;
            display: none;
        }
        
        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .info-area {
            position: absolute;
            bottom: 120px;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            text-align: center;
            z-index: 20;
        }
        .track-title { font-size: 1rem; font-weight: bold; color: #e63946; }
        .track-artist { font-size: 0.8rem; color: #ccc; margin-top: 5px; }
        
        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            z-index: 20;
            transition: transform 0.3s;
        }
        .controls.hide { transform: translateY(100%); }
        
        .progress-bar {
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            cursor: pointer;
            margin: 10px 0;
        }
        .progress-fill {
            height: 100%;
            background: #e63946;
            width: 0%;
            border-radius: 3px;
        }
        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #aaa;
        }
        
        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 10px;
        }
        .btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .btn-play { width: 55px; height: 55px; background: #e63946; color: #000; font-size: 1.5rem; }
        .btn:active { transform: scale(0.95); }
        
        .float-buttons {
            position: fixed;
            bottom: 140px;
            left: 15px;
            display: flex;
            gap: 10px;
            z-index: 21;
        }
        .like-btn, .dislike-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: 2px solid;
            cursor: pointer;
            font-size: 1.2rem;
        }
        .like-btn { color: #4ade80; border-color: #4ade80; }
        .dislike-btn { color: #ef4444; border-color: #ef4444; }
        
        .genre-fab {
            position: fixed;
            bottom: 140px;
            right: 15px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8E2DE2, #4A00E0);
            border: none;
            color: white;
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 21;
        }
        
        .menu-fab {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: 1px solid #e63946;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 21;
        }
        
        .badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            border-left: 3px solid #e63946;
            z-index: 21;
        }
        
        .audio-status {
            position: absolute;
            top: 15px;
            right: 75px;
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            color: #ff2d2d;
            z-index: 21;
        }
        
        .modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 30px 30px 0 0;
            padding: 20px;
            transform: translateY(100%);
            transition: transform 0.3s;
            z-index: 5000;
        }
        .modal.open { transform: translateY(0); }
        .modal h3 { color: #e63946; text-align: center; margin-bottom: 15px; }
        .genres-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
            max-height: 300px;
            overflow-y: auto;
        }
        .genre-item {
            background: rgba(230,57,70,0.2);
            padding: 12px;
            text-align: center;
            border-radius: 15px;
            cursor: pointer;
        }
        .close-modal {
            width: 100%;
            padding: 12px;
            background: #e63946;
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 15px 25px;
            border-radius: 50px;
            display: none;
            z-index: 10001;
        }
        .loading.show { display: flex; gap: 10px; }
        
        .notification {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            z-index: 30;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            white-space: nowrap;
        }
        .notification.show { opacity: 1; }
    </style>
</head>
<body>

<div id="splash">
    <div class="splash-content">
        <i class="fas fa-brain"></i>
        <h1>Cazé Playlist IA</h1>
        <p>🎵 Carregando playlist do servidor...</p>
        <div class="status-text" id="statusText">📡 Conectando...</div>
    </div>
</div>

<button id="tap-to-start">🎵 ATIVAR ÁUDIO</button>

<div class="app" id="app">
    <div class="video-container">
        <video id="bgVideo" autoplay loop muted playsinline>
            <source src="Caze12.mp4" type="video/mp4">
        </video>
    </div>
    
    <div class="info-area">
        <div class="track-title" id="trackTitle">🎵 Carregando...</div>
        <div class="track-artist" id="trackArtist">Aguardando</div>
    </div>
    
    <div class="controls" id="controls">
        <div class="progress-time">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
        </div>
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="buttons">
            <button class="btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
            <button class="btn btn-play" id="playBtn"><i class="fas fa-play"></i></button>
            <button class="btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
        </div>
    </div>
    
    <div class="float-buttons">
        <button class="like-btn" id="likeBtn"><i class="fas fa-thumbs-up"></i></button>
        <button class="dislike-btn" id="dislikeBtn"><i class="fas fa-thumbs-down"></i></button>
    </div>
    
    <button class="genre-fab" id="genreBtn"><i class="fas fa-music"></i></button>
    <button class="menu-fab" id="menuBtn"><i class="fas fa-ellipsis-v"></i></button>
    
    <div class="badge" id="genreBadge">🎵 AGUARDANDO</div>
    <div class="audio-status" id="audioStatus"><i class="fas fa-circle"></i> Aguardando</div>
</div>

<audio id="musicPlayer" preload="auto"></audio>
<audio id="bgAudioPlayer" preload="auto" style="display: none;"></audio>

<div class="modal" id="genresModal">
    <h3><i class="fas fa-music"></i> Estilos Musicais</h3>
    <div class="genres-grid" id="genresList">
        <div class="genre-item" data-genero="SERTANEJO">🎸 SERTANEJO</div>
        <div class="genre-item" data-genero="FORRÓ">🥁 FORRÓ</div>
        <div class="genre-item" data-genero="FORRÓ ANTIGO">📀 FORRÓ ANTIGO</div>
        <div class="genre-item" data-genero="BREGA">💔 BREGA</div>
        <div class="genre-item" data-genero="MODA TOP">👑 MODA TOP</div>
        <div class="genre-item" data-genero="SAMBA">🎭 SAMBA</div>
        <div class="genre-item" data-genero="POP">🎤 POP</div>
        <div class="genre-item" data-genero="MPB">🎸 MPB</div>
        <div class="genre-item" data-genero="VARIADAS">🎲 VARIADAS</div>
        <div class="genre-item" data-genero="TODOS">📋 TODOS</div>
    </div>
    <button class="close-modal" id="closeGenresBtn">FECHAR</button>
</div>

<div class="loading" id="loading"><i class="fas fa-circle-notch fa-spin"></i> Carregando música...</div>
<div class="notification" id="notification">📡</div>

<script>
    // ==================== CONFIGURAÇÕES ====================
    const PLAYLIST_URL = "https://raw.githubusercontent.com/radioplaylist12/partico/main/playlist.json";
    const WHATSAPP = "5512988461978";
    const VOLUME = 0.9;
    
    // ==================== VARIÁVEIS ====================
    let musicas = [];
    let playlist = [];
    let currentIndex = 0;
    let isPlaying = false;
    let isBackgroundActive = false;
    let isLoading = false;
    let progressInterval = null;
    let bgInterval = null;
    let carregado = false;
    
    // Preferências IA
    let prefs = {
        liked: [],
        disliked: [],
        genrePref: {},
        plays: {}
    };
    
    // ==================== DOM ====================
    const splash = document.getElementById('splash');
    const statusText = document.getElementById('statusText');
    const tapBtn = document.getElementById('tap-to-start');
    const app = document.getElementById('app');
    const music = document.getElementById('musicPlayer');
    const bgAudio = document.getElementById('bgAudioPlayer');
    const playBtn = document.getElementById('playBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressFill = document.getElementById('progressFill');
    const currentTimeEl = document.getElementById('currentTime');
    const totalTimeEl = document.getElementById('totalTime');
    const trackTitle = document.getElementById('trackTitle');
    const trackArtist = document.getElementById('trackArtist');
    const genreBadge = document.getElementById('genreBadge');
    const audioStatus = document.getElementById('audioStatus');
    const loading = document.getElementById('loading');
    const notification = document.getElementById('notification');
    
    // ==================== FUNÇÕES ====================
    function showNotif(msg, duration = 3000) {
        notification.textContent = msg;
        notification.classList.add('show');
        setTimeout(() => notification.classList.remove('show'), duration);
    }
    
    function showLoad(show) {
        if (show) loading.classList.add('show');
        else loading.classList.remove('show');
    }
    
    function formatTime(sec) {
        if (isNaN(sec) || !isFinite(sec)) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
    
    function savePrefs() { localStorage.setItem('caze_prefs', JSON.stringify(prefs)); }
    function loadPrefs() {
        const saved = localStorage.getItem('caze_prefs');
        if (saved) { try { prefs = { ...prefs, ...JSON.parse(saved) }; } catch(e) {} }
    }
    
    // ==================== PESO DA IA ====================
    function getWeight(song) {
        let weight = 1;
        if (prefs.liked.includes(song.id)) weight += 10;
        if (prefs.disliked.includes(song.id)) weight -= 20;
        const plays = prefs.plays[song.id] || 0;
        weight -= plays * 0.3;
        const genreScore = prefs.genrePref[song.genero] || 0;
        weight += genreScore * 0.5;
        return Math.max(0.1, weight);
    }
    
    function gerarPlaylist() {
        if (!musicas.length) return [];
        let candidates = [...musicas];
        candidates = candidates.filter(m => !prefs.disliked.includes(m.id));
        if (candidates.length === 0) candidates = [...musicas];
        candidates.sort((a, b) => getWeight(b) - getWeight(a));
        for (let i = 0; i < candidates.length; i++) {
            if (Math.random() > 0.7) {
                const j = Math.floor(Math.random() * candidates.length);
                [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
            }
        }
        return candidates;
    }
    
    function updateUI() {
        if (playlist.length === 0) return;
        const track = playlist[currentIndex];
        if (track) {
            trackTitle.textContent = track.title;
            trackArtist.textContent = `${track.artist} • ${track.genero}`;
            genreBadge.innerHTML = `<i class="fas fa-music"></i> ${track.genero}`;
        }
    }
    
    // ==================== PLAYER ====================
    async function playMusic() {
        if (!isBackgroundActive) {
            showNotif("⚠️ Clique em ATIVAR ÁUDIO primeiro!", 3000);
            return false;
        }
        if (isLoading) return false;
        if (!playlist.length) {
            playlist = gerarPlaylist();
            if (!playlist.length) return false;
        }
        if (currentIndex >= playlist.length) currentIndex = 0;
        
        const track = playlist[currentIndex];
        if (!track || !track.src) {
            nextTrack();
            return false;
        }
        
        isLoading = true;
        showLoad(true);
        music.pause();
        music.src = track.src;
        music.load();
        updateUI();
        
        return new Promise((resolve) => {
            const timeout = setTimeout(() => {
                showLoad(false);
                isLoading = false;
                showNotif(`⚠️ Erro ao carregar "${track.title}"`, 2000);
                nextTrack();
                resolve(false);
            }, 8000);
            
            music.oncanplaythrough = async () => {
                clearTimeout(timeout);
                showLoad(false);
                isLoading = false;
                try {
                    await music.play();
                    isPlaying = true;
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    
                    if (progressInterval) clearInterval(progressInterval);
                    progressInterval = setInterval(() => {
                        if (isPlaying && music.duration && !music.paused) {
                            const percent = (music.currentTime / music.duration) * 100;
                            progressFill.style.width = percent + '%';
                            currentTimeEl.textContent = formatTime(music.currentTime);
                            totalTimeEl.textContent = formatTime(music.duration);
                        }
                    }, 200);
                    
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.metadata = new MediaMetadata({
                            title: track.title,
                            artist: track.artist,
                            album: track.genero
                        });
                    }
                    
                    prefs.plays[track.id] = (prefs.plays[track.id] || 0) + 1;
                    savePrefs();
                    
                    resolve(true);
                } catch(e) {
                    clearTimeout(timeout);
                    showLoad(false);
                    isLoading = false;
                    isPlaying = false;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    resolve(false);
                }
            };
            
            music.onerror = () => {
                clearTimeout(timeout);
                showLoad(false);
                isLoading = false;
                showNotif(`⚠️ Erro no arquivo: ${track.title}`, 2000);
                nextTrack();
                resolve(false);
            };
            
            music.onended = () => {
                if (!isLoading) nextTrack();
            };
        });
    }
    
    function pauseMusic() {
        music.pause();
        isPlaying = false;
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
        if (progressInterval) clearInterval(progressInterval);
        progressInterval = null;
    }
    
    function togglePlay() {
        if (!isBackgroundActive) {
            showNotif("⚠️ Clique em ATIVAR ÁUDIO primeiro!", 3000);
            return;
        }
        if (isPlaying) pauseMusic();
        else playMusic();
    }
    
    function nextTrack() {
        if (isLoading) return;
        if (progressInterval) clearInterval(progressInterval);
        currentIndex = (currentIndex + 1) % playlist.length;
        updateUI();
        if (isPlaying) playMusic();
    }
    
    function prevTrack() {
        if (isLoading) return;
        if (progressInterval) clearInterval(progressInterval);
        currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
        updateUI();
        if (isPlaying) playMusic();
    }
    
    function likeSong() {
        const track = playlist[currentIndex];
        if (!track) return;
        if (!prefs.liked.includes(track.id)) {
            prefs.liked.push(track.id);
            prefs.disliked = prefs.disliked.filter(id => id !== track.id);
            prefs.genrePref[track.genero] = (prefs.genrePref[track.genero] || 0) + 1;
            savePrefs();
            showNotif(`👍 Curtiu "${track.title}"!`, 2000);
        }
    }
    
    function dislikeSong() {
        const track = playlist[currentIndex];
        if (!track) return;
        if (!prefs.disliked.includes(track.id)) {
            prefs.disliked.push(track.id);
            prefs.liked = prefs.liked.filter(id => id !== track.id);
            savePrefs();
            showNotif(`👎 Não curtiu "${track.title}"`, 2000);
            setTimeout(() => nextTrack(), 500);
        }
    }
    
    function filterByGenre(genero) {
        if (genero === "TODOS") {
            playlist = gerarPlaylist();
        } else {
            let nova = musicas.filter(m => m.genero === genero);
            if (nova.length === 0) {
                showNotif(`⚠️ Nenhuma música de ${genero}`, 2000);
                return;
            }
            playlist = nova;
        }
        currentIndex = 0;
        updateUI();
        if (isPlaying) playMusic();
        showNotif(`🎵 ${genero} ativado!`, 2000);
    }
    
    // ==================== ÁUDIO BACKGROUND ====================
    function criarAudioSilencioso() {
        const sampleRate = 44100, duration = 5, numSamples = sampleRate * duration;
        const buffer = new ArrayBuffer(44 + numSamples * 2);
        const view = new DataView(buffer);
        const writeString = (view, offset, str) => {
            for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
        };
        writeString(view, 0, 'RIFF');
        view.setUint32(4, 36 + numSamples * 2, true);
        writeString(view, 8, 'WAVE');
        writeString(view, 12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, 'data');
        view.setUint32(40, numSamples * 2, true);
        let offset = 44;
        for (let i = 0; i < numSamples; i++) {
            view.setInt16(offset, 0, true);
            offset += 2;
        }
        return new Blob([buffer], { type: 'audio/wav' });
    }
    
    async function ativarAudio() {
        try {
            const silentUrl = URL.createObjectURL(criarAudioSilencioso());
            bgAudio.src = silentUrl;
            bgAudio.loop = true;
            bgAudio.volume = 0.001;
            await bgAudio.play();
            isBackgroundActive = true;
            audioStatus.innerHTML = '<i class="fas fa-check-circle"></i> Áudio Ativo';
            audioStatus.style.color = '#4ade80';
            
            if (bgInterval) clearInterval(bgInterval);
            bgInterval = setInterval(async () => {
                try {
                    if (bgAudio.paused && isBackgroundActive) await bgAudio.play();
                    if (isPlaying && music.paused && !music.ended && !isLoading) await music.play();
                    if (music.ended && isPlaying && !isLoading) nextTrack();
                } catch(e) {}
            }, 1000);
            
            return true;
        } catch(e) {
            audioStatus.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Erro';
            audioStatus.style.color = '#ef4444';
            return false;
        }
    }
    
    // ==================== CARREGAR PLAYLIST DO JSON ====================
    async function carregarPlaylist() {
        statusText.innerHTML = "📡 Baixando playlist do servidor...";
        
        // Tentar cache primeiro
        const cached = localStorage.getItem('caze_playlist');
        const cacheTime = localStorage.getItem('caze_playlist_time');
        
        if (cached && cacheTime && (Date.now() - parseInt(cacheTime) < 3600000)) {
            try {
                musicas = JSON.parse(cached);
                console.log(`📦 Cache: ${musicas.length} músicas`);
                statusText.innerHTML = `✅ ${musicas.length} músicas carregadas!`;
                finalizarInicio();
                return;
            } catch(e) {}
        }
        
        try {
            console.log("🔄 Buscando playlist em:", PLAYLIST_URL);
            const res = await fetch(PLAYLIST_URL);
            
            if (!res.ok) {
                throw new Error(`HTTP ${res.status}`);
            }
            
            musicas = await res.json();
            console.log(`✅ Playlist carregada: ${musicas.length} músicas`);
            
            // Garantir que cada música tenha os campos necessários
            musicas = musicas.map((m, i) => ({
                id: m.id || i + 1,
                title: m.title || "Sem título",
                artist: m.artist || "Desconhecido",
                src: m.src,
                genero: m.genero || "VARIADAS"
            }));
            
            // Salvar cache
            localStorage.setItem('caze_playlist', JSON.stringify(musicas));
            localStorage.setItem('caze_playlist_time', Date.now().toString());
            
            statusText.innerHTML = `✅ ${musicas.length} músicas carregadas!`;
            finalizarInicio();
            
        } catch(e) {
            console.error("Erro ao carregar playlist:", e);
            statusText.innerHTML = "⚠️ Erro ao carregar! Verifique o link do JSON";
            showNotif("❌ Erro ao carregar playlist! Verifique o arquivo JSON", 5000);
            
            // Se tiver cache, usa ele
            if (cached) {
                try {
                    musicas = JSON.parse(cached);
                    statusText.innerHTML = `⚠️ Usando cache: ${musicas.length} músicas`;
                    finalizarInicio();
                } catch(e2) {}
            }
        }
    }
    
    function finalizarInicio() {
        if (!musicas.length) {
            statusText.innerHTML = "❌ Nenhuma música encontrada!";
            return;
        }
        
        carregado = true;
        playlist = gerarPlaylist();
        currentIndex = 0;
        updateUI();
        
        // Esconder splash e mostrar app
        setTimeout(() => {
            splash.classList.add('hidden');
            setTimeout(() => splash.style.display = 'none', 500);
            app.style.display = 'block';
            tapBtn.style.display = 'block';
        }, 800);
        
        // Carregar gêneros únicos no modal
        const generosUnicos = [...new Set(musicas.map(m => m.genero))];
        const genresGrid = document.getElementById('genresList');
        if (generosUnicos.length > 0) {
            genresGrid.innerHTML = '';
            generosUnicos.forEach(genero => {
                const div = document.createElement('div');
                div.className = 'genre-item';
                div.setAttribute('data-genero', genero);
                div.innerHTML = getIconGenero(genero) + ' ' + genero;
                div.onclick = () => { filterByGenre(genero); document.getElementById('genresModal').classList.remove('open'); };
                genresGrid.appendChild(div);
            });
            // Adicionar TODOS
            const divTodos = document.createElement('div');
            divTodos.className = 'genre-item';
            divTodos.setAttribute('data-genero', 'TODOS');
            divTodos.innerHTML = '📋 TODOS';
            divTodos.onclick = () => { filterByGenre('TODOS'); document.getElementById('genresModal').classList.remove('open'); };
            genresGrid.appendChild(divTodos);
        }
        
        showNotif(`✅ ${musicas.length} músicas prontas!`, 3000);
    }
    
    function getIconGenero(genero) {
        switch(genero) {
            case 'SERTANEJO': return '🎸';
            case 'FORRÓ': return '🥁';
            case 'FORRÓ ANTIGO': return '📀';
            case 'BREGA': return '💔';
            case 'MODA TOP': return '👑';
            case 'SAMBA': return '🎭';
            case 'POP': return '🎤';
            case 'MPB': return '🎸';
            default: return '🎵';
        }
    }
    
    // ==================== ATIVAR RÁDIO ====================
    async function ativarRadio() {
        tapBtn.style.display = 'none';
        showNotif("🔊 Ativando áudio...", 2000);
        const ok = await ativarAudio();
        
        if (ok && musicas.length) {
            await playMusic();
            try { await document.documentElement.requestFullscreen(); } catch(e) {}
            showNotif("✅ Rádio tocando! Tela bloqueada funciona! ✅", 4000);
        } else if (!musicas.length) {
            showNotif("⏳ Aguardando playlist carregar...", 2000);
            const esperar = setInterval(() => {
                if (musicas.length) {
                    clearInterval(esperar);
                    playMusic();
                }
            }, 1000);
            setTimeout(() => clearInterval(esperar), 10000);
        } else {
            showNotif("❌ Falha ao ativar áudio. Tente novamente.", 3000);
            tapBtn.style.display = 'block';
        }
    }
    
    // ==================== EVENTOS ====================
    function setupEvents() {
        tapBtn.addEventListener('click', ativarRadio);
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevTrack);
        nextBtn.addEventListener('click', nextTrack);
        document.getElementById('likeBtn').addEventListener('click', likeSong);
        document.getElementById('dislikeBtn').addEventListener('click', dislikeSong);
        
        document.getElementById('genreBtn').addEventListener('click', () => {
            document.getElementById('genresModal').classList.add('open');
        });
        document.getElementById('closeGenresBtn').addEventListener('click', () => {
            document.getElementById('genresModal').classList.remove('open');
        });
        
        document.getElementById('progressBar').addEventListener('click', (e) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            if (music.duration) music.currentTime = percent * music.duration;
        });
        
        // Swipe gestures
        let touchStart = 0;
        app.addEventListener('touchstart', (e) => { touchStart = e.changedTouches[0].screenX; });
        app.addEventListener('touchend', (e) => {
            const diff = e.changedTouches[0].screenX - touchStart;
            if (Math.abs(diff) > 50) {
                if (diff > 0) prevTrack();
                else nextTrack();
            }
        });
        
        // Esconder controles
        let hideTimeout;
        function resetHide() {
            document.getElementById('controls').classList.remove('hide');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                if (isPlaying && !isLoading) document.getElementById('controls').classList.add('hide');
            }, 3000);
        }
        app.addEventListener('click', resetHide);
        resetHide();
        
        // Menu (WhatsApp)
        document.getElementById('menuBtn').addEventListener('click', () => {
            window.open(`https://wa.me/${WHATSAPP}?text=Olá!%20Vim%20pelo%20Cazé%20Playlist%20IA`, '_blank');
        });
    }
    
    // ==================== INICIAR ====================
    loadPrefs();
    setupEvents();
    carregarPlaylist();
    music.volume = VOLUME;
    
    console.log("🎬 Cazé Playlist IA - Carregando playlist do JSON");
    console.log("📦 URL:", PLAYLIST_URL);
    console.log("📱 Aguardando usuário clicar em ATIVAR");
</script>
</body>
