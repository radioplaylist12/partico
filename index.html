<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rádio Patico IA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #000; overflow: hidden; position: fixed; width: 100%; height: 100%; }
        .app { width: 100%; height: 100vh; background: #000; position: relative; }
        .fullscreen-video-container video { width: 100%; height: 100%; object-fit: cover; position: fixed; top: 0; left: 0; z-index: 1; }
        .controls-overlay { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(12px); padding: 12px 20px; z-index: 20; display: flex; flex-direction: column; gap: 8px; transition: transform 0.3s; }
        .controls-overlay.hide { transform: translateY(100%); }
        .track-info { text-align: center; color: white; font-size: 0.85rem; }
        .progress-area { cursor: pointer; }
        .progress-bar { height: 4px; background: rgba(255,255,255,0.3); border-radius: 4px; }
        .progress-fill { width: 0%; height: 100%; background: #e63946; border-radius: 4px; }
        .progress-time { display: flex; justify-content: space-between; color: #ccc; font-size: 0.7rem; margin-bottom: 4px; }
        .control-buttons { display: flex; justify-content: center; gap: 20px; }
        .control-btn { background: rgba(0,0,0,0.6); border: none; color: white; width: 48px; height: 48px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; }
        .play-btn { background: #e63946; width: 58px; height: 58px; font-size: 1.6rem; }
        .genre-button { position: fixed; bottom: 80px; right: 20px; width: 70px; height: 70px; background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; z-index: 26; }
        .genre-button i { font-size: 1.5rem; color: #e63946; }
        .genre-button .gen-text { font-size: 0.7rem; color: #ff8c00; }
        .genre-badge { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,0.7); padding: 4px 12px; border-radius: 20px; color: white; font-size: 0.7rem; z-index: 31; border-left: 3px solid #e63946; }
        .audio-indicator { position: fixed; top: 12px; right: 70px; background: rgba(0,0,0,0.6); padding: 4px 10px; border-radius: 20px; color: #4ade80; font-size: 0.6rem; z-index: 31; }
        .menu-button { position: fixed; top: 12px; right: 12px; background: rgba(0,0,0,0.6); width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; z-index: 31; }
        .menu-popup { position: fixed; top: 65px; right: 12px; background: rgba(0,0,0,0.9); border-radius: 16px; padding: 10px; display: none; flex-direction: column; gap: 8px; z-index: 32; }
        .menu-popup.open { display: flex; }
        .menu-popup button { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 16px; border-radius: 30px; cursor: pointer; }
        .tv-pix-overlay { position: fixed; bottom: 20px; left: 20px; background: rgba(0,0,0,0.85); border-radius: 24px; padding: 15px; z-index: 1000; display: none; color: white; text-align: center; }
        .tv-pix-overlay.show { display: block; }
        .tv-pix-overlay .pix-key { background: #222; padding: 8px; border-radius: 12px; cursor: pointer; font-weight: bold; }
        .exit-tv-btn { position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.85); border: 2px solid #00d4ff; padding: 8px 16px; border-radius: 50px; z-index: 102; display: none; cursor: pointer; color: white; }
        .tv-mode-active .controls-overlay, .tv-mode-active .feedback-buttons, .tv-mode-active .genre-button { transform: scale(1.2); transform-origin: bottom right; }
        .feedback-buttons { position: fixed; bottom: 140px; left: 20px; display: flex; gap: 12px; z-index: 27; }
        .feedback-btn { width: 48px; height: 48px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .feedback-btn.like { color: #4ade80; }
        .feedback-btn.dislike { color: #ef4444; }
        #tap-to-start { position: fixed; bottom: 20%; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #ff8c00, #ff6600); color: white; padding: 14px 28px; border-radius: 60px; font-weight: bold; cursor: pointer; z-index: 10000; border: none; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.03); } }
        .live-info-balloon { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65); border-radius: 80px; padding: 8px 20px; z-index: 1000; display: none; color: white; cursor: pointer; white-space: nowrap; }
        .swipe-indicator { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 10px 20px; border-radius: 30px; z-index: 10002; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .loading-spinner { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.9); padding: 15px 25px; border-radius: 50px; z-index: 10001; display: none; color: white; }
        .loading-spinner.show { display: flex; gap: 12px; align-items: center; }
        .visualizer { position: fixed; top: 70px; right: 20px; display: flex; gap: 4px; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 30px; z-index: 31; }
        .visualizer-bar { width: 4px; height: 20px; background: linear-gradient(135deg, #e63946, #ff6b6b); border-radius: 2px; transition: height 0.05s; }
        .video-ad-overlay { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 300px; z-index: 1000; display: none; border-radius: 16px; overflow: hidden; border: 2px solid #e63946; cursor: pointer; }
        .video-ad-overlay video { width: 100%; display: block; }
        .audio-ad-container { position: fixed; bottom: 30%; left: 50%; transform: translateX(-50%); background: #e63946; color: white; padding: 12px 24px; border-radius: 50px; z-index: 1002; display: none; gap: 12px; white-space: nowrap; }
        .audio-ad-container.show { display: flex; }
    </style>
</head>
<body>
    <div id="tap-to-start">🎵 ATIVAR RÁDIO</div>
    <div class="app">
        <div class="fullscreen-video-container"><video id="bgVideo" autoplay loop muted playsinline></video></div>
        <div class="controls-overlay" id="controlsOverlay">
            <div class="track-info"><p id="trackName">Clique em ATIVAR RÁDIO</p></div>
            <div class="progress-area" id="progressArea">
                <div class="progress-time"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
                <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            </div>
            <div class="control-buttons">
                <button class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                <button class="control-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
                <button class="control-btn" id="shuffleBtn"><i class="fas fa-random"></i></button>
                <button class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
            </div>
        </div>
        <div class="genre-badge" id="genreBadge">🔴 LIVE</div>
        <div class="audio-indicator" id="audioIndicator">Aguardando</div>
        <div class="feedback-buttons">
            <button class="feedback-btn like" id="likeBtn"><i class="fas fa-thumbs-up"></i></button>
            <button class="feedback-btn dislike" id="dislikeBtn"><i class="fas fa-thumbs-down"></i></button>
        </div>
        <div class="visualizer" id="visualizer"><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div><div class="visualizer-bar"></div></div>
        <div class="live-info-balloon" id="liveBalloon" style="display: none;">AO VIVO</div>
        <div class="loading-spinner" id="loadingSpinner"><i class="fas fa-circle-notch fa-spin"></i> Carregando...</div>
        <button class="genre-button" id="genreBtn"><i class="fas fa-music"></i><span class="gen-text">GEN</span></button>
        <button class="exit-tv-btn" id="exitTvBtn">SAIR MODO TV</button>
        <div class="tv-pix-overlay" id="tvPixOverlay"><h3>APOIE A RÁDIO</h3><div class="pix-key" id="pixKey">12988461978</div><small>Clique para copiar PIX</small></div>
        <div class="video-ad-overlay" id="videoAdOverlay"><video id="adVideo" loop muted playsinline><source src="tea.mp4"></video></div>
        <div class="audio-ad-container" id="audioAdToast"><i class="fas fa-volume-up"></i><span id="adText">🎧 Anúncio</span></div>
        <div class="menu-button" id="menuBtn"><i class="fas fa-ellipsis-v"></i></div>
        <div class="menu-popup" id="menuPopup">
            <button id="tvModeBtn">Modo TV</button>
            <button id="fullscreenBtn">Tela cheia</button>
            <button id="shareBtn">Compartilhar</button>
            <button id="statsBtn">Estatísticas</button>
            <button id="manualBtn">Manual</button>
            <button id="feedbackBtn">Feedback</button>
        </div>
    </div>
    <div class="swipe-indicator" id="swipeIndicator">👉 Deslize</div>
    <div id="genresModal" class="genres-modal" style="display: none;"></div>

    <audio id="musicPlayer" preload="auto"></audio>
    <audio id="bgAudio" preload="auto"></audio>

    <script>
        // ==================== PLAYLIST DE EXEMPLO (SUBSTITUA PELA SUA) ====================
        const musicas = [
            { id: 1, title: "Corpo Nu", artist: "Panda", src: "Panda_Corpo_Nu_muzzik.m4a", genero: "SERTANEJO", tipo: "normal" },
            { id: 2, title: "Infarto", artist: "Diego & Victor Hugo", src: "Diego_Victor_Hugo_Infarto_muzzik.m4a", genero: "SERTANEJO", tipo: "normal" },
            { id: 3, title: "Ficar por Ficar", artist: "Zé Vaqueiro", src: "Zé-Vaqueiro-Ficar-por-Ficar.m4a", genero: "FORRÓ", tipo: "normal" },
            { id: 4, title: "Coração Partido", artist: "Luan Estilizado", src: "Coração Partido.mp3", genero: "FORRÓ", tipo: "normal" },
            { id: 5, title: "Lance Livre", artist: "Kamisa 10", src: "Lance Livre.mp3", genero: "SAMBA", tipo: "normal" },
            { id: 6, title: "Billie Jean", artist: "Michael Jackson", src: "Billie Jean.m4a", genero: "POP", tipo: "normal" },
            { id: 7, title: "Tarde Demais", artist: "À Vontade", src: "Tarde Demais.m4a", genero: "BREGA", tipo: "normal" },
            { id: 8, title: "Palpite", artist: "Vanessa Rangel", src: "Palpite.m4a", genero: "MPB", tipo: "normal" }
        ];

        // ==================== VÍDEOS E PROGRAMAS ====================
        const VIDEO_POR_GENERO = {
            "SERTANEJO": "sertanejo.mp4",
            "FORRÓ": "forro.mp4",
            "SAMBA": "samba.mp4",
            "POP": "pop.mp4",
            "BREGA": "brega.mp4",
            "MPB": "mpb.mp4"
        };
        const VIDEOS_ROTACAO = Object.values(VIDEO_POR_GENERO);
        let videoRotacaoIndex = 0;
        
        const programas = [
            { nome: "MANHA", nomeExibicao: "☀️ Manhã Patico", video: "diapatico.mp4", dias: [1,2,3,4,5], inicio: 6, fim: 12, percentuais: { "FORRÓ": 20, "SAMBA": 30, "SERTANEJO": 50 } },
            { nome: "TARDE", nomeExibicao: "🌤️ Tarde Patico", video: "tardepatico.mp4", dias: [1,2,3,4,5], inicio: 12, fim: 18, percentuais: { "FORRÓ": 50, "SERTANEJO": 30, "SAMBA": 20 } },
            { nome: "NOITE", nomeExibicao: "🌙 Noite Patico", video: "noitepatico.mp4", dias: [1,2,3,4,5], inicio: 18, fim: 24, percentuais: { "POP": 100 } },
            { nome: "BREGAO", nomeExibicao: "💃 Bregão do Patico", video: "bregapatico.mp4", dias: [6], inicio: 6, fim: 16, percentuais: { "BREGA": 100 } }
        ];
        
        let isTvMode = false;
        let isAoVivo = true;          // inicia em modo ao vivo
        let isManualGenre = false;     // usuário escolheu gênero manualmente
        let currentProgram = null;
        let shuffleMode = false;
        let filteredPlaylist = [];
        let currentIndex = 0, isPlaying = false;
        let timerInterval = null, visInterval = null;
        let trackStartTime = 0;
        let backgroundActive = false;
        
        // Elementos
        const bgVideo = document.getElementById('bgVideo');
        const musicPlayer = document.getElementById('musicPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeSpan = document.getElementById('currentTime');
        const totalTimeSpan = document.getElementById('totalTime');
        const trackNameSpan = document.getElementById('trackName');
        const genreBadge = document.getElementById('genreBadge');
        const audioIndicator = document.getElementById('audioIndicator');
        const likeBtn = document.getElementById('likeBtn');
        const dislikeBtn = document.getElementById('dislikeBtn');
        const volume = 0.9;
        
        musicPlayer.volume = volume;
        
        // ==================== FUNÇÕES GERAIS ====================
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        function formatTime(sec) {
            if (isNaN(sec)) return "0:00";
            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
        function showNotification(msg, duration = 3000) {
            const notif = document.createElement('div');
            notif.textContent = msg;
            notif.style.position = 'fixed';
            notif.style.bottom = '20%';
            notif.style.left = '50%';
            notif.style.transform = 'translateX(-50%)';
            notif.style.background = 'rgba(0,0,0,0.8)';
            notif.style.color = 'white';
            notif.style.padding = '10px 20px';
            notif.style.borderRadius = '30px';
            notif.style.zIndex = '10000';
            notif.style.fontSize = '0.9rem';
            notif.style.borderLeft = '3px solid #e63946';
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), duration);
        }
        function stopTimer() { if (timerInterval) clearInterval(timerInterval); timerInterval = null; }
        function startTimer() {
            stopTimer();
            timerInterval = setInterval(() => {
                if (isPlaying && musicPlayer.duration && !musicPlayer.paused) {
                    const percent = (musicPlayer.currentTime / musicPlayer.duration) * 100;
                    progressFill.style.width = percent + '%';
                    currentTimeSpan.textContent = formatTime(musicPlayer.currentTime);
                }
            }, 200);
        }
        function initVisualizer() {
            if (visInterval) clearInterval(visInterval);
            visInterval = setInterval(() => {
                const bars = document.querySelectorAll('.visualizer-bar');
                if (isPlaying && !musicPlayer.paused && musicPlayer.duration) {
                    bars.forEach(bar => bar.style.height = (8 + Math.random() * 32) + 'px');
                } else {
                    bars.forEach(bar => bar.style.height = '4px');
                }
            }, 100);
        }
        function stopVisualizer() { if (visInterval) clearInterval(visInterval); visInterval = null; }
        function showLoading() { document.getElementById('loadingSpinner').classList.add('show'); }
        function hideLoading() { document.getElementById('loadingSpinner').classList.remove('show'); }
        
        // ==================== VÍDEO ====================
        function trocarVideo(src) {
            if (!src || isTvMode) return;
            if (bgVideo.src !== src) {
                bgVideo.pause();
                bgVideo.src = src;
                bgVideo.load();
                bgVideo.play().catch(e => console.log("Erro vídeo:", e));
            }
        }
        
        // ==================== PROGRAMAÇÃO AUTOMÁTICA ====================
        function getProgramaAtivo() {
            const now = new Date();
            const dia = now.getDay();
            const hora = now.getHours();
            for (let p of programas) {
                if (p.dias.includes(dia) && hora >= p.inicio && hora < p.fim) return p;
            }
            return null;
        }
        function gerarPlaylistPorPercentuais(percentuais) {
            let lista = [];
            for (let [gen, perc] of Object.entries(percentuais)) {
                let songs = musicas.filter(m => m.genero === gen);
                if (songs.length === 0) continue;
                let qtd = Math.max(3, Math.floor((perc / 100) * 30));
                let selecionadas = shuffleArray([...songs]).slice(0, qtd);
                lista.push(...selecionadas);
            }
            return shuffleArray(lista);
        }
        function aplicarProgramacao() {
            if (isAoVivo) return;
            if (isManualGenre) return;
            const prog = getProgramaAtivo();
            if (prog) {
                if (currentProgram !== prog.nome) {
                    currentProgram = prog.nome;
                    trocarVideo(prog.video);
                    filteredPlaylist = gerarPlaylistPorPercentuais(prog.percentuais);
                    currentIndex = 0;
                    loadTrackUI(currentIndex);
                    if (isPlaying) playMusic();
                    showNotification(`📻 ${prog.nomeExibicao} ativado!`);
                }
            } else {
                if (currentProgram !== null) {
                    currentProgram = null;
                    ativarModoAoVivo();
                }
            }
        }
        
        // ==================== MODO AO VIVO ====================
        function ativarModoAoVivo() {
            isAoVivo = true;
            isManualGenre = false;
            currentProgram = null;
            genreBadge.innerHTML = '🔴 LIVE';
            genreBadge.className = 'genre-badge live';
            let aoVivo = musicas.filter(m => m.tipo === "ao vivo");
            if (aoVivo.length === 0) aoVivo = musicas;
            filteredPlaylist = shuffleArray(aoVivo);
            currentIndex = 0;
            loadTrackUI(currentIndex);
            if (isPlaying) playMusic();
            showNotification('🔴 MODO AO VIVO ativado!');
            if (window.videoAdInterval) clearInterval(window.videoAdInterval);
            window.videoAdInterval = setInterval(() => iniciarVideoAd(), 30000);
        }
        function desativarModoAoVivo() {
            isAoVivo = false;
            if (window.videoAdInterval) clearInterval(window.videoAdInterval);
            document.getElementById('videoAdOverlay').style.display = 'none';
            genreBadge.classList.remove('live');
            aplicarProgramacao(); // tenta ativar programação
            if (!currentProgram && !isManualGenre) {
                // playlist padrão
                let songs = musicas.filter(m => m.genero === "SERTANEJO");
                if (songs.length === 0) songs = musicas;
                filteredPlaylist = shuffleArray(songs);
                currentIndex = 0;
                loadTrackUI(currentIndex);
                if (isPlaying) playMusic();
            }
        }
        
        // ==================== IA E ESTATÍSTICAS (simplificadas) ====================
        let userPref = { liked: [], disliked: [] };
        function likeSong() {
            let track = filteredPlaylist[currentIndex];
            if (!track) return;
            if (!userPref.liked.includes(track.id)) {
                userPref.liked.push(track.id);
                userPref.disliked = userPref.disliked.filter(id => id !== track.id);
                showNotification(`👍 Curtiu "${track.title}"`);
            } else showNotification(`❤️ Já curtiu`);
        }
        function dislikeSong() {
            let track = filteredPlaylist[currentIndex];
            if (!track) return;
            if (!userPref.disliked.includes(track.id)) {
                userPref.disliked.push(track.id);
                userPref.liked = userPref.liked.filter(id => id !== track.id);
                showNotification(`👎 Não curtiu "${track.title}"`);
                setTimeout(() => nextTrack(), 500);
            } else showNotification(`👎 Já marcou`);
        }
        
        // ==================== PLAYER ====================
        function loadTrackUI(index) {
            if (filteredPlaylist.length === 0) return;
            if (index >= filteredPlaylist.length) index = 0;
            if (index < 0) index = filteredPlaylist.length - 1;
            currentIndex = index;
            let track = filteredPlaylist[currentIndex];
            trackNameSpan.textContent = `${track.title} - ${track.artist} [${track.genero}]`;
            currentTimeSpan.textContent = '0:00';
            totalTimeSpan.textContent = '0:00';
            progressFill.style.width = '0%';
            if (!isAoVivo) genreBadge.innerHTML = track.genero;
        }
        async function playMusic() {
            if (!backgroundActive) { showNotification('Clique em ATIVAR RÁDIO primeiro!'); return; }
            if (filteredPlaylist.length === 0) return;
            let track = filteredPlaylist[currentIndex];
            if (!track || !track.src) return;
            showLoading();
            musicPlayer.pause();
            musicPlayer.src = track.src;
            musicPlayer.load();
            try {
                await musicPlayer.play();
                isPlaying = true;
                playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>';
                startTimer();
                initVisualizer();
                hideLoading();
                trackStartTime = Date.now();
                musicPlayer.onended = () => {
                    let timePlayed = (Date.now() - trackStartTime) / 1000;
                    if (timePlayed > musicPlayer.duration * 0.7) {
                        // completou
                    }
                    nextTrack();
                };
                if (musicPlayer.duration) totalTimeSpan.textContent = formatTime(musicPlayer.duration);
                else musicPlayer.addEventListener('loadedmetadata', () => totalTimeSpan.textContent = formatTime(musicPlayer.duration), { once: true });
            } catch(e) {
                hideLoading();
                isPlaying = false;
                playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
                console.log("Erro play:", e);
            }
        }
        function pauseMusic() {
            musicPlayer.pause();
            isPlaying = false;
            playPauseBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopTimer();
            stopVisualizer();
        }
        function togglePlayPause() {
            if (!backgroundActive) { showNotification('Ative a rádio primeiro!'); return; }
            isPlaying ? pauseMusic() : playMusic();
        }
        async function nextTrack() {
            if (filteredPlaylist.length === 0) return;
            let next = (currentIndex + 1) % filteredPlaylist.length;
            currentIndex = next;
            loadTrackUI(currentIndex);
            if (isPlaying) await playMusic();
        }
        async function prevTrack() {
            let prev = currentIndex - 1;
            if (prev < 0) prev = filteredPlaylist.length - 1;
            currentIndex = prev;
            loadTrackUI(currentIndex);
            if (isPlaying) await playMusic();
        }
        
        // ==================== GÊNERO MANUAL ====================
        function filterByGenre(genero) {
            if (isAoVivo) desativarModoAoVivo();
            isManualGenre = true;
            currentProgram = null;
            let novaPlaylist = musicas.filter(m => m.genero === genero);
            if (novaPlaylist.length === 0) novaPlaylist = musicas;
            filteredPlaylist = shuffleArray(novaPlaylist);
            currentIndex = 0;
            loadTrackUI(currentIndex);
            if (isPlaying) playMusic();
            if (VIDEO_POR_GENERO[genero]) trocarVideo(VIDEO_POR_GENERO[genero]);
            showNotification(`🎵 Gênero ${genero} selecionado!`);
        }
        
        // ==================== MODO TV ====================
        function toggleTvMode() {
            const app = document.querySelector('.app');
            const overlay = document.getElementById('tvPixOverlay');
            const exitBtn = document.getElementById('exitTvBtn');
            if (!isTvMode) {
                isTvMode = true;
                app.classList.add('tv-mode-active');
                overlay.classList.add('show');
                exitBtn.style.display = 'block';
                showNotification('📺 MODO TV ATIVADO!');
                bgVideo.src = "modop.mp4";
                bgVideo.load();
                bgVideo.play();
            } else {
                isTvMode = false;
                app.classList.remove('tv-mode-active');
                overlay.classList.remove('show');
                exitBtn.style.display = 'none';
                showNotification('Modo TV desativado');
                // restaurar vídeo anterior
                if (currentProgram) {
                    let prog = programas.find(p => p.nome === currentProgram);
                    if (prog) trocarVideo(prog.video);
                } else if (isManualGenre && VIDEO_POR_GENERO[filteredPlaylist[0]?.genero]) {
                    trocarVideo(VIDEO_POR_GENERO[filteredPlaylist[0].genero]);
                } else {
                    trocarVideo("pai.mp4");
                }
            }
        }
        
        // ==================== ÁUDIO DE FUNDO (autoplay) ====================
        function createSilentAudio() {
            const sampleRate = 44100, duration = 2;
            let buffer = new ArrayBuffer(44 + sampleRate * duration * 2);
            let view = new DataView(buffer);
            // cabeçalho wav simplificado
            return new Blob([buffer], { type: 'audio/wav' });
        }
        const bgAudio = document.getElementById('bgAudio');
        async function ativarAudioBackground() {
            try {
                let silent = URL.createObjectURL(createSilentAudio());
                bgAudio.src = silent;
                bgAudio.loop = true;
                bgAudio.volume = 0.001;
                await bgAudio.play();
                backgroundActive = true;
                audioIndicator.innerHTML = '🎧 Áudio OK';
                audioIndicator.style.color = '#4ade80';
                setInterval(() => {
                    if (bgAudio.paused && backgroundActive) bgAudio.play();
                    if (isPlaying && musicPlayer.paused && !musicPlayer.ended) musicPlayer.play();
                    if (musicPlayer.ended && isPlaying) nextTrack();
                }, 1000);
                return true;
            } catch(e) {
                audioIndicator.innerHTML = '❌ Erro';
                return false;
            }
        }
        
        // ==================== ROTAÇÃO DE VÍDEOS PADRÃO ====================
        let rotacaoInterval;
        function iniciarRotacao() {
            if (rotacaoInterval) clearInterval(rotacaoInterval);
            rotacaoInterval = setInterval(() => {
                if (!isTvMode && !isAoVivo && !currentProgram && !isManualGenre) {
                    videoRotacaoIndex = (videoRotacaoIndex + 1) % VIDEOS_ROTACAO.length;
                    trocarVideo(VIDEOS_ROTACAO[videoRotacaoIndex]);
                }
            }, 20000);
        }
        
        // ==================== ANÚNCIOS ====================
        let adVideoPlaying = false;
        function iniciarVideoAd() {
            if (!isAoVivo || isTvMode || adVideoPlaying) return;
            adVideoPlaying = true;
            let ad = document.getElementById('adVideo');
            let ov = document.getElementById('videoAdOverlay');
            ad.currentTime = 0;
            ov.style.display = 'block';
            ad.play().catch(e => { ov.style.display = 'none'; adVideoPlaying = false; });
            setTimeout(() => {
                if (adVideoPlaying) { ov.style.display = 'none'; ad.pause(); adVideoPlaying = false; }
            }, 8000);
        }
        let audioAdPlaying = false;
        function playAudioAd() { if (!isAoVivo) return; /* simplificado */ }
        
        // ==================== MENU ====================
        document.getElementById('menuBtn').onclick = e => {
            e.stopPropagation();
            document.getElementById('menuPopup').classList.toggle('open');
        };
        document.onclick = () => document.getElementById('menuPopup').classList.remove('open');
        document.getElementById('tvModeBtn').onclick = () => { toggleTvMode(); document.getElementById('menuPopup').classList.remove('open'); };
        document.getElementById('fullscreenBtn').onclick = () => { document.documentElement.requestFullscreen(); };
        document.getElementById('shareBtn').onclick = () => { navigator.share ? navigator.share({title:'Rádio Patico IA'}) : alert('Compartilhe o link'); };
        document.getElementById('statsBtn').onclick = () => showNotification('Estatísticas em breve');
        document.getElementById('manualBtn').onclick = () => showNotification('Manual: gestos, IA, programas');
        document.getElementById('feedbackBtn').onclick = () => window.open(`https://wa.me/5512988461978`, '_blank');
        
        // ==================== MODAL DE GÊNEROS ====================
        const generosLista = ["SERTANEJO", "FORRÓ", "SAMBA", "POP", "BREGA", "MPB", "VARIADAS", "TODOS", "LIVE"];
        const modal = document.getElementById('genresModal');
        function buildModal() {
            modal.innerHTML = `<div style="position:fixed; bottom:0; left:0; right:0; background:linear-gradient(135deg,#1a1a2e,#16213e); border-radius:30px 30px 0 0; padding:20px; text-align:center;"><h3 style="color:#e63946;">ESTILOS</h3><div style="display:grid; grid-template-columns:repeat(3,1fr); gap:10px;">`;
            generosLista.forEach(g => {
                modal.innerHTML += `<div class="genre-card" data-gen="${g}" style="background:linear-gradient(135deg,#ff0844,#ffb199); padding:10px; border-radius:14px; color:white; font-weight:bold; text-align:center; cursor:pointer;">${g}</div>`;
            });
            modal.innerHTML += `</div><button id="closeModal" style="margin-top:15px; background:#e63946; border:none; padding:10px; border-radius:20px; color:white; width:100%;">FECHAR</button></div>`;
            modal.style.display = 'none';
            document.querySelectorAll('.genre-card').forEach(card => {
                card.onclick = () => {
                    let gen = card.getAttribute('data-gen');
                    if (gen === 'LIVE') ativarModoAoVivo();
                    else if (gen === 'VARIADAS' || gen === 'TODOS') {
                        if (isAoVivo) desativarModoAoVivo();
                        isManualGenre = false;
                        currentProgram = null;
                        filteredPlaylist = shuffleArray(musicas);
                        currentIndex = 0;
                        loadTrackUI(currentIndex);
                        if (isPlaying) playMusic();
                        showNotification(`🎵 ${gen} ativado!`);
                    } else {
                        filterByGenre(gen);
                    }
                    modal.style.display = 'none';
                };
            });
            document.getElementById('closeModal').onclick = () => modal.style.display = 'none';
        }
        buildModal();
        document.getElementById('genreBtn').onclick = () => { modal.style.display = 'block'; };
        
        // ==================== INICIALIZAÇÃO ====================
        document.getElementById('tap-to-start').onclick = async () => {
            let ok = await ativarAudioBackground();
            if (ok) {
                document.getElementById('tap-to-start').style.display = 'none';
                ativarModoAoVivo();
                await playMusic();
                setInterval(() => aplicarProgramacao(), 60000);
                aplicarProgramacao(); // verifica já no início
                iniciarRotacao();
            } else {
                showNotification('Erro ao ativar áudio');
            }
        };
        
        playPauseBtn.onclick = togglePlayPause;
        prevBtn.onclick = prevTrack;
        nextBtn.onclick = nextTrack;
        shuffleBtn.onclick = () => { shuffleMode = !shuffleMode; showNotification(shuffleMode ? 'Aleatório ON' : 'Sequencial'); };
        likeBtn.onclick = likeSong;
        dislikeBtn.onclick = dislikeSong;
        document.getElementById('progressArea').onclick = (e) => {
            let rect = e.currentTarget.querySelector('.progress-bar').getBoundingClientRect();
            let percent = (e.clientX - rect.left) / rect.width;
            if (musicPlayer.duration) musicPlayer.currentTime = percent * musicPlayer.duration;
        };
        document.getElementById('pixKey').onclick = () => {
            navigator.clipboard.writeText("12988461978");
            showNotification('✅ Chave PIX copiada!');
        };
        document.getElementById('exitTvBtn').onclick = () => { if (isTvMode) toggleTvMode(); };
        
        // Gestos
        let touchStartX = 0, lastTap = 0;
        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            let now = Date.now();
            if (now - lastTap < 300) { e.preventDefault(); togglePlayPause(); showSwipe('⏯️'); }
            lastTap = now;
        });
        document.addEventListener('touchend', e => {
            let diff = e.changedTouches[0].screenX - touchStartX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) { prevTrack(); showSwipe('⏮️'); }
                else { nextTrack(); showSwipe('⏭️'); }
            }
        });
        function showSwipe(text) {
            let el = document.getElementById('swipeIndicator');
            el.textContent = text;
            el.style.opacity = '1';
            setTimeout(() => el.style.opacity = '0', 1000);
        }
        
        // Esconder controles inferiores após inatividade
        let hideTimeout;
        const controls = document.getElementById('controlsOverlay');
        function showControls() { controls.classList.remove('hide'); clearTimeout(hideTimeout); hideTimeout = setTimeout(() => controls.classList.add('hide'), 3000); }
        document.addEventListener('touchstart', showControls);
        document.addEventListener('click', showControls);
        showControls();
        
        // Iniciar visualizador
        initVisualizer();
        
        console.log("App iniciado. Programação automática ativa.");
    </script>
</body>
</html>
