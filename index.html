<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rádio Patico - Óticas São Miguel</title>
    <link rel="icon" type="image/png" href="falcon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="falcon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg-primary: #0a0a0f; --accent: #00f3ff; --secondary: #ff2d7f; }
        
        body { 
            min-height: 100vh; 
            background: var(--bg-primary); 
            overflow: hidden; 
            position: fixed; 
            width: 100%; 
            height: 100%; 
            font-family: 'Rajdhani', sans-serif;
        }
        
        #splash { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 9999; 
            transition: opacity 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1), visibility 0.8s; 
            overflow: hidden;
        }
        
        #splash-video { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 1; 
        }
        
        .splash-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.6); 
            z-index: 2; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-direction: column; 
        }
        
        .splash-content { 
            text-align: center; 
            z-index: 3; 
            animation: fadeInUp 1s ease-out;
            margin-bottom: 40px;
        }
        
        .splash-content h1 { 
            font-family: 'Orbitron', monospace; 
            font-size: 2.8rem; 
            letter-spacing: 4px; 
            background: linear-gradient(135deg, #fff, #00f3ff, #ff2d7f); 
            -webkit-background-clip: text; 
            background-clip: text; 
            color: transparent; 
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.5); 
            margin-bottom: 15px; 
            animation: glitch 3s infinite;
        }
        
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(40px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        @keyframes glitch { 
            0%, 100% { text-shadow: 2px 0 #ff2d7f, -2px 0 #00f3ff; } 
            25% { text-shadow: -2px 0 #ff2d7f, 2px 0 #00f3ff; } 
            50% { text-shadow: 2px 2px #ff2d7f, -2px -2px #00f3ff; } 
            75% { text-shadow: -2px -2px #ff2d7f, 2px 2px #00f3ff; } 
        }
        
        #splashStartBtn, #skipAdBtn {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Orbitron', monospace;
            font-weight: bold;
            border: none;
        }
        
        #splashStartBtn {
            bottom: 25%;
            background: linear-gradient(135deg, #00f3ff, #ff2d7f);
            color: #000;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 1.1rem;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.8);
            letter-spacing: 2px;
        }
        
        #skipAdBtn {
            bottom: 15%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            color: #00f3ff;
            border: 2px solid #00f3ff;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 0.8rem;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }
        
        #splashStartBtn:active, #skipAdBtn:active {
            transform: translateX(-50%) scale(0.95);
        }
        
        #splash.hidden { 
            opacity: 0; 
            visibility: hidden; 
            pointer-events: none; 
        }
        
        .app { 
            width: 100%; 
            height: 100vh; 
            background: var(--bg-primary); 
            position: relative; 
            overflow: hidden; 
            display: none; 
        }
        
        .tv-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
        }
        
        .tv-overlay.active {
            display: flex;
        }
        
        .tv-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        
        .tv-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            color: #00f3ff;
            border: 1px solid #00f3ff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 1001;
            transition: 0.1s;
        }
        
        .tv-close:active {
            transform: scale(0.9);
            background: #00f3ff;
            color: #000;
        }
        
        .fullscreen-video-container { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #000; 
            z-index: 1; 
            cursor: pointer; 
        }
        
        .fullscreen-video-container video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .info-area { 
            position: fixed; 
            bottom: 100px; 
            left: 0; 
            right: 0; 
            background: rgba(0, 0, 0, 0.7); 
            backdrop-filter: blur(10px);
            padding: 12px 20px; 
            z-index: 25; 
            text-align: center; 
            border-top: 1px solid rgba(0, 243, 255, 0.3); 
            border-bottom: 1px solid rgba(0, 243, 255, 0.3); 
        }
        
        .track-info { margin-bottom: 4px; }
        .marquee-wrap { width: 100%; overflow: hidden; white-space: nowrap; }
        .marquee-text { display: inline-block; animation: marquee 40s linear infinite; color: #00f3ff; font-weight: 700; font-size: 1rem; letter-spacing: 1px; text-shadow: 0 0 3px rgba(0,243,255,0.5); }
        
        .bottom-controls { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            background: rgba(0, 0, 0, 0.85); 
            backdrop-filter: blur(20px); 
            border-top: 1px solid rgba(0, 243, 255, 0.3); 
            padding: 10px 20px 20px; 
            z-index: 20; 
            transition: transform 0.3s ease, opacity 0.3s ease; 
            border-radius: 24px 24px 0 0; 
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5); 
        }
        
        .bottom-controls.hide-controls { transform: translateY(100%); opacity: 0; pointer-events: none; }
        .progress-area { margin-bottom: 10px; }
        .progress-time { display: flex; justify-content: space-between; font-size: 0.65rem; color: #aaa; }
        .progress-bar { height: 3px; background: rgba(255, 255, 255, 0.2); border-radius: 3px; cursor: pointer; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00f3ff, #ff2d7f); width: 0%; border-radius: 3px; }
        
        .control-buttons { display: flex; align-items: center; justify-content: center; gap: 20px; }
        .control-btn { background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); border: 1px solid rgba(0, 243, 255, 0.5); color: #00f3ff; font-size: 1.2rem; width: 52px; height: 52px; border-radius: 50%; cursor: pointer; transition: all 0.1s ease; display: flex; align-items: center; justify-content: center; }
        .control-btn:active { transform: scale(0.92); background: #00f3ff; color: #000; box-shadow: 0 0 15px #00f3ff; }
        .play-btn { width: 62px; height: 62px; background: linear-gradient(135deg, #00f3ff, #ff2d7f); color: #000; border: none; box-shadow: 0 0 15px rgba(0, 243, 255, 0.6); }
        
        .genre-badge { 
            position: absolute; 
            top: 16px; 
            left: 16px; 
            background: rgba(0, 0, 0, 0.7); 
            backdrop-filter: blur(12px); 
            padding: 5px 12px; 
            border-radius: 40px; 
            font-size: 0.65rem; 
            font-weight: bold; 
            color: #00f3ff; 
            z-index: 31; 
            border-left: 3px solid #00f3ff; 
            font-family: 'Orbitron', monospace; 
        }
        
        .menu-button { position: absolute; top: 16px; right: 16px; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px); color: #00f3ff; border: 1px solid #00f3ff; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; z-index: 31; transition: 0.2s, opacity 0.3s ease; }
        .menu-button:active { transform: scale(0.9); }
        .menu-button.hide-controls { opacity: 0; pointer-events: none; }
        
        .menu-popup { position: absolute; top: 70px; right: 16px; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(16px); border-radius: 20px; padding: 10px; z-index: 32; display: none; flex-direction: column; gap: 8px; border: 1px solid #00f3ff; box-shadow: 0 0 20px rgba(0, 243, 255, 0.3); }
        .menu-popup.open { display: flex; }
        .menu-popup button { background: rgba(255, 255, 255, 0.05); border: none; color: white; padding: 8px 12px; border-radius: 40px; font-size: 0.75rem; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.1s; font-family: 'Rajdhani', sans-serif; }
        .menu-popup button:active { background: #00f3ff; color: #000; transform: scale(0.96); }
        
        .genre-button { 
            position: fixed; 
            bottom: 160px; 
            right: 16px; 
            width: 48px; 
            height: 48px; 
            background: linear-gradient(135deg, #00f3ff, #ff2d7f); 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            z-index: 27; 
            border: none; 
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.7); 
            transition: 0.1s; 
        }
        .genre-button:active { transform: scale(0.9); }
        .genre-button i { font-size: 1.3rem; color: #000; }
        
        .volume-control { position: fixed; bottom: 160px; right: 80px; display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 30px; z-index: 27; backdrop-filter: blur(8px); transition: opacity 0.3s ease; }
        .volume-control i { color: #00f3ff; font-size: 0.8rem; }
        .volume-control input { width: 70px; height: 3px; -webkit-appearance: none; background: rgba(255,255,255,0.2); border-radius: 2px; outline: none; }
        .volume-control input::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; background: #00f3ff; border-radius: 50%; cursor: pointer; }
        
        .loading-spinner { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); padding: 10px 20px; border-radius: 50px; z-index: 10001; display: none; gap: 10px; color: #00f3ff; font-weight: bold; border: 1px solid #00f3ff; font-size: 0.8rem; }
        .loading-spinner.show { display: flex; }
        
        .notification-top { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); padding: 6px 16px; border-radius: 40px; color: #00f3ff; font-size: 0.75rem; z-index: 30; opacity: 0; transition: 0.2s; pointer-events: none; white-space: nowrap; border-left: 3px solid #00f3ff; }
        .notification-top.show { opacity: 1; }
        
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        
        .genres-modal { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            right: 0; 
            transform: translateY(100%); 
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1); 
            background: linear-gradient(135deg, #0a0a0f, #001a2a); 
            border-radius: 30px 30px 0 0; 
            padding: 15px; 
            z-index: 5000; 
            border-top: 2px solid #00f3ff; 
        }
        .genres-modal.open { transform: translateY(0); }
        .genres-modal h3 { color: #00f3ff; text-align: center; font-family: 'Orbitron', monospace; margin-bottom: 12px; font-size: 0.9rem; }
        .genres-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
        .genre-card { background: rgba(0, 243, 255, 0.15); border-radius: 12px; padding: 10px 2px; text-align: center; cursor: pointer; transition: 0.1s; border: 1px solid rgba(0, 243, 255, 0.4); }
        .genre-card:active { transform: scale(0.96); background: rgba(0, 243, 255, 0.4); }
        .genre-card i { font-size: 1.3rem; color: #00f3ff; display: block; margin-bottom: 5px; }
        .genre-card span { font-size: 0.65rem; font-weight: bold; color: white; }
        .close-genres { background: #00f3ff; border: none; padding: 8px; border-radius: 40px; font-weight: bold; cursor: pointer; margin-top: 12px; width: 100%; color: #000; font-size: 0.85rem; }
    </style>
</head>
<body>

<div id="splash">
    <video id="splash-video" autoplay loop muted playsinline>
        <source src="abertura.mp4" type="video/mp4">
    </video>
    <div class="splash-overlay">
        <div class="splash-content">
            <h1>RÁDIO PATICO</h1>
        </div>
        <button id="splashStartBtn">▶ ATIVAR ÁUDIO</button>
        <button id="skipAdBtn">⏩ PULAR</button>
    </div>
</div>

<!-- MODO TV -->
<div id="tvOverlay" class="tv-overlay">
    <button class="tv-close" id="tvCloseBtn"><i class="fas fa-times"></i></button>
    <video id="tvVideo" class="tv-video" autoplay loop muted playsinline>
        <source src="tv.mp4" type="video/mp4">
    </video>
    <div class="tv-text" style="position: absolute; bottom: 50px; left: 0; right: 0; text-align: center; color: white; background: rgba(0,0,0,0.6); padding: 10px;">🎬 MODO TV - Clique no X para sair</div>
</div>

<div class="app" id="appRoot">
    <div class="fullscreen-video-container" id="videoContainer">
        <video id="mainVideo" autoplay loop muted playsinline>
            <source src="pak1.mp4" type="video/mp4">
        </video>
    </div>
    
    <div class="info-area">
        <div class="track-info">
            <div class="marquee-wrap">
                <span class="marquee-text" id="trackMarquee">🎵 RÁDIO PATICO - LUIS GOMES RN | MPB • POP • AO VIVO • TODOS | O MELHOR DA MÚSICA BRASILEIRA | 📻 24h NO AR</span>
            </div>
        </div>
    </div>
    
    <div class="bottom-controls" id="bottomControls">
        <div class="progress-area">
            <div class="progress-time"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
            <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        </div>
        <div class="control-buttons">
            <button class="control-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
            <button class="control-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
            <button class="control-btn" id="shuffleBtn"><i class="fas fa-random"></i></button>
            <button class="control-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
        </div>
    </div>
    
    <button class="genre-button" id="genreButton"><i class="fas fa-music"></i></button>
    
    <div class="genre-badge" id="genreBadge"><i class="fas fa-music"></i> TODOS</div>
    
    <div class="menu-button" id="menuButton"><i class="fas fa-bolt"></i></div>
    <div class="menu-popup" id="menuPopup">
        <button id="tvMenuBtn"><i class="fas fa-tv"></i> Modo TV</button>
        <button id="fullscreenMenuBtn"><i class="fas fa-expand"></i> Tela cheia</button>
        <button id="shareMenuBtn"><i class="fas fa-share-alt"></i> Compartilhar</button>
        <button id="bluetoothMenuBtn"><i class="fab fa-bluetooth-b"></i> Bluetooth</button>
    </div>
</div>

<div class="volume-control" id="volumeControl">
    <i class="fas fa-volume-up"></i>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.9">
</div>

<div id="notificationTop" class="notification-top"></div>
<div class="loading-spinner" id="loadingSpinner"><i class="fas fa-circle-notch fa-spin"></i><span>Carregando...</span></div>

<div class="genres-modal" id="genresModal">
    <h3><i class="fas fa-headphones"></i> SELECIONE O GÊNERO</h3>
    <div class="genres-grid">
        <div class="genre-card" data-genero="MPB">
            <i class="fas fa-guitar"></i>
            <span>MPB</span>
        </div>
        <div class="genre-card" data-genero="POP">
            <i class="fas fa-microphone-alt"></i>
            <span>POP</span>
        </div>
        <div class="genre-card" data-genero="AO VIVO">
            <i class="fas fa-broadcast-tower"></i>
            <span>AO VIVO</span>
        </div>
        <div class="genre-card" data-genero="TODOS">
            <i class="fas fa-random"></i>
            <span>TODOS</span>
        </div>
    </div>
    <button class="close-genres" id="closeGenresBtn">FECHAR</button>
</div>

<audio id="musicPlayer" preload="auto" crossorigin></audio>

<script>
    // ==================== CONFIGURAÇÕES ====================
    const CONFIG = {
        VOLUME_PLAYER: 0.9,
        VIDEO_MIGUEL: 'miguel.mp4',
        VIDEO_TV: 'tv.mp4',
        SITE_MIGUEL: 'https://oticassaomiguel.com.br/',
        ANUNCIO_INICIAL: 'o.mp3',
        PLAYLIST_URL: 'https://raw.githubusercontent.com/radioplaylist12/partico/main/playlist.json',
        TIMEOUT_CARREGAMENTO_MUSICA: 8000
    };

    let PLAYLIST = [];

    // ==================== ESTADO ====================
    const state = {
        isPlaying: false,
        generoAtual: 'TODOS',
        currentIndex: 0,
        filteredPlaylist: [],
        isLoadingTrack: false,
        controlsVisible: true,
        audioContext: null,
        progressRAF: null,
        controlsTimer: null,
        lastClickTime: 0,
        isMiguelVideoActive: false,
        miguelVideoTimeout: null,
        isTvMode: false,
        verificadorTravamento: null,
        tempoAnterior: 0,
        musicaIniciouEm: 0
    };

    // ==================== DOM ELEMENTS ====================
    const dom = {
        musicPlayer: document.getElementById('musicPlayer'),
        playBtn: document.getElementById('playPauseBtn'),
        prevBtn: document.getElementById('prevBtn'),
        nextBtn: document.getElementById('nextBtn'),
        shuffleBtn: document.getElementById('shuffleBtn'),
        progressFill: document.getElementById('progressFill'),
        currentTimeEl: document.getElementById('currentTime'),
        totalTimeEl: document.getElementById('totalTime'),
        trackMarquee: document.getElementById('trackMarquee'),
        splash: document.getElementById('splash'),
        appRoot: document.getElementById('appRoot'),
        loadingSpinner: document.getElementById('loadingSpinner'),
        genreBadge: document.getElementById('genreBadge'),
        bottomControls: document.getElementById('bottomControls'),
        genreButton: document.getElementById('genreButton'),
        menuButton: document.getElementById('menuButton'),
        menuPopup: document.getElementById('menuPopup'),
        mainVideo: document.getElementById('mainVideo'),
        videoContainer: document.getElementById('videoContainer'),
        volumeSlider: document.getElementById('volumeSlider'),
        tvOverlay: document.getElementById('tvOverlay'),
        tvVideo: document.getElementById('tvVideo'),
        tvCloseBtn: document.getElementById('tvCloseBtn')
    };

    // ==================== FUNÇÕES AUXILIARES ====================
    function mostrarNotificacao(msg, dur = 1500) {
        const n = document.getElementById('notificationTop');
        if (n) { n.textContent = msg; n.classList.add('show'); setTimeout(() => n.classList.remove('show'), dur); }
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ==================== VERIFICADOR DE TRAVAMENTO ====================
    function iniciarVerificadorTravamento() {
        if (state.verificadorTravamento) clearInterval(state.verificadorTravamento);
        
        state.verificadorTravamento = setInterval(() => {
            if (!state.isPlaying || state.isLoadingTrack || state.isTvMode) return;
            
            const tempoAtual = dom.musicPlayer.currentTime;
            const duracao = dom.musicPlayer.duration;
            
            // Se está no final (menos de 0.5 segundos)
            if (duracao > 0 && tempoAtual > 0 && (duracao - tempoAtual) < 0.5) {
                console.log("🎵 Música no final, próxima...");
                PlayerEngine.next();
                return;
            }
            
            // Se travou (tempo não mudou por mais de 5 segundos)
            if (state.tempoAnterior === tempoAtual && tempoAtual > 0) {
                const tempoTravado = Date.now() - state.musicaIniciouEm;
                if (tempoTravado > 5000 && tempoTravado < (duracao * 1000 - 1000)) {
                    console.log("⚠️ Música travada, pulando...");
                    PlayerEngine.next();
                    return;
                }
            }
            
            state.tempoAnterior = tempoAtual;
        }, 2000);
    }

    // ==================== CARREGAR PLAYLIST ====================
    async function carregarPlaylist() {
        const cached = localStorage.getItem('playlist_cache');
        const cacheTime = localStorage.getItem('playlist_cache_time');

        if (cached && cacheTime && (Date.now() - parseInt(cacheTime) < 3600000)) {
            PLAYLIST = JSON.parse(cached);
            PLAYLIST = PLAYLIST.map((m, idx) => { if (!m.id) m.id = idx; return m; });
            return;
        }

        try {
            const resp = await fetch(CONFIG.PLAYLIST_URL);
            if (!resp.ok) throw new Error();
            PLAYLIST = await resp.json();
            PLAYLIST = PLAYLIST.map((m, idx) => { if (!m.id) m.id = idx; return m; });
            localStorage.setItem('playlist_cache', JSON.stringify(PLAYLIST));
            localStorage.setItem('playlist_cache_time', Date.now().toString());
        } catch (e) {
            console.error("Erro ao carregar playlist", e);
            if (cached) {
                PLAYLIST = JSON.parse(cached);
            } else {
                PLAYLIST = [
                    { id: 0, title: "Trem Bala", artist: "Ana Vilela", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", genero: "MPB" },
                    { id: 1, title: "Garota de Ipanema", artist: "Tom Jobim", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", genero: "MPB" },
                    { id: 2, title: "Construção", artist: "Chico Buarque", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", genero: "MPB" },
                    { id: 3, title: "Blinding Lights", artist: "The Weeknd", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", genero: "POP" },
                    { id: 4, title: "Shape of You", artist: "Ed Sheeran", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3", genero: "POP" },
                    { id: 5, title: "Levitating", artist: "Dua Lipa", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3", genero: "POP" },
                    { id: 6, title: "Ao Vivo - Acústico", artist: "Banda XYZ", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3", genero: "AO VIVO" },
                    { id: 7, title: "Ao Vivo - Show", artist: "Artista ABC", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3", genero: "AO VIVO" }
                ];
            }
            mostrarNotificacao("⚠️ Fallback", 2000);
        }
    }

    // ==================== FILTRAR POR GÊNERO ====================
    function filtrarPlaylistPorGenero(genero) {
        if (genero === 'TODOS') {
            return shuffleArray([...PLAYLIST]);
        }
        const filtrada = PLAYLIST.filter(m => m.genero === genero);
        if (filtrada.length === 0) return shuffleArray([...PLAYLIST]);
        return shuffleArray(filtrada);
    }

    // ==================== VIDEO MIGUEL ====================
    function ativarVideoMiguel() {
        if (state.isMiguelVideoActive) return;
        state.isMiguelVideoActive = true;
        dom.mainVideo.pause();
        dom.mainVideo.src = CONFIG.VIDEO_MIGUEL;
        dom.mainVideo.load();
        dom.mainVideo.play().catch(e => console.warn);
        if (state.miguelVideoTimeout) clearTimeout(state.miguelVideoTimeout);
        state.miguelVideoTimeout = setTimeout(() => desativarVideoMiguel(), 30000);
    }

    function desativarVideoMiguel() {
        if (!state.isMiguelVideoActive) return;
        state.isMiguelVideoActive = false;
        dom.mainVideo.pause();
        dom.mainVideo.src = 'pak1.mp4';
        dom.mainVideo.load();
        dom.mainVideo.play().catch(e => console.warn);
    }

    // ==================== MODO TV ====================
    function ativarModoTv() {
        state.isTvMode = true;
        dom.tvOverlay.classList.add('active');
        dom.tvVideo.play().catch(e => console.log);
        mostrarNotificacao("📺 MODO TV", 1000);
    }

    function desativarModoTv() {
        state.isTvMode = false;
        dom.tvOverlay.classList.remove('active');
        dom.tvVideo.pause();
        dom.tvVideo.currentTime = 0;
        mostrarNotificacao("🎵 Voltei", 1000);
    }

    // ==================== PLAYER ENGINE ====================
    const PlayerEngine = {
        formatTime(sec) { if (isNaN(sec)) return '0:00'; const m = Math.floor(sec / 60); const s = Math.floor(sec % 60); return `${m}:${s < 10 ? '0' : ''}${s}`; },

        async play() {
            if (state.isLoadingTrack || state.isTvMode) return;
            
            if (!state.filteredPlaylist.length) {
                state.filteredPlaylist = filtrarPlaylistPorGenero(state.generoAtual);
                if (!state.filteredPlaylist.length) return false;
            }
            
            const track = state.filteredPlaylist[state.currentIndex];
            if (!track || !track.src) { this.next(); return false; }

            state.isLoadingTrack = true;
            dom.loadingSpinner.classList.add('show');
            dom.musicPlayer.pause();
            dom.musicPlayer.src = track.src;
            dom.musicPlayer.load();

            dom.trackMarquee.innerHTML = `<span class="marquee-text">🎵 ${track.title} - ${track.artist} [${track.genero}] | RÁDIO PATICO</span>`;
            dom.currentTimeEl.textContent = '0:00';
            dom.totalTimeEl.textContent = '0:00';
            dom.progressFill.style.width = '0%';

            let musicLoaded = false;

            return new Promise((resolve) => {
                let timeout = setTimeout(() => {
                    if (!musicLoaded) {
                        dom.loadingSpinner.classList.remove('show');
                        state.isLoadingTrack = false;
                        this.next();
                        resolve(false);
                    }
                }, CONFIG.TIMEOUT_CARREGAMENTO_MUSICA);

                dom.musicPlayer.oncanplaythrough = async () => {
                    if (musicLoaded) return;
                    musicLoaded = true;
                    clearTimeout(timeout);
                    dom.loadingSpinner.classList.remove('show');
                    state.isLoadingTrack = false;
                    
                    try {
                        if (state.audioContext && state.audioContext.state === 'suspended') {
                            await state.audioContext.resume();
                        }
                        await dom.musicPlayer.play();
                        state.isPlaying = true;
                        state.musicaIniciouEm = Date.now();
                        state.tempoAnterior = 0;
                        dom.playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        this.startProgressTimer();

                        dom.musicPlayer.onended = () => {
                            setTimeout(() => this.next(), 100);
                        };

                        iniciarVerificadorTravamento();
                        showControls();
                        resolve(true);
                    } catch (e) {
                        dom.loadingSpinner.classList.remove('show');
                        state.isLoadingTrack = false;
                        dom.playBtn.innerHTML = '<i class="fas fa-play"></i>';
                        resolve(false);
                    }
                };
                dom.musicPlayer.onerror = () => {
                    if (musicLoaded) return;
                    musicLoaded = true;
                    clearTimeout(timeout);
                    dom.loadingSpinner.classList.remove('show');
                    state.isLoadingTrack = false;
                    setTimeout(() => this.next(), 500);
                    resolve(false);
                };
            });
        },

        next() {
            if (state.isTvMode) return;
            if (Date.now() - state.lastClickTime < 500) return;
            state.lastClickTime = Date.now();
            if (state.isLoadingTrack) return;
            if (state.progressRAF) cancelAnimationFrame(state.progressRAF);
            
            let nextIndex = state.currentIndex + 1;
            if (nextIndex >= state.filteredPlaylist.length) nextIndex = 0;
            state.currentIndex = nextIndex;
            this.play();
        },

        prev() {
            if (state.isTvMode) return;
            if (Date.now() - state.lastClickTime < 500) return;
            state.lastClickTime = Date.now();
            if (state.isLoadingTrack) return;
            if (state.progressRAF) cancelAnimationFrame(state.progressRAF);
            
            let prevIndex = state.currentIndex - 1;
            if (prevIndex < 0) prevIndex = state.filteredPlaylist.length - 1;
            state.currentIndex = prevIndex;
            this.play();
        },

        pause() {
            dom.musicPlayer.pause();
            state.isPlaying = false;
            dom.playBtn.innerHTML = '<i class="fas fa-play"></i>';
            if (state.progressRAF) cancelAnimationFrame(state.progressRAF);
        },

        togglePlayPause() { if (!state.isTvMode) state.isPlaying ? this.pause() : this.play(); },

        startProgressTimer() {
            if (state.progressRAF) cancelAnimationFrame(state.progressRAF);
            const update = () => {
                if (state.isPlaying && dom.musicPlayer.duration && !dom.musicPlayer.paused) {
                    const percent = (dom.musicPlayer.currentTime / dom.musicPlayer.duration) * 100;
                    dom.progressFill.style.width = percent + '%';
                    dom.currentTimeEl.textContent = this.formatTime(dom.musicPlayer.currentTime);
                    dom.totalTimeEl.textContent = this.formatTime(dom.musicPlayer.duration);
                }
                state.progressRAF = requestAnimationFrame(update);
            };
            state.progressRAF = requestAnimationFrame(update);
        },

        mudarGenero(genero) {
            state.generoAtual = genero;
            state.filteredPlaylist = filtrarPlaylistPorGenero(genero);
            state.currentIndex = 0;
            if (genero === 'TODOS') {
                dom.genreBadge.innerHTML = '<i class="fas fa-random"></i> TODOS';
            } else {
                dom.genreBadge.innerHTML = `<i class="fas fa-music"></i> ${genero}`;
            }
            mostrarNotificacao(`🎵 ${genero}`, 1000);
            if (state.isPlaying) this.play();
        }
    };

    // ==================== CONTROLES ====================
    function hideControls() {
        if (state.isTvMode) return;
        dom.bottomControls.classList.add('hide-controls');
        dom.genreButton.classList.add('hide-controls');
        dom.menuButton.classList.add('hide-controls');
        document.getElementById('volumeControl').style.opacity = '0';
        state.controlsVisible = false;
    }

    function showControls() {
        if (state.isTvMode) return;
        dom.bottomControls.classList.remove('hide-controls');
        dom.genreButton.classList.remove('hide-controls');
        dom.menuButton.classList.remove('hide-controls');
        document.getElementById('volumeControl').style.opacity = '1';
        state.controlsVisible = true;
        if (state.controlsTimer) clearTimeout(state.controlsTimer);
        state.controlsTimer = setTimeout(() => {
            if (state.isPlaying && !state.isLoadingTrack && !state.isTvMode) hideControls();
        }, 3000);
    }

    // ==================== PAGE VISIBILITY ====================
    let musicaEstavaTocando = false;
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) { musicaEstavaTocando = state.isPlaying; }
        else if (musicaEstavaTocando && !state.isPlaying && !state.isLoadingTrack && !state.isTvMode) {
            setTimeout(() => { if (dom.musicPlayer.paused) PlayerEngine.play(); else if (dom.musicPlayer.ended) PlayerEngine.next(); }, 500);
        }
    });

    // ==================== EVENTOS ====================
    function abrirCompartilhar() {
        if (navigator.share) {
            navigator.share({ title: 'Rádio Patico', text: '🎵 MPB • POP • AO VIVO', url: window.location.href });
        } else {
            navigator.clipboard.writeText(window.location.href);
            mostrarNotificacao("Link copiado!", 1000);
        }
    }

    async function conectarBluetooth() {
        mostrarNotificacao("🔵 Procurando...", 1200);
        if ('bluetooth' in navigator) {
            try { await navigator.bluetooth.requestDevice({ acceptAllDevices: true }); mostrarNotificacao("✅ Conectado", 2000); } 
            catch(e) { mostrarNotificacao("❌ Cancelado", 1200); }
        } else { mostrarNotificacao("⚠️ Chrome/Edge", 1500); }
    }

    let radioStarted = false, anuncio = null, anuncioTimeout = null;

    function iniciarRadio() {
        if (radioStarted) return;
        if (anuncio) { anuncio.pause(); if (anuncioTimeout) clearTimeout(anuncioTimeout); }
        radioStarted = true;
        dom.splash.classList.add('hidden');
        setTimeout(() => dom.splash.style.display = 'none', 800);
        dom.appRoot.style.display = 'block';
        document.documentElement.requestFullscreen();
        PlayerEngine.mudarGenero('TODOS');
        dom.videoContainer.addEventListener('click', () => {
            if (state.isMiguelVideoActive) window.open(CONFIG.SITE_MIGUEL, '_blank');
            else ativarVideoMiguel();
        });
        PlayerEngine.play();
        showControls();
    }

    async function tocarAnuncio() {
        if (radioStarted) return;
        dom.splash.classList.add('hidden');
        setTimeout(() => dom.splash.style.display = 'none', 800);
        dom.appRoot.style.display = 'block';
        document.documentElement.requestFullscreen();
        anuncio = new Audio(CONFIG.ANUNCIO_INICIAL);
        anuncio.volume = CONFIG.VOLUME_PLAYER;
        anuncioTimeout = setTimeout(() => { if (anuncio && !radioStarted) { anuncio.pause(); iniciarRadio(); } }, 8000);
        anuncio.play().catch(() => {});
        anuncio.onended = () => { clearTimeout(anuncioTimeout); iniciarRadio(); };
    }

    function setupEventListeners() {
        document.getElementById('splashStartBtn')?.addEventListener('click', tocarAnuncio);
        document.getElementById('skipAdBtn')?.addEventListener('click', iniciarRadio);
        dom.playBtn?.addEventListener('click', () => PlayerEngine.togglePlayPause());
        dom.prevBtn?.addEventListener('click', () => PlayerEngine.prev());
        dom.nextBtn?.addEventListener('click', () => PlayerEngine.next());
        dom.shuffleBtn?.addEventListener('click', () => { state.filteredPlaylist = shuffleArray(state.filteredPlaylist); state.currentIndex = 0; if (state.isPlaying) PlayerEngine.play(); mostrarNotificacao('🔀 Aleatório', 800); });
        document.getElementById('progressBar')?.addEventListener('click', e => { if (dom.musicPlayer.duration) { const rect = e.currentTarget.getBoundingClientRect(); dom.musicPlayer.currentTime = ((e.clientX - rect.left) / rect.width) * dom.musicPlayer.duration; } });
        dom.genreButton?.addEventListener('click', () => { if (!state.isTvMode) document.getElementById('genresModal').classList.add('open'); });
        document.querySelectorAll('.genre-card').forEach(card => { card.addEventListener('click', () => { PlayerEngine.mudarGenero(card.getAttribute('data-genero')); document.getElementById('genresModal').classList.remove('open'); }); });
        document.getElementById('closeGenresBtn')?.addEventListener('click', () => document.getElementById('genresModal').classList.remove('open'));
        dom.menuButton?.addEventListener('click', (e) => { e.stopPropagation(); dom.menuPopup.classList.toggle('open'); });
        document.addEventListener('click', (e) => { if (!dom.menuButton?.contains(e.target) && !dom.menuPopup?.contains(e.target)) dom.menuPopup?.classList.remove('open'); });
        document.getElementById('tvMenuBtn')?.addEventListener('click', () => { ativarModoTv(); dom.menuPopup.classList.remove('open'); });
        document.getElementById('fullscreenMenuBtn')?.addEventListener('click', () => { document.documentElement.requestFullscreen(); dom.menuPopup.classList.remove('open'); });
        document.getElementById('shareMenuBtn')?.addEventListener('click', () => { abrirCompartilhar(); dom.menuPopup.classList.remove('open'); });
        document.getElementById('bluetoothMenuBtn')?.addEventListener('click', () => { conectarBluetooth(); dom.menuPopup.classList.remove('open'); });
        dom.tvCloseBtn?.addEventListener('click', () => desativarModoTv());
        dom.volumeSlider?.addEventListener('input', (e) => { dom.musicPlayer.volume = parseFloat(e.target.value); localStorage.setItem('radio_volume', e.target.value); });
        const savedVolume = localStorage.getItem('radio_volume');
        if (savedVolume) { dom.musicPlayer.volume = parseFloat(savedVolume); dom.volumeSlider.value = savedVolume; }

        dom.appRoot?.addEventListener('click', (e) => {
            if (state.isTvMode) return;
            if (e.target.closest('.control-btn') || e.target.closest('.genre-button') || e.target.closest('.menu-button')) { showControls(); return; }
            dom.bottomControls.classList.contains('hide-controls') ? showControls() : hideControls();
        });

        let touchStart = 0;
        dom.appRoot?.addEventListener('touchstart', (e) => { if (!state.isTvMode) touchStart = e.changedTouches[0].screenX; });
        dom.appRoot?.addEventListener('touchend', (e) => {
            if (state.isTvMode) return;
            const diff = e.changedTouches[0].screenX - touchStart;
            if (Math.abs(diff) > 60) diff > 0 ? PlayerEngine.prev() : PlayerEngine.next();
        });
    }

    // ==================== INIT ====================
    async function init() {
        await carregarPlaylist();
        dom.musicPlayer.volume = CONFIG.VOLUME_PLAYER;
        setupEventListeners();
        state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        document.body.addEventListener('touchstart', () => { if (state.audioContext?.state === 'suspended') state.audioContext.resume(); }, { once: true });
    }
    init();
    console.log('🚀 Rádio Patico - MPB • POP • AO VIVO • TODOS | Verificador ativo | Modo TV OK');
</script>
</body>
