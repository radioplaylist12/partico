<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rádio Patico • Sertanejo • Forró Antigo • Brega • MPB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: #000;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.55) saturate(1.1);
        }

        .app {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%);
        }

        /* TOP BAR */
        .top-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .genre-tag {
            background: rgba(230,57,70,0.9);
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: bold;
            color: white;
        }

        .bluetooth-status {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.6rem;
            color: #ddd;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .bluetooth-status.connected { color: #4ade80; }

        /* MENU 3 PONTOS */
        .menu-dots { position: relative; }
        .dots-btn {
            background: rgba(0,0,0,0.6);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
        }
        .dots-menu {
            position: absolute;
            top: 45px;
            right: 0;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 8px 0;
            width: 170px;
            display: none;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .dots-menu.open { display: flex; }
        .menu-item {
            padding: 10px 16px;
            color: white;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .menu-item:active { background: #e63946; color: #000; }

        /* CARD DA MÚSICA - COMPACTO */
        .music-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .track-info-compact {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 50px;
            border-left: 3px solid #e63946;
            max-width: 90%;
            text-align: center;
        }

        .track-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.75rem;
            color: #ccc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* BOTÃO FEEDBACK */
        .feedback-zap-btn {
            margin-top: 20px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 0.75rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .feedback-zap-btn:active { transform: scale(0.96); }

        /* CONTROLES INFERIORES */
        .bottom-panel {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.15);
            padding: 12px 20px 22px;
            border-radius: 25px 25px 0 0;
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            color: #bbb;
            margin-bottom: 4px;
        }
        .progress-bar-bg {
            height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            cursor: pointer;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: #e63946;
            border-radius: 3px;
        }

        .control-buttons {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-top: 10px;
        }
        .ctrl {
            background: rgba(255,255,255,0.12);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .ctrl:active { transform: scale(0.92); background: #e63946; color: #000; }
        .play-large { background: #e63946; width: 60px; height: 60px; font-size: 1.5rem; color: #000; }

        /* SELETOR DE GÊNERO MINI */
        .genre-selector {
            position: fixed;
            bottom: 100px;
            right: 12px;
            z-index: 35;
        }
        .genre-trigger {
            background: linear-gradient(135deg, #1e1e2f, #2a2a3b);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            font-size: 1.2rem;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .genre-mini-panel {
            position: absolute;
            bottom: 55px;
            right: 0;
            background: rgba(10,10,20,0.97);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 10px;
            width: 190px;
            display: none;
            flex-direction: column;
            gap: 6px;
        }
        .genre-mini-panel.open { display: flex; }
        .genre-option {
            background: rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 7px 10px;
            font-size: 0.75rem;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .genre-option:active { background: #e63946; color: #000; }

        .whatsapp-fixed {
            position: fixed;
            bottom: 100px;
            left: 12px;
            background: #25D366;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.4rem;
            color: white;
            z-index: 35;
        }

        .toast-msg {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            padding: 6px 16px;
            border-radius: 40px;
            color: white;
            font-size: 0.7rem;
            z-index: 200;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            white-space: nowrap;
        }

        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000000cc;
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 40px;
            color: white;
            display: none;
            gap: 10px;
            z-index: 300;
            font-size: 0.8rem;
        }

        #splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            flex-direction: column;
            text-align: center;
            color: white;
        }
        .splash-content i { font-size: 3rem; color: #e63946; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; } }
        .error-retry { margin-top: 20px; background: #e63946; border: none; padding: 8px 18px; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; }

        .swipe-hint {
            position: fixed;
            bottom: 170px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.6rem;
            color: white;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<video id="bgVideo" class="video-bg" autoplay loop muted playsinline>
    <source src="pak1.mp4" type="video/mp4">
</video>

<div id="splash">
    <div class="splash-content">
        <i class="fas fa-broadcast-tower"></i>
        <h2>Rádio Patico</h2>
        <p id="splashText">Carregando playlist...</p>
        <div id="splashStatus"><i class="fas fa-circle-notch fa-spin"></i> Conectando</div>
    </div>
</div>

<div class="app" id="app" style="display: none;">
    <div class="top-info">
        <div class="genre-tag" id="genreTag"><i class="fas fa-music"></i> CARREGANDO</div>
        <div style="display: flex; gap: 8px;">
            <div class="bluetooth-status" id="bluetoothStatus"><i class="fab fa-bluetooth-b"></i> <span id="btText">--</span></div>
            <div class="menu-dots">
                <div class="dots-btn" id="dotsBtn"><i class="fas fa-ellipsis-v"></i></div>
                <div class="dots-menu" id="dotsMenu">
                    <div class="menu-item" id="fullscreenMenuItem"><i class="fas fa-expand"></i> Tela cheia</div>
                    <div class="menu-item" id="shareMenuItem"><i class="fas fa-share-alt"></i> Compartilhar</div>
                    <div class="menu-item" id="bluetoothMenuItem"><i class="fab fa-bluetooth"></i> Status Bluetooth</div>
                </div>
            </div>
        </div>
    </div>

    <div class="music-card">
        <div class="track-info-compact">
            <div class="track-title" id="trackTitle">🎵 Aguardando...</div>
            <div class="track-artist" id="trackArtist">Rádio Patico</div>
        </div>
        <button class="feedback-zap-btn" id="feedbackZapBtn">
            <i class="fab fa-whatsapp"></i> Enviar feedback
        </button>
    </div>

    <div class="bottom-panel">
        <div class="progress-time"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
        <div class="progress-bar-bg" id="progressBarBg"><div class="progress-fill" id="progressFill"></div></div>
        <div class="control-buttons">
            <button class="ctrl" id="prevBtn"><i class="fas fa-backward-step"></i></button>
            <button class="ctrl play-large" id="playBtn"><i class="fas fa-play"></i></button>
            <button class="ctrl" id="nextBtn"><i class="fas fa-forward-step"></i></button>
        </div>
    </div>

    <div class="genre-selector">
        <div class="genre-trigger" id="genreTriggerBtn"><i class="fas fa-guitar"></i></div>
        <div class="genre-mini-panel" id="genrePanel">
            <div class="genre-option" data-genre="MPB"><i class="fas fa-guitar"></i> MPB</div>
            <div class="genre-option" data-genre="MODÃO_TOP"><i class="fas fa-hat-cowboy"></i> Sertanejo</div>
            <div class="genre-option" data-genre="FORRÓ_ANTIGO"><i class="fas fa-accordion"></i> Forró Antigo</div>
            <div class="genre-option" data-genre="BREGA"><i class="fas fa-heart"></i> Brega</div>
            <div class="genre-option" data-genre="SAMBA"><i class="fas fa-drumstick-bite"></i> Samba</div>
            <div class="genre-option" data-genre="POP"><i class="fas fa-microphone-alt"></i> Pop</div>
        </div>
    </div>

    <div class="whatsapp-fixed" id="whatsappBtn">
        <i class="fab fa-whatsapp"></i>
    </div>
    <div class="swipe-hint" id="swipeHint">👆 Duplo toque = Play/Pause | 👉 Deslize = trocar música</div>
</div>

<div class="loading-spinner" id="loader"><i class="fas fa-circle-notch fa-spin"></i><span>Carregando música...</span></div>
<div class="toast-msg" id="toastMsg"></div>
<audio id="player" preload="auto"></audio>

<script>
    const PLAYLIST_URL = "https://raw.githubusercontent.com/radioplaylist12/partico/4146336c11162317c986d6ae73cfad4381330e45/playlist.json";
    const WHATSAPP_NUMBER = "5512988461978";
    
    let musicLibrary = [];
    let currentPlaylist = [];
    let currentIndex = 0;
    let isPlaying = false;
    let currentGenre = "MPB";
    let genreAlternateTimer = null;
    let player = document.getElementById("player");
    let progressInterval = null;

    // Elementos
    const appDiv = document.getElementById("app");
    const splashDiv = document.getElementById("splash");
    const splashStatus = document.getElementById("splashStatus");
    const splashText = document.getElementById("splashText");
    const trackTitleSpan = document.getElementById("trackTitle");
    const trackArtistSpan = document.getElementById("trackArtist");
    const genreTagDiv = document.getElementById("genreTag");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const progressFill = document.getElementById("progressFill");
    const currentTimeSpan = document.getElementById("currentTime");
    const totalTimeSpan = document.getElementById("totalTime");
    const progressBg = document.getElementById("progressBarBg");
    const loaderDiv = document.getElementById("loader");
    const toastMsg = document.getElementById("toastMsg");
    const btStatusSpan = document.getElementById("btText");
    const bluetoothDiv = document.getElementById("bluetoothStatus");
    const swipeHint = document.getElementById("swipeHint");

    function formatTime(sec) {
        if (isNaN(sec) || !sec) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function showToast(text, duration = 1500) {
        toastMsg.innerText = text;
        toastMsg.style.opacity = "1";
        setTimeout(() => toastMsg.style.opacity = "0", duration);
    }

    // Bluetooth
    async function checkBluetooth() {
        try {
            if (navigator.bluetooth && navigator.bluetooth.getAvailability) {
                const avail = await navigator.bluetooth.getAvailability();
                if (avail) {
                    btStatusSpan.innerText = "Conectado";
                    bluetoothDiv.classList.add("connected");
                } else {
                    btStatusSpan.innerText = "Offline";
                    bluetoothDiv.classList.remove("connected");
                }
            } else {
                btStatusSpan.innerText = "N/D";
            }
        } catch(e) { btStatusSpan.innerText = "Erro"; }
    }
    setInterval(checkBluetooth, 5000);
    checkBluetooth();

    // CARREGAR JSON - COM DEBUG E FLEXIBILIDADE
    async function fetchSongsFromJSON() {
        splashText.innerText = "Baixando playlist...";
        splashStatus.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Conectando ao servidor';
        
        try {
            const response = await fetch(PLAYLIST_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const data = await response.json();
            console.log("📦 JSON recebido:", data);
            
            if (!data || data.length === 0) throw new Error("JSON vazio");
            
            // Mapeamento flexível - ACEITA DIFERENTES NOMES DE CAMPOS
            musicLibrary = data.map((item, idx) => {
                return {
                    id: item.id || idx,
                    title: item.title || item.nome || item.musica || `Música ${idx + 1}`,
                    artist: item.artist || item.artista || item.autor || "Rádio Patico",
                    src: item.src || item.url || item.audio || item.file || "",
                    genero: item.genero || item.genre || item.estilo || "MPB",
                    isLive: item.isLive || item.ao_vivo || false
                };
            }).filter(song => song.src && song.src !== ""); // Remove músicas sem fonte
            
            if (musicLibrary.length === 0) throw new Error("Nenhuma música com src válido");
            
            splashStatus.innerHTML = `<i class="fas fa-check-circle"></i> ${musicLibrary.length} músicas carregadas!`;
            splashText.innerText = "Playlist pronta!";
            console.log("✅ Músicas processadas:", musicLibrary);
            return true;
            
        } catch (error) {
            console.error("❌ ERRO:", error);
            splashStatus.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Erro: ${error.message}`;
            splashText.innerText = "Falha ao carregar";
            
            // Botão tentar novamente
            const oldBtn = document.querySelector(".error-retry");
            if (oldBtn) oldBtn.remove();
            const retryBtn = document.createElement("button");
            retryBtn.innerText = "🔄 TENTAR NOVAMENTE";
            retryBtn.className = "error-retry";
            retryBtn.onclick = () => {
                retryBtn.remove();
                fetchSongsFromJSON();
            };
            document.querySelector(".splash-content").appendChild(retryBtn);
            return false;
        }
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function updateGenreBadge(genre) {
        let icon = "fa-music";
        let label = genre;
        if (genre === "MPB") { icon = "fa-guitar"; label = "MPB"; }
        else if (genre === "MODÃO_TOP") { icon = "fa-hat-cowboy"; label = "SERTANEJO"; }
        else if (genre === "FORRÓ_ANTIGO") { icon = "fa-accordion"; label = "FORRÓ ANTIGO"; }
        else if (genre === "BREGA") { icon = "fa-heart"; label = "BREGA"; }
        else if (genre === "SAMBA") { icon = "fa-drumstick-bite"; label = "SAMBA"; }
        else if (genre === "POP") { icon = "fa-microphone-alt"; label = "POP"; }
        genreTagDiv.innerHTML = `<i class="fas ${icon}"></i> ${label}`;
        currentGenre = genre;
    }

    function filterByGenre(genre) {
        if (!musicLibrary.length) return;
        let filtered = musicLibrary.filter(s => s.genero === genre);
        if (filtered.length === 0) {
            showToast(`⚠️ Nenhuma música de ${genre}`, 1500);
            return;
        }
        currentPlaylist = shuffleArray([...filtered]);
        currentIndex = 0;
        updateGenreBadge(genre);
        loadCurrentTrack();
        if (isPlaying) playCurrentMusic();
        showToast(`🎵 ${genre.replace('_', ' ')} • ${currentPlaylist.length} músicas`, 1500);
    }

    function loadCurrentTrack() {
        if (!currentPlaylist.length) return;
        const track = currentPlaylist[currentIndex];
        trackTitleSpan.innerText = track.title;
        trackArtistSpan.innerText = track.artist;
        totalTimeSpan.innerText = "0:00";
        currentTimeSpan.innerText = "0:00";
        progressFill.style.width = "0%";
    }

    async function playCurrentMusic() {
        if (!currentPlaylist.length) return;
        const track = currentPlaylist[currentIndex];
        if (!track.src) {
            showToast(`🔇 Sem fonte: ${track.title}`, 1300);
            setTimeout(() => nextTrack(), 1000);
            return;
        }
        loaderDiv.style.display = "flex";
        player.src = track.src;
        player.load();
        
        try {
            await player.play();
            isPlaying = true;
            playBtn.innerHTML = '<i class="fas fa-pause"></i>';
            loaderDiv.style.display = "none";
            startProgressTimer();
            player.onended = () => { nextTrack(); };
        } catch (err) {
            loaderDiv.style.display = "none";
            console.error("Play error:", err);
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            showToast("Clique no play para começar", 1500);
        }
    }

    function pauseMusic() {
        player.pause();
        isPlaying = false;
        playBtn.innerHTML = '<i class="fas fa-play"></i>';
        stopProgressTimer();
    }

    function togglePlay() {
        if (isPlaying) pauseMusic();
        else playCurrentMusic();
    }

    function nextTrack() {
        if (!currentPlaylist.length) return;
        currentIndex = (currentIndex + 1) % currentPlaylist.length;
        loadCurrentTrack();
        if (isPlaying) playCurrentMusic();
        showToast("⏭️ Próxima música", 700);
    }

    function prevTrack() {
        if (!currentPlaylist.length) return;
        currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
        loadCurrentTrack();
        if (isPlaying) playCurrentMusic();
        showToast("⏮️ Anterior", 700);
    }

    function startProgressTimer() {
        if (progressInterval) clearInterval(progressInterval);
        progressInterval = setInterval(() => {
            if (player && !player.paused && player.duration) {
                const percent = (player.currentTime / player.duration) * 100;
                progressFill.style.width = percent + "%";
                currentTimeSpan.innerText = formatTime(player.currentTime);
                totalTimeSpan.innerText = formatTime(player.duration);
            }
        }, 200);
    }

    function stopProgressTimer() {
        if (progressInterval) clearInterval(progressInterval);
        progressInterval = null;
    }

    progressBg.addEventListener("click", (e) => {
        if (!player.duration) return;
        const rect = progressBg.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        player.currentTime = pos * player.duration;
    });

    // Alternância automática MPB <-> Sertanejo
    function startAlternating() {
        if (genreAlternateTimer) clearInterval(genreAlternateTimer);
        genreAlternateTimer = setInterval(() => {
            if (!musicLibrary.length) return;
            let nextGen = (currentGenre === "MPB") ? "MODÃO_TOP" : "MPB";
            const exists = musicLibrary.some(s => s.genero === nextGen);
            if (exists) filterByGenre(nextGen);
        }, 25 * 60 * 1000);
    }

    // Feedback via WhatsApp com nome da música
    function sendFeedback() {
        if (!currentPlaylist.length) return;
        const track = currentPlaylist[currentIndex];
        const msg = `🎵 *FEEDBACK RÁDIO PATICO* 🎵%0A%0AMúsica: ${track.title}%0AArtista: ${track.artist}%0AGênero: ${currentGenre}%0A%0A⭐ Minha avaliação: `;
        window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`, "_blank");
        showToast("📱 Abrindo WhatsApp", 1000);
    }

    // GESTOS TOUCH
    let touchStartX = 0;
    let lastTap = 0;
    
    document.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        const now = Date.now();
        if (now - lastTap < 300) {
            e.preventDefault();
            togglePlay();
            swipeHint.style.opacity = "1";
            setTimeout(() => swipeHint.style.opacity = "0", 800);
        }
        lastTap = now;
    });
    
    document.addEventListener('touchend', (e) => {
        const diff = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) { prevTrack(); swipeHint.innerText = "⏮️ Anterior"; }
            else { nextTrack(); swipeHint.innerText = "⏭️ Próxima"; }
            swipeHint.style.opacity = "1";
            setTimeout(() => {
                swipeHint.style.opacity = "0";
                setTimeout(() => swipeHint.innerText = "👆 Duplo toque = Play/Pause | 👉 Deslize = trocar música", 1500);
            }, 800);
        }
    });

    // INICIALIZAÇÃO
    async function init() {
        const success = await fetchSongsFromJSON();
        if (!success || musicLibrary.length === 0) return;
        
        // Definir gênero inicial
        const hasMPB = musicLibrary.some(s => s.genero === "MPB");
        const hasModao = musicLibrary.some(s => s.genero === "MODÃO_TOP");
        if (hasMPB) filterByGenre("MPB");
        else if (hasModao) filterByGenre("MODÃO_TOP");
        else filterByGenre(musicLibrary[0].genero);
        
        setTimeout(() => {
            splashDiv.style.opacity = "0";
            setTimeout(() => {
                splashDiv.style.display = "none";
                appDiv.style.display = "flex";
                // Auto-play após interação do usuário
                const startAudio = async () => {
                    await playCurrentMusic();
                    document.removeEventListener("click", startAudio);
                    document.removeEventListener("touchstart", startAudio);
                };
                document.addEventListener("click", startAudio);
                document.addEventListener("touchstart", startAudio);
                showToast("Toque na tela para ouvir", 2000);
            }, 500);
        }, 1000);
        
        startAlternating();
        
        // Eventos dos botões
        playBtn.addEventListener("click", togglePlay);
        nextBtn.addEventListener("click", nextTrack);
        prevBtn.addEventListener("click", prevTrack);
        
        // Menu 3 pontos
        const dotsBtn = document.getElementById("dotsBtn");
        const dotsMenu = document.getElementById("dotsMenu");
        dotsBtn.addEventListener("click", (e) => { e.stopPropagation(); dotsMenu.classList.toggle("open"); });
        document.addEventListener("click", (e) => { if (!dotsBtn.contains(e.target)) dotsMenu.classList.remove("open"); });
        document.getElementById("fullscreenMenuItem").addEventListener("click", () => document.documentElement.requestFullscreen());
        document.getElementById("shareMenuItem").addEventListener("click", () => {
            if (navigator.share) navigator.share({ title: "Rádio Patico", text: "🎵 Rádio com IA" });
            else { navigator.clipboard.writeText(location.href); showToast("Link copiado!"); }
        });
        document.getElementById("bluetoothMenuItem").addEventListener("click", () => { checkBluetooth(); showToast(`Bluetooth: ${btStatusSpan.innerText}`, 1500); });
        
        // Gêneros
        const genreTrigger = document.getElementById("genreTriggerBtn");
        const genrePanel = document.getElementById("genrePanel");
        genreTrigger.addEventListener("click", (e) => { e.stopPropagation(); genrePanel.classList.toggle("open"); });
        document.querySelectorAll(".genre-option").forEach(opt => {
            opt.addEventListener("click", () => {
                const gen = opt.getAttribute("data-genre");
                genrePanel.classList.remove("open");
                if (gen) filterByGenre(gen);
            });
        });
        document.addEventListener("click", (e) => { if (!e.target.closest(".genre-selector")) genrePanel.classList.remove("open"); });
        
        document.getElementById("whatsappBtn").addEventListener("click", () => window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=Olá! Quero minha playlist personalizada na Rádio Patico!`, "_blank"));
        document.getElementById("feedbackZapBtn").addEventListener("click", sendFeedback);
    }
    
    init();
</script>
</body>
</html>
