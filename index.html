<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rogerplaylist • Player Oficial</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
            flex-direction: column;
            color: white;
        }

        .splash.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .splash-content {
            text-align: center;
        }

        .splash-content i {
            font-size: 60px;
            color: #e63946;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite;
        }

        .splash-content h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .splash-content p {
            font-size: 14px;
            color: #aaa;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .player {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #000;
        }

        .video-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            z-index: 2;
        }

        .top-info {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .genre-badge {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 6px 15px;
            border-radius: 25px;
            font-size: 12px;
            color: white;
            border-left: 3px solid #e63946;
        }

        .menu-btn {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .menu-popup {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
            min-width: 150px;
        }

        .menu-popup.open {
            display: flex;
        }

        .menu-popup button {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 10px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-popup button:active {
            background: #e63946;
        }

        .controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            z-index: 10;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .track-info {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        .track-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .track-artist {
            font-size: 12px;
            color: #aaa;
        }

        .progress-area {
            margin-bottom: 10px;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .progress-bar {
            height: 3px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #e63946;
            border-radius: 3px;
            width: 0%;
            position: relative;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 10px;
        }

        .ctrl-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .ctrl-btn:active {
            transform: scale(0.95);
            background: #e63946;
        }

        .play-btn {
            background: #e63946;
            width: 55px;
            height: 55px;
            font-size: 22px;
        }

        .floating-buttons {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            z-index: 15;
            pointer-events: none;
        }

        .genre-float, .search-float, .shuffle-float {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.2s;
        }

        .genre-float {
            right: 20px;
            bottom: 100px;
            background: linear-gradient(135deg, #8E2DE2, #4A00E0);
            color: white;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .search-float {
            left: 20px;
            bottom: 100px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .shuffle-float {
            right: 20px;
            bottom: 170px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 18px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .genre-float:active, .search-float:active, .shuffle-float:active {
            transform: scale(0.9);
        }

        .modal {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 30px 30px 0 0;
            padding: 25px 20px;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .modal.open {
            transform: translateY(0);
        }

        .modal h3 {
            color: #e63946;
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .genre-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .genre-card {
            background: linear-gradient(135deg, #e63946, #ff6b6b);
            padding: 15px 10px;
            text-align: center;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .genre-card:active {
            transform: scale(0.95);
        }

        .genre-card i {
            font-size: 24px;
            color: white;
            margin-bottom: 5px;
            display: block;
        }

        .genre-card span {
            font-size: 11px;
            color: white;
            font-weight: bold;
        }

        .close-modal {
            width: 100%;
            padding: 12px;
            background: #e63946;
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .search-modal.open {
            display: flex;
        }

        .search-container {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 25px;
            padding: 20px;
            width: 90%;
            max-width: 350px;
            border: 2px solid #e63946;
        }

        .search-container input {
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 14px;
            text-align: center;
            outline: none;
        }

        .search-container input::placeholder {
            color: #aaa;
        }

        .search-results {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .search-item {
            background: rgba(255,255,255,0.1);
            padding: 10px;
            margin: 5px 0;
            border-radius: 12px;
            cursor: pointer;
        }

        .search-item:active {
            background: #e63946;
        }

        .search-item .title {
            font-weight: bold;
            color: white;
            font-size: 14px;
        }

        .search-item .artist {
            font-size: 11px;
            color: #aaa;
        }

        .tap-to-start {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ff3300, #ff6600);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 14px;
            z-index: 10000;
            cursor: pointer;
            animation: bounce 1s infinite;
            white-space: nowrap;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }
        }

        .notification {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 12px;
            z-index: 10001;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            white-space: nowrap;
        }

        .notification.show {
            opacity: 1;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 50px;
            color: white;
            font-size: 14px;
            z-index: 10002;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .loading.show {
            display: flex;
        }

        .audio-indicator {
            position: fixed;
            top: 20px;
            right: 70px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 10px;
            color: #ffaa00;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>
    <div class="splash" id="splash">
        <div class="splash-content">
            <i class="fas fa-music"></i>
            <h1>Rogerplaylist</h1>
            <p>🎵 Carregando sua playlist...</p>
            <p id="splashStatus" style="margin-top: 10px; font-size: 12px;"><i class="fas fa-circle-notch fa-spin"></i> Buscando músicas</p>
        </div>
    </div>

    <div class="tap-to-start" id="tapToStart">🎵 ATIVAR ÁUDIO</div>
    <div class="notification" id="notification">Mensagem</div>
    <div class="loading" id="loading">
        <i class="fas fa-circle-notch fa-spin"></i>
        <span>Carregando música...</span>
    </div>

    <div class="player" id="player" style="display: none;">
        <video class="video-bg" id="bgVideo" autoplay loop muted playsinline>
            <source src="pai12345.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>

        <div class="top-info">
            <div class="genre-badge" id="genreBadge">
                <i class="fas fa-music"></i> <span id="currentGenre">Carregando</span>
            </div>
            <div class="menu-btn" id="menuBtn">
                <i class="fas fa-ellipsis-v"></i>
            </div>
        </div>

        <div class="menu-popup" id="menuPopup">
            <button id="shareBtn"><i class="fas fa-share-alt"></i> Compartilhar</button>
            <button id="fullscreenBtn"><i class="fas fa-expand"></i> Tela Cheia</button>
            <button id="reportBtn"><i class="fas fa-chart-simple"></i> Relatório</button>
        </div>

        <div class="audio-indicator" id="audioIndicator">
            <i class="fas fa-circle"></i> Aguardando
        </div>

        <div class="controls">
            <div class="track-info">
                <div class="track-title" id="trackTitle">Carregando...</div>
                <div class="track-artist" id="trackArtist">...</div>
            </div>
            <div class="progress-area">
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            <div class="buttons">
                <button class="ctrl-btn" id="prevBtn"><i class="fas fa-step-backward"></i></button>
                <button class="ctrl-btn play-btn" id="playBtn"><i class="fas fa-play"></i></button>
                <button class="ctrl-btn" id="nextBtn"><i class="fas fa-step-forward"></i></button>
            </div>
        </div>

        <div class="floating-buttons">
            <div class="shuffle-float" id="shuffleBtn">
                <i class="fas fa-random"></i>
            </div>
            <div class="genre-float" id="genreFloatBtn">
                <i class="fas fa-guitar"></i>
            </div>
            <div class="search-float" id="searchFloatBtn">
                <i class="fas fa-search"></i>
            </div>
        </div>

        <div class="modal" id="genreModal">
            <h3><i class="fas fa-head-side-brain"></i> ESCOLHA SEU ESTILO</h3>
            <div class="genre-grid" id="genreGrid"></div>
            <button class="close-modal" id="closeGenreBtn">FECHAR</button>
        </div>

        <div class="search-modal" id="searchModal">
            <div class="search-container">
                <h3><i class="fas fa-search"></i> BUSCAR MÚSICA</h3>
                <input type="text" id="searchInput" placeholder="Digite o nome da música ou artista..." autocomplete="off">
                <div class="search-results" id="searchResults"></div>
                <button class="close-modal" id="closeSearchBtn" style="margin-top: 15px;">FECHAR</button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script>
        // ==================== CONFIGURAÇÃO ====================
        const PLAYLIST_URL = "https://raw.githubusercontent.com/radioplaylist12/partico/refs/heads/main/listroger.json";
        
        const GENEROS = ["FORRÓ", "FORRÓ ANTIGO", "BREGA", "MPB", "POP", "SERTANEJO", "MODARAIZ", "SAMBA"];
        
        const NOMES_GENEROS = {
            "FORRÓ": "Forró",
            "FORRÓ ANTIGO": "Forró Antigo",
            "BREGA": "Brega",
            "MPB": "MPB",
            "POP": "Pop",
            "SERTANEJO": "Sertanejo",
            "MODARAIZ": "Moda Raiz",
            "SAMBA": "Samba"
        };
        
        const ICONES_GENEROS = {
            "FORRÓ": "fa-drum",
            "FORRÓ ANTIGO": "fa-accordion",
            "BREGA": "fa-heart-broken",
            "MPB": "fa-guitar",
            "POP": "fa-microphone-alt",
            "SERTANEJO": "fa-guitar",
            "MODARAIZ": "fa-hat-cowboy",
            "SAMBA": "fa-drumstick-bite"
        };
        
        const CORES_GENEROS = {
            "FORRÓ": "linear-gradient(135deg,#f12711,#f5af19)",
            "FORRÓ ANTIGO": "linear-gradient(135deg,#8E2DE2,#4A00E0)",
            "BREGA": "linear-gradient(135deg,#ff6b6b,#ee5a24)",
            "MPB": "linear-gradient(135deg,#134e5e,#71b280)",
            "POP": "linear-gradient(135deg,#2193b0,#6dd5ed)",
            "SERTANEJO": "linear-gradient(135deg,#e63946,#ff6b6b)",
            "MODARAIZ": "linear-gradient(135deg,#cc2b5e,#753a88)",
            "SAMBA": "linear-gradient(135deg,#f2994a,#f2c94c)"
        };
        
        // ==================== VARIÁVEIS ====================
        let todasMusicas = [];
        let playlistAtual = [];
        let currentIndex = 0;
        let isPlaying = false;
        let audioAtivo = false;
        let generoSelecionado = null;
        let modoAleatorio = false;
        let timerInterval = null;
        
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const currentGenreSpan = document.getElementById('currentGenre');
        const splash = document.getElementById('splash');
        const tapToStart = document.getElementById('tapToStart');
        const player = document.getElementById('player');
        const notification = document.getElementById('notification');
        const loading = document.getElementById('loading');
        const audioIndicator = document.getElementById('audioIndicator');
        
        audio.volume = 0.9;
        
        function showNotification(msg, duration = 2000) {
            notification.textContent = msg;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), duration);
        }
        
        function showLoading(show) {
            if (show) loading.classList.add('show');
            else loading.classList.remove('show');
        }
        
        function formatTime(sec) {
            if (!sec || isNaN(sec)) return "0:00";
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }
        
        function getMusicaAleatoria(lista, evitarId = null) {
            if (!lista || lista.length === 0) return null;
            let candidatas = lista;
            if (evitarId && lista.length > 1) {
                candidatas = lista.filter(m => m.id !== evitarId);
                if (candidatas.length === 0) candidatas = lista;
            }
            return candidatas[Math.floor(Math.random() * candidatas.length)];
        }
        
        function getProximaMusica() {
            if (todasMusicas.length === 0) return null;
            
            let musicasFiltradas = todasMusicas;
            if (generoSelecionado) {
                musicasFiltradas = todasMusicas.filter(m => m.genero === generoSelecionado);
                if (musicasFiltradas.length === 0) musicasFiltradas = todasMusicas;
            }
            
            const ultimaMusica = playlistAtual[currentIndex];
            const evitarId = modoAleatorio && ultimaMusica ? ultimaMusica.id : null;
            let proxima = getMusicaAleatoria(musicasFiltradas, evitarId);
            if (!proxima) proxima = getMusicaAleatoria(musicasFiltradas);
            return proxima;
        }
        
        function updateGenreBadge(genero) {
            currentGenreSpan.textContent = NOMES_GENEROS[genero] || genero;
        }
        
        function loadTrack(musica) {
            if (!musica) return;
            trackTitle.textContent = musica.title;
            trackArtist.textContent = musica.artist;
            updateGenreBadge(musica.genero);
            
            // CORREÇÃO IMPORTANTE: Adiciona o caminho base se necessário
            let srcUrl = musica.src;
            if (srcUrl && !srcUrl.startsWith('http') && !srcUrl.startsWith('https') && !srcUrl.startsWith('//')) {
                // Se for caminho relativo, mantém como está (arquivos .m4a na mesma pasta)
                srcUrl = srcUrl;
            }
            audio.src = srcUrl;
            audio.load();
            
            currentTimeEl.textContent = "0:00";
            totalTimeEl.textContent = "0:00";
            progressFill.style.width = "0%";
        }
        
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isPlaying && audio.duration && !audio.paused) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = percent + '%';
                    currentTimeEl.textContent = formatTime(audio.currentTime);
                }
            }, 200);
        }
        
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        async function playMusic() {
            if (!audioAtivo) {
                showNotification("⚠️ Clique em 'ATIVAR ÁUDIO' primeiro!");
                return;
            }
            if (!playlistAtual.length || !playlistAtual[currentIndex]) {
                nextTrack();
                return;
            }
            
            showLoading(true);
            try {
                await audio.play();
                isPlaying = true;
                playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                startTimer();
                audio.addEventListener('loadedmetadata', () => {
                    totalTimeEl.textContent = formatTime(audio.duration);
                    showLoading(false);
                }, { once: true });
            } catch(e) {
                console.error("Erro ao tocar:", e);
                showNotification("❌ Erro ao reproduzir música. Verifique se o arquivo existe.");
                showLoading(false);
            }
        }
        
        function pauseMusic() {
            audio.pause();
            isPlaying = false;
            playBtn.innerHTML = '<i class="fas fa-play"></i>';
            stopTimer();
        }
        
        function togglePlay() {
            if (!audioAtivo) {
                showNotification("Ative o áudio primeiro!");
                return;
            }
            isPlaying ? pauseMusic() : playMusic();
        }
        
        function nextTrack() {
            const proxima = getProximaMusica();
            if (proxima) {
                playlistAtual = [proxima];
                currentIndex = 0;
                loadTrack(proxima);
                if (isPlaying) playMusic();
                showNotification(`⏭️ ${proxima.title} - ${proxima.artist}`);
            } else {
                showNotification("⚠️ Nenhuma música encontrada!");
            }
        }
        
        function prevTrack() {
            let musicasDisponiveis = todasMusicas;
            if (generoSelecionado) {
                musicasDisponiveis = todasMusicas.filter(m => m.genero === generoSelecionado);
                if (musicasDisponiveis.length === 0) musicasDisponiveis = todasMusicas;
            }
            const outras = musicasDisponiveis.filter(m => m.id !== playlistAtual[0]?.id);
            if (outras.length > 0) {
                const anterior = getMusicaAleatoria(outras);
                playlistAtual = [anterior];
                currentIndex = 0;
                loadTrack(anterior);
                if (isPlaying) playMusic();
                showNotification(`⏮️ ${anterior.title} - ${anterior.artist}`);
            }
        }
        
        function buscarMusicas(query) {
            if (!query.trim()) return [];
            const termo = query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            return todasMusicas.filter(m => {
                const titulo = m.title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                const artista = m.artist.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                return titulo.includes(termo) || artista.includes(termo);
            });
        }
        
        async function carregarPlaylist() {
            try {
                const splashStatus = document.getElementById('splashStatus');
                splashStatus.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Baixando playlist...';
                
                const url = `${PLAYLIST_URL}?t=${Date.now()}`;
                console.log("🔄 Carregando:", url);
                
                const response = await fetch(url, {
                    cache: 'no-store',
                    headers: { 'Cache-Control': 'no-cache' }
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status} - Arquivo não encontrado!`);
                
                const data = await response.json();
                
                if (!data || data.length === 0) throw new Error("JSON vazio!");
                
                todasMusicas = data.map((m, idx) => ({
                    ...m,
                    id: m.id || `musica_${idx}`,
                    genero: m.genero || "POP"
                }));
                
                console.log(`✅ Carregadas ${todasMusicas.length} músicas!`);
                splashStatus.innerHTML = `📀 ${todasMusicas.length} músicas carregadas!`;
                
                const primeira = getMusicaAleatoria(todasMusicas);
                playlistAtual = [primeira];
                currentIndex = 0;
                loadTrack(primeira);
                
                criarGridGeneros();
                
                setTimeout(() => {
                    splash.classList.add('hidden');
                    setTimeout(() => {
                        splash.style.display = 'none';
                        player.style.display = 'block';
                        tapToStart.style.display = 'block';
                    }, 500);
                }, 1000);
                
            } catch(error) {
                console.error("❌ Erro:", error);
                document.getElementById('splashStatus').innerHTML = `❌ ${error.message}`;
                setTimeout(() => {
                    splash.classList.add('hidden');
                    player.style.display = 'block';
                    tapToStart.style.display = 'block';
                }, 3000);
            }
        }
        
        function criarGridGeneros() {
            const grid = document.getElementById('genreGrid');
            if (!grid) return;
            grid.innerHTML = '';
            
            const todosCard = document.createElement('div');
            todosCard.className = 'genre-card';
            todosCard.style.background = "linear-gradient(135deg,#00b4db,#0083b0)";
            todosCard.innerHTML = '<i class="fas fa-list-ul"></i><span>TODOS</span>';
            todosCard.onclick = () => {
                generoSelecionado = null;
                showNotification("🎵 Modo: TODOS OS GÊNEROS");
                document.getElementById('genreModal').classList.remove('open');
                nextTrack();
            };
            grid.appendChild(todosCard);
            
            const mpbPopCard = document.createElement('div');
            mpbPopCard.className = 'genre-card';
            mpbPopCard.style.background = "linear-gradient(135deg,#e63946,#ff6b6b)";
            mpbPopCard.innerHTML = '<i class="fas fa-exchange-alt"></i><span>MPB/POP</span>';
            mpbPopCard.onclick = () => {
                generoSelecionado = null;
                showNotification("🎵 Modo: MPB e POP alternando");
                document.getElementById('genreModal').classList.remove('open');
                nextTrack();
            };
            grid.appendChild(mpbPopCard);
            
            GENEROS.forEach(genero => {
                const card = document.createElement('div');
                card.className = 'genre-card';
                card.style.background = CORES_GENEROS[genero] || "linear-gradient(135deg,#666,#333)";
                const icone = ICONES_GENEROS[genero] || "fa-music";
                const nome = NOMES_GENEROS[genero] || genero;
                card.innerHTML = `<i class="fas ${icone}"></i><span>${nome}</span>`;
                card.onclick = () => {
                    generoSelecionado = genero;
                    showNotification(`🎵 Modo: ${nome}`);
                    document.getElementById('genreModal').classList.remove('open');
                    nextTrack();
                };
                grid.appendChild(card);
            });
        }
        
        async function ativarAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    const ctx = new AudioContext();
                    await ctx.resume();
                }
                audioAtivo = true;
                tapToStart.style.display = 'none';
                audioIndicator.innerHTML = '<i class="fas fa-check-circle"></i> Áudio Ativo';
                audioIndicator.style.color = '#4ade80';
                showNotification("✅ Áudio ativado!");
                try { await document.documentElement.requestFullscreen(); } catch(e) {}
                await playMusic();
            } catch(e) {
                console.error("Erro:", e);
                showNotification("❌ Clique novamente");
            }
        }
        
        audio.addEventListener('timeupdate', () => {
            if (audio.duration && !audio.paused) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
            }
        });
        audio.addEventListener('ended', () => nextTrack());
        audio.addEventListener('error', () => {
            showNotification("⚠️ Erro no áudio, pulando...");
            nextTrack();
        });
        
        document.getElementById('progressBar').addEventListener('click', (e) => {
            if (audio.duration) {
                const rect = e.currentTarget.getBoundingClientRect();
                audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
            }
        });
        
        playBtn.addEventListener('click', togglePlay);
        document.getElementById('nextBtn').addEventListener('click', nextTrack);
        document.getElementById('prevBtn').addEventListener('click', prevTrack);
        document.getElementById('shuffleBtn').addEventListener('click', () => {
            modoAleatorio = !modoAleatorio;
            showNotification(modoAleatorio ? '🔀 Aleatório ON' : '➡️ Sequencial OFF');
        });
        document.getElementById('genreFloatBtn').addEventListener('click', () => document.getElementById('genreModal').classList.add('open'));
        document.getElementById('closeGenreBtn').addEventListener('click', () => document.getElementById('genreModal').classList.remove('open'));
        document.getElementById('searchFloatBtn').addEventListener('click', () => document.getElementById('searchModal').classList.add('open'));
        document.getElementById('closeSearchBtn').addEventListener('click', () => {
            document.getElementById('searchModal').classList.remove('open');
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = '';
        });
        
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const resultados = buscarMusicas(e.target.value);
            const container = document.getElementById('searchResults');
            container.innerHTML = '';
            if (resultados.length === 0) {
                container.innerHTML = '<div style="color:#aaa; text-align:center; padding:20px;">Nenhuma música encontrada</div>';
                return;
            }
            resultados.forEach(m => {
                const item = document.createElement('div');
                item.className = 'search-item';
                item.innerHTML = `<div class="title">${m.title}</div><div class="artist">${m.artist} [${NOMES_GENEROS[m.genero] || m.genero}]</div>`;
                item.onclick = () => {
                    playlistAtual = [m];
                    currentIndex = 0;
                    loadTrack(m);
                    if (isPlaying) playMusic();
                    document.getElementById('searchModal').classList.remove('open');
                    showNotification(`🎵 Tocando: ${m.title}`);
                };
                container.appendChild(item);
            });
        });
        
        document.getElementById('menuBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('menuPopup').classList.toggle('open');
        });
        document.addEventListener('click', () => document.getElementById('menuPopup').classList.remove('open'));
        document.getElementById('shareBtn').addEventListener('click', () => {
            if (navigator.share) navigator.share({ title: 'Rogerplaylist', url: location.href });
            else { navigator.clipboard.writeText(location.href); showNotification("🔗 Link copiado!"); }
        });
        document.getElementById('fullscreenBtn').addEventListener('click', () => document.documentElement.requestFullscreen());
        document.getElementById('reportBtn').addEventListener('click', () => showNotification(`📊 Total: ${todasMusicas.length} músicas`));
        tapToStart.addEventListener('click', ativarAudio);
        
        let touchStart = 0;
        document.addEventListener('touchstart', (e) => { touchStart = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', (e) => {
            const diff = e.changedTouches[0].screenX - touchStart;
            if (Math.abs(diff) > 50) diff > 0 ? prevTrack() : nextTrack();
        });
        
        setInterval(() => {
            const video = document.getElementById('bgVideo');
            if (video && video.paused) video.play().catch(e => console.log);
        }, 3000);
        
        carregarPlaylist();
    </script>
</body>
</html>
